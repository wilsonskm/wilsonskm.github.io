<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invigilation Master Timeline Creator v1.0 (for Special Examination Arrangements)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Production versions for stability) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- ExcelJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    
    <style>
        body { background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 1. Destructure dependencies from global objects
        const { useState, useEffect, useRef } = React;

        // --- Inline Icons to avoid CDN issues ---
        const Icon = ({ children, className = "", ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" height="24" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={`lucide ${className}`}
                {...props}
            >
                {children}
            </svg>
        );

        const Clock = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
        const Clipboard = (props) => <Icon {...props}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></Icon>;
        const Trash2 = (props) => <Icon {...props}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></Icon>;
        const ArrowRight = (props) => <Icon {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></Icon>;
        const AlertCircle = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></Icon>;
        const FileText = (props) => <Icon {...props}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 13H8"/><path d="M16 13h-2"/><path d="M10 17H8"/><path d="M16 17h-2"/><path d="M10 9H8"/></Icon>;
        const User = (props) => <Icon {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Icon>;
        const PenTool = (props) => <Icon {...props}><path d="M15.707 21.293a1 1 0 0 1-1.414 0l-1.586-1.586a1 1 0 0 1 0-1.414l5.586-5.586a1 1 0 0 1 1.414 0l1.586 1.586a1 1 0 0 1 0 1.414z"/><path d="m18 13-1.375-6.874a1 1 0 0 0-.746-.776L3.235 2.079a1 1 0 0 0-1.156 1.156L5.35 15.88a1 1 0 0 0 .776.746L13 18"/><path d="m2.3 2.3 7.286 7.286"/><circle cx="11" cy="11" r="2"/></Icon>;
        const AlertTriangle = (props) => <Icon {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></Icon>;
        const Calendar = (props) => <Icon {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></Icon>;
        const FileSpreadsheet = (props) => <Icon {...props}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2"/><path d="M14 13h2"/><path d="M8 17h2"/><path d="M14 17h2"/></Icon>;
        const Download = (props) => <Icon {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></Icon>;
        const Upload = (props) => <Icon {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></Icon>;

        // 2. Main Application Component
        const App = () => {
          // Defaulting to a CSV-style example to demonstrate the new feature immediately
          const [inputText, setInputText] = useState(`Updated 1/1/2026,4AXX,4BXX,4CXX,4DXX
2026-01-05,Chin 1,Chin 1,Chin 1,Chin 1
,08:30 - 09:15 (45 min),08:30 - 09:15 (45 min),08:30 - 09:15 (45 min),08:30 - 10:00 (90 min)
,09:15 - 09:20 (5 min) (break),09:15 - 09:20 (5 min) (break),09:15 - 09:20 (5 min) (break),
,09:20 - 10:05 (45 min),09:20 - 10:05 (45 min),09:20 - 10:05 (45 min),
,,,,
2026-01-06,Eng 1,Eng 1,Eng 1,Eng 1
,10:00 - 11:00 (60 min) [10:30 black -> blue],10:00 - 11:00 (60 min),10:00 - 11:00 (60 min),10:00 - 11:00 (60 min)`);

          const [schedule, setSchedule] = useState([]);
          const [dates, setDates] = useState([]);
          const [selectedDate, setSelectedDate] = useState('');
          const [error, setError] = useState('');
          const [inputType, setInputType] = useState('unknown'); // 'text' or 'csv'
          const [isExcelLibReady, setIsExcelLibReady] = useState(false);
          
          const fileInputRef = useRef(null);

          // Load ExcelJS Library (Check Global)
          useEffect(() => {
            if (window.ExcelJS) {
              setIsExcelLibReady(true);
            }
          }, []);

          // Helper: Convert "HH:MM" to minutes from midnight
          const timeToMinutes = (timeStr) => {
            if (!timeStr) return 0;
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
          };

          // Helper: Convert minutes from midnight to "HH:MM"
          const minutesToTime = (totalMinutes) => {
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
          };

          // Helper: Format Date with Day of Week
          const formatDateWithDay = (dateStr) => {
            if (!dateStr || dateStr === 'Unknown Date' || dateStr === 'Default Schedule') return dateStr;
            
            // Check if format is already YYYY-MM-DD
            const isoDateRegex = /^\d{4}-\d{2}-\d{2}$/;
            
            let dateObj;
            if (isoDateRegex.test(dateStr)) {
                // If YYYY-MM-DD, parsing as UTC ensures no shift
                dateObj = new Date(dateStr);
            } else {
                // Fallback for other formats
                dateObj = new Date(dateStr);
            }

            if (isNaN(dateObj.getTime())) return dateStr; 

            // We use UTC to display the day correctly if input was YYYY-MM-DD
            const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' });
            
            // Ensure we return clean YYYY-MM-DD + Day
            const cleanDateStr = dateObj.toISOString().split('T')[0];
            
            return `${cleanDateStr} (${dayName})`;
          };

          // --- Parsing Logic ---

          const parseInput = (text) => {
            // Basic detection: if the first line has commas, assume CSV
            const firstLine = text.trim().split('\n')[0] || '';
            if (firstLine.includes(',')) {
                setInputType('csv');
                return parseCSV(text);
            } else {
                setInputType('text');
                return parseText(text);
            }
          };

          const parseText = (text) => {
            const lines = text.split('\n');
            const students = [];
            
            let currentStudent = null;
            let currentSession = null;
            const defaultDate = 'Default Schedule';

            // Regex patterns
            const timeRegex = /(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/;
            const penRegex = /\[(\d{1,2}:\d{2})\s+([a-zA-Z]+)\s*->\s*([a-zA-Z]+)\]/;
            
            lines.forEach((line) => {
              const trimmedLine = line.trim();
              if (!trimmedLine) return;

              if (trimmedLine.toLowerCase().startsWith('student')) {
                currentStudent = { name: trimmedLine, sessions: [] };
                students.push(currentStudent);
                currentSession = null;
                return;
              }
              if (!currentStudent) {
                currentStudent = { name: "Student 1", sessions: [] };
                students.push(currentStudent);
              }

              const timeMatch = trimmedLine.match(timeRegex);
              if (timeMatch) {
                if (!currentSession) {
                  currentSession = { name: "Exam Session", blocks: [] };
                  currentStudent.sessions.push(currentSession);
                }

                const isBreak = trimmedLine.toLowerCase().includes('break');
                const startStr = timeMatch[1];
                const endStr = timeMatch[2];

                // Check for Pen Change
                const penMatch = trimmedLine.match(penRegex);
                let penEvent = null;
                if (penMatch) {
                    penEvent = {
                        time: penMatch[1],
                        fromColor: penMatch[2],
                        toColor: penMatch[3]
                    };
                }

                currentSession.blocks.push({
                  start: startStr,
                  end: endStr,
                  startMin: timeToMinutes(startStr),
                  endMin: timeToMinutes(endStr),
                  isBreak: isBreak,
                  penEvent: penEvent,
                  originalLine: trimmedLine
                });
              } else {
                const cleanName = trimmedLine.split('(')[0].trim();
                currentSession = { name: cleanName || trimmedLine, blocks: [] };
                currentStudent.sessions.push(currentSession);
              }
            });

            return { [defaultDate]: students };
          };

          const parseCSV = (text) => {
            const rows = text.split('\n');
            const studentMap = {}; // colIndex -> Student Object
            const dateGroups = {}; // dateString -> [Student Objects]
            
            // Regex
            const timeRegex = /(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/;
            const penRegex = /\[(\d{1,2}:\d{2})\s+([a-zA-Z]+)\s*->\s*([a-zA-Z]+)\]/;

            // Helper to split CSV line respecting quotes (simple version)
            const splitCSV = (row) => {
                const matches = [];
                let current = '';
                let inQuote = false;
                for (let i = 0; i < row.length; i++) {
                    const char = row[i];
                    if (char === '"') {
                        inQuote = !inQuote;
                    } else if (char === ',' && !inQuote) {
                        matches.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                matches.push(current.trim());
                return matches;
            };

            // 1. Header Row
            const headerRow = splitCSV(rows[0]);
            
            // Initialize students map based on columns
            headerRow.forEach((col, idx) => {
                if (idx > 0 && col) {
                    studentMap[idx] = { 
                        name: col.replace(/^"|"$/g, ''), // remove quotes
                        id: idx 
                    };
                }
            });

            let currentDate = 'Unknown Date';

            // 2. Iterate Data Rows
            for (let i = 1; i < rows.length; i++) {
                const rowStr = rows[i].trim();
                if (!rowStr) continue;

                const cells = splitCSV(rowStr);
                const firstCell = cells[0];

                // Detect Date in first column (YYYY-MM-DD or similar)
                if (firstCell && !timeRegex.test(firstCell) && firstCell.length > 5) {
                    currentDate = firstCell.replace(/^"|"$/g, '');
                }

                // Initialize date group if not exists
                if (!dateGroups[currentDate]) {
                    dateGroups[currentDate] = {}; 
                    Object.keys(studentMap).forEach(key => {
                        dateGroups[currentDate][studentMap[key].id] = {
                            name: studentMap[key].name,
                            sessions: []
                        };
                    });
                }

                // Process columns for this row
                cells.forEach((cell, idx) => {
                    if (idx === 0) return; // Skip date column
                    if (!studentMap[idx]) return; // Skip unknown columns
                    if (!cell) return; // Skip empty cells

                    const cleanCell = cell.replace(/^"|"$/g, '');
                    const studentId = studentMap[idx].id;
                    const studentData = dateGroups[currentDate][studentId];

                    // Is it a Time Block?
                    const timeMatch = cleanCell.match(timeRegex);
                    
                    if (timeMatch) {
                        let activeSession = studentData.sessions[studentData.sessions.length - 1];
                        if (!activeSession) {
                            activeSession = { name: "Unspecified Subject", blocks: [] };
                            studentData.sessions.push(activeSession);
                        }

                        const startStr = timeMatch[1];
                        const endStr = timeMatch[2];
                        const isBreak = cleanCell.toLowerCase().includes('break');
                        
                        // Pen Check
                        const penMatch = cleanCell.match(penRegex);
                        let penEvent = null;
                        if (penMatch) {
                            penEvent = {
                                time: penMatch[1],
                                fromColor: penMatch[2],
                                toColor: penMatch[3]
                            };
                        }

                        activeSession.blocks.push({
                            start: startStr,
                            end: endStr,
                            startMin: timeToMinutes(startStr),
                            endMin: timeToMinutes(endStr),
                            isBreak: isBreak,
                            penEvent: penEvent,
                            originalLine: cleanCell
                        });

                    } else {
                        // Not a time block -> Likely a Subject Name
                        const subjectName = cleanCell.split('(')[0].trim();
                        studentData.sessions.push({
                            name: subjectName,
                            blocks: []
                        });
                    }
                });
            }

            // Convert Object Maps back to Arrays
            const finalResult = {};
            Object.keys(dateGroups).forEach(date => {
                finalResult[date] = Object.values(dateGroups[date]);
            });
            
            return finalResult;
          };

          const finalizeEvent = (group) => {
            const uniqueDetails = Array.from(group.detailsSet);
            return {
                ...group,
                label: `${group.baseLabel} (${group.students.join(', ')})`,
                details: uniqueDetails.length > 0 ? uniqueDetails.join(', ') : null
            };
          };

          const generateTimeline = (students) => {
            if (!students) return [];

            let rawEvents = [];

            students.forEach(student => {
                // Filter out empty sessions
                const validSessions = student.sessions.filter(s => s.blocks.length > 0);

                validSessions.forEach(session => {
                    const firstBlock = session.blocks[0];
                    const lastBlock = session.blocks[session.blocks.length - 1];
                    
                    // 1. Session Start
                    rawEvents.push({
                        time: firstBlock.startMin,
                        displayTime: firstBlock.start,
                        baseLabel: `${session.name} start`,
                        type: 'start',
                        student: student.name
                    });

                    // 2. Iterate Blocks for Breaks and Pen Changes
                    session.blocks.forEach(block => {
                        // Break Start/End
                        if (block.isBreak) {
                            rawEvents.push({
                                time: block.startMin,
                                displayTime: block.start,
                                baseLabel: `break start`,
                                type: 'break-start',
                                student: student.name
                            });
                            rawEvents.push({
                                time: block.endMin,
                                displayTime: block.end,
                                baseLabel: `break end`,
                                type: 'break-end',
                                student: student.name
                            });
                        }

                        // Pen Change
                        if (block.penEvent) {
                            rawEvents.push({
                                time: timeToMinutes(block.penEvent.time),
                                displayTime: block.penEvent.time,
                                baseLabel: `change pen`,
                                details: `${block.penEvent.fromColor} to ${block.penEvent.toColor}`,
                                type: 'pen-change',
                                student: student.name
                            });
                        }
                    });

                    // 3. End Warnings (15m and 5m before the very end of the session)
                    const endTimeMin = lastBlock.endMin;
                    
                    if (endTimeMin - 15 > firstBlock.startMin) {
                        rawEvents.push({
                            time: endTimeMin - 15,
                            displayTime: minutesToTime(endTimeMin - 15),
                            baseLabel: `15 min left`,
                            type: 'warning',
                            student: student.name
                        });
                    }

                    if (endTimeMin - 5 > firstBlock.startMin) {
                        rawEvents.push({
                            time: endTimeMin - 5,
                            displayTime: minutesToTime(endTimeMin - 5),
                            baseLabel: `5 min left`,
                            type: 'warning',
                            student: student.name
                        });
                    }

                    // 4. Session End
                    rawEvents.push({
                        time: endTimeMin,
                        displayTime: lastBlock.end,
                        baseLabel: `${session.name} end`,
                        type: 'end',
                        student: student.name
                    });
                });
            });

            // Sort chronologically
            rawEvents.sort((a, b) => {
              if (a.time !== b.time) return a.time - b.time;
              // Secondary sort: Start > Pen Change > Warning > Break > End
              const typePriority = { 
                  'start': 1, 
                  'pen-change': 2,
                  'break-start': 3,
                  'break-end': 4,
                  'warning': 5,
                  'end': 6 
              };
              return (typePriority[a.type] || 9) - (typePriority[b.type] || 9);
            });

            // Merge logic
            if (rawEvents.length === 0) return [];
            
            const mergedEvents = [];
            let currentGroup = {
                ...rawEvents[0],
                students: [rawEvents[0].student],
                detailsSet: new Set(rawEvents[0].details ? [rawEvents[0].details] : [])
            };

            for (let i = 1; i < rawEvents.length; i++) {
                const event = rawEvents[i];
                const prev = currentGroup;

                // Merge condition: Same time, same type, same base label
                if (event.time === prev.time && 
                    event.type === prev.type && 
                    event.baseLabel === prev.baseLabel) {
                    
                    currentGroup.students.push(event.student);
                    if (event.details) {
                        currentGroup.detailsSet.add(event.details);
                    }
                } else {
                    // Finalize current group
                    mergedEvents.push(finalizeEvent(currentGroup));
                    
                    // Start new group
                    currentGroup = {
                        ...event,
                        students: [event.student],
                        detailsSet: new Set(event.details ? [event.details] : [])
                    };
                }
            }
            // Finalize last group
            mergedEvents.push(finalizeEvent(currentGroup));

            // Post-processing: Identify Clashes
            const eventsByTime = {};
            mergedEvents.forEach(e => {
                if (!eventsByTime[e.time]) eventsByTime[e.time] = [];
                eventsByTime[e.time].push(e);
            });

            const finalEvents = mergedEvents.map(e => {
                const eventsAtSameTime = eventsByTime[e.time];
                
                // If there's only one event group at this time, no clash
                if (!eventsAtSameTime || eventsAtSameTime.length <= 1) {
                    return { ...e, isClash: false };
                }
                
                // If multiple events, check if they are of DIFFERENT types
                const typesAtTime = new Set(eventsAtSameTime.map(ev => ev.type));
                
                // If set size > 1, it means we have at least two different types
                const isClash = typesAtTime.size > 1;
                
                return { ...e, isClash };
            });

            return finalEvents;
          };

          // --- Export Logic (XLSX) ---

          const exportToExcel = async () => {
            if (!window.ExcelJS) {
                alert("Excel export library is loading, please wait...");
                return;
            }

            try {
              const parsedGroups = parseInput(inputText);
              const datesToExport = Object.keys(parsedGroups);
              
              if (datesToExport.length === 0) {
                alert("No data to export");
                return;
              }

              const workbook = new window.ExcelJS.Workbook();
              
              // Define Styles
              const styles = {
                  header: { 
                      font: { bold: true, color: { argb: 'FFFFFFFF' }, size: 14 }, 
                      fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF4F46E5' } } // Indigo-600
                  },
                  subheader: { 
                      font: { bold: true }, 
                      fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE5E7EB' } } // Gray-200
                  },
                  clash: { 
                      fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF991B1B' } }, // Dark Red
                      font: { color: { argb: 'FFFFFFFF' } } // White Text
                  },
                  start: { 
                      fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD1FAE5' } }, // Green-100
                      font: { color: { argb: 'FF065F46' } } // Green-800
                  },
                  end: { 
                      fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEE2E2' } }, // Red-100
                      font: { color: { argb: 'FF991B1B' } }
                  },
                  warning: { 
                      fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEF3C7' } }, // Amber-100
                      font: { color: { argb: 'FF92400E' } }
                  },
                  pen: { 
                      fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF3E8FF' } }, // Purple-100
                      font: { color: { argb: 'FF6B21A8' } }
                  },
                  break: { 
                      fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF3F4F6' } }, // Gray-100
                      font: { color: { argb: 'FF374151' } }
                  },
                  default: {
                      font: { color: { argb: 'FF000000' } }
                  }
              };

              // Loop through each date
              datesToExport.forEach(date => {
                const formattedDate = formatDateWithDay(date);
                const safeSheetName = formattedDate.replace(/[\/\\?*\[\]:]/g, '-').substring(0, 31) || `Date ${Math.floor(Math.random() * 1000)}`;
                const worksheet = workbook.addWorksheet(safeSheetName);
                
                let currentRowIndex = 1;

                worksheet.columns = [
                    { header: '', key: 'time', width: 15 },
                    { header: '', key: 'type', width: 15 },
                    { header: '', key: 'label', width: 60 },
                    { header: '', key: 'details', width: 30 },
                ];

                const timeline = generateTimeline(parsedGroups[date]);
                
                // Date Header
                worksheet.mergeCells(`A${currentRowIndex}:D${currentRowIndex}`);
                const dateCell = worksheet.getCell(`A${currentRowIndex}`);
                dateCell.value = formattedDate;
                dateCell.fill = styles.header.fill;
                dateCell.font = styles.header.font;
                dateCell.alignment = { vertical: 'middle', horizontal: 'center' };
                currentRowIndex++;

                // Subheader
                const headers = ['Time', 'Type', 'Event', 'Details'];
                const headerRow = worksheet.getRow(currentRowIndex);
                headerRow.values = headers;
                headerRow.eachCell((cell) => {
                    cell.fill = styles.subheader.fill;
                    cell.font = styles.subheader.font;
                    cell.border = { bottom: { style: 'thin' } };
                });
                currentRowIndex++;

                if (timeline.length === 0) {
                    worksheet.mergeCells(`A${currentRowIndex}:D${currentRowIndex}`);
                    worksheet.getCell(`A${currentRowIndex}`).value = "No events found";
                    currentRowIndex++;
                }

                timeline.forEach(event => {
                    const row = worksheet.getRow(currentRowIndex);
                    
                    const detailsText = `${event.details || ''}${event.isClash ? ' [CLASH]' : ''}`;
                    row.values = [event.displayTime, event.type, event.label, detailsText];

                    let style = styles.default;
                    if (event.isClash) style = styles.clash;
                    else if (event.type === 'start') style = styles.start;
                    else if (event.type === 'end') style = styles.end;
                    else if (event.type === 'warning') style = styles.warning;
                    else if (event.type === 'pen-change') style = styles.pen;
                    else if (event.type.includes('break')) style = styles.break;

                    row.eachCell((cell, colNumber) => {
                        if (style.fill) cell.fill = style.fill;
                        if (style.font) cell.font = style.font;
                        cell.border = { 
                            top: {style:'thin', color: {argb:'FFE5E7EB'}}, 
                            bottom: {style:'thin', color: {argb:'FFE5E7EB'}},
                            left: {style:'thin', color: {argb:'FFE5E7EB'}},
                            right: {style:'thin', color: {argb:'FFE5E7EB'}}
                        };
                        
                        if (colNumber === 1) cell.font = { ...cell.font, bold: true };
                    });

                    currentRowIndex++;
                });
              });

              const buffer = await workbook.xlsx.writeBuffer();
              const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `Invigilation_Master_Timeline.xlsx`;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);

            } catch (e) {
              console.error(e);
              alert("Error exporting to Excel. Please check the console for details.");
            }
          };

          // --- Import Logic ---

          const handleFileUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const fileName = file.name.toLowerCase();
            
            if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
                if (!window.ExcelJS) {
                    alert("Excel library loading, please try again in a moment.");
                    return;
                }
                
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const workbook = new window.ExcelJS.Workbook();
                    await workbook.xlsx.load(arrayBuffer);
                    
                    const worksheet = workbook.worksheets[0];
                    let csvContent = "";
                    
                    worksheet.eachRow((row, rowNumber) => {
                        const rowData = [];
                        for(let i = 1; i <= worksheet.columnCount; i++) {
                             let cellVal = row.getCell(i).value;
                             
                             if (cellVal && typeof cellVal === 'object' && cellVal.richText) {
                                 cellVal = cellVal.richText.map(rt => rt.text).join('');
                             } else if (cellVal && typeof cellVal === 'object' && cellVal.text) {
                                 cellVal = cellVal.text;
                             } else if (cellVal instanceof Date) {
                                 const year = cellVal.getFullYear();
                                 const month = String(cellVal.getMonth() + 1).padStart(2, '0');
                                 const day = String(cellVal.getDate()).padStart(2, '0');
                                 cellVal = `${year}-${month}-${day}`;
                             }

                             if (cellVal === null || cellVal === undefined) cellVal = '';
                             
                             let stringVal = String(cellVal);
                             if (stringVal.includes(',')) {
                                 stringVal = `"${stringVal}"`;
                             }
                             rowData.push(stringVal);
                        }
                        csvContent += rowData.join(',') + "\n";
                    });
                    
                    setInputText(csvContent);
                    
                } catch (err) {
                    console.error(err);
                    alert("Failed to read Excel file. Please ensure it's a valid .xlsx file.");
                }

            } else {
                const reader = new FileReader();
                reader.onload = (event) => {
                    setInputText(event.target.result);
                };
                reader.readAsText(file);
            }
            e.target.value = null;
          };

          // --- Effects ---

          useEffect(() => {
            try {
              const parsedGroups = parseInput(inputText);
              const foundDates = Object.keys(parsedGroups);
              
              setDates(foundDates);
              
              if (foundDates.length > 0 && (!selectedDate || !parsedGroups[selectedDate])) {
                setSelectedDate(foundDates[0]);
              } else if (foundDates.length === 0) {
                setSchedule([]);
              }
              
              setError('');
            } catch (e) {
              console.error(e);
              setError('Could not parse schedule. Please check the format.');
              setSchedule([]);
              setDates([]);
            }
          }, [inputText]);

          useEffect(() => {
              try {
                const parsedGroups = parseInput(inputText);
                if (selectedDate && parsedGroups[selectedDate]) {
                    const timeline = generateTimeline(parsedGroups[selectedDate]);
                    setSchedule(timeline);
                } else {
                    setSchedule([]);
                }
              } catch (e) {
                  // Error handled
              }
          }, [selectedDate, inputText]);


          // --- Render Helpers ---

          const copyToClipboard = () => {
            const text = schedule.map(e => `${e.displayTime} ${e.label} ${e.details ? `[${e.details}]` : ''} ${e.isClash ? '[CLASH]' : ''}`).join('\n');
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            alert("Timeline copied to clipboard!");
          };

          const getEventColor = (event) => {
            if (event.isClash) {
                return 'border-l-4 border-l-red-600 bg-red-100 border-y border-r border-red-200 text-red-900';
            }

            switch (event.type) {
              case 'start': return 'border-l-4 border-l-green-500 bg-white';
              case 'end': return 'border-l-4 border-l-red-500 bg-white';
              case 'warning': return 'bg-amber-50 border-amber-200 text-amber-800';
              case 'break-start': return 'bg-gray-50 border-gray-200 text-gray-500 border-dashed border';
              case 'break-end': return 'bg-gray-50 border-gray-200 text-gray-500 border-dashed border';
              case 'pen-change': return 'border-l-4 border-l-purple-500 bg-purple-50';
              default: return 'bg-white border-gray-200';
            }
          };

          const getIcon = (event) => {
              if (event.isClash) return <AlertTriangle className="w-4 h-4 text-red-600" />;

              switch(event.type) {
                  case 'start': return <ArrowRight className="w-4 h-4 text-green-600" />;
                  case 'end': return <ArrowRight className="w-4 h-4 text-red-600" />;
                  case 'pen-change': return <PenTool className="w-4 h-4 text-purple-600" />;
                  case 'warning': return <AlertCircle className="w-4 h-4 text-amber-600" />;
                  default: return <Clock className="w-4 h-4 text-gray-400" />;
              }
          };

          return (
            <div className="min-h-screen bg-slate-50 p-4 md:p-6 font-sans text-slate-900 flex flex-col lg:h-screen lg:overflow-hidden">
              <div className="max-w-7xl mx-auto w-full flex-1 flex flex-col lg:min-h-0">
                <header className="flex-shrink-0 mb-6 flex items-center justify-between flex-wrap gap-4">
                  <div className="flex items-center space-x-3">
                    <div className="p-3 bg-indigo-600 rounded-lg shadow-lg">
                        <Clock className="w-8 h-8 text-white" />
                    </div>
                    <div>
                        <h1 className="text-xl md:text-2xl font-bold text-gray-800">Invigilation Master Timeline Creator v1.0 <span className="text-gray-500 text-lg font-normal">(for Special Examination Arrangements)</span></h1>
                        <p className="text-gray-500 text-sm">Merge multiple student schedules into one run sheet</p>
                    </div>
                  </div>
                  
                  {/* Date Selector */}
                  {dates.length > 0 && (
                    <div className="flex items-center space-x-2 bg-white p-2 rounded-lg border border-gray-200 shadow-sm">
                        <Calendar className="w-4 h-4 text-gray-500 ml-2" />
                        <span className="text-sm font-medium text-gray-600">Select Date:</span>
                        <select 
                            value={selectedDate}
                            onChange={(e) => setSelectedDate(e.target.value)}
                            className="bg-transparent font-semibold text-indigo-700 focus:outline-none cursor-pointer"
                        >
                            {dates.map(date => (
                                <option key={date} value={date}>{formatDateWithDay(date)}</option>
                            ))}
                        </select>
                    </div>
                  )}
                </header>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:flex-1 lg:min-h-0 lg:h-full">
                  
                  {/* Input Section */}
                  <div className="lg:col-span-5 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-[500px] lg:h-full overflow-hidden">
                    <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-xl flex-shrink-0">
                      <h2 className="font-semibold text-gray-700 flex items-center">
                        <FileSpreadsheet className="w-4 h-4 mr-2" />
                        Input Schedule ({inputType === 'csv' ? 'CSV/Excel' : 'Text'})
                      </h2>
                      <div className="flex gap-2">
                        <input 
                            type="file" 
                            ref={fileInputRef} 
                            onChange={handleFileUpload} 
                            accept=".csv, .xlsx, .xls, .txt" 
                            className="hidden" 
                        />
                        <button 
                            onClick={() => fileInputRef.current?.click()}
                            className="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 flex items-center px-2 py-1 rounded transition-colors border border-indigo-200"
                            title="Import Excel or CSV"
                        >
                            <Upload className="w-3 h-3 mr-1" /> Import File
                        </button>
                        <button 
                            onClick={() => setInputText('')}
                            className="text-xs text-red-500 hover:text-red-700 flex items-center px-2 py-1 rounded hover:bg-red-50 transition-colors"
                            title="Clear Text"
                        >
                            <Trash2 className="w-3 h-3 mr-1" /> Clear
                        </button>
                      </div>
                    </div>
                    <textarea
                      className="flex-1 p-4 font-mono text-xs md:text-sm resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500/20 whitespace-pre"
                      placeholder="Paste Excel/CSV data here..."
                      value={inputText}
                      onChange={(e) => setInputText(e.target.value)}
                      spellCheck="false"
                    />
                    <div className="p-3 bg-indigo-50 border-t border-indigo-100 text-xs text-indigo-700 flex-shrink-0">
                      <p className="font-semibold mb-1">Supported Formats:</p>
                      <ul className="list-disc list-inside space-y-1 opacity-80">
                          <li><strong>Import:</strong> Use the button above to load .xlsx or .csv files.</li>
                          <li><strong>Manual:</strong> Paste "Student 1" followed by blocks.</li>
                          <li><strong>Format:</strong> Header row with names, date rows, time blocks underneath.</li>
                      </ul>
                    </div>
                  </div>

                  {/* Output Section */}
                  <div className="lg:col-span-7 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-[500px] lg:h-full overflow-hidden">
                    <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-xl flex-shrink-0">
                      <div className="flex flex-col">
                        <h2 className="font-semibold text-gray-700 flex items-center">
                            <ArrowRight className="w-4 h-4 mr-2" />
                            Master Timeline
                        </h2>
                        {selectedDate && <span className="text-xs text-gray-400 ml-6">{formatDateWithDay(selectedDate)}</span>}
                      </div>
                      
                      <div className="flex items-center space-x-2">
                        <span className="text-xs font-medium text-gray-400 mr-2">
                            {schedule.length} events
                        </span>
                        <button 
                            onClick={copyToClipboard}
                            className="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-md flex items-center shadow-sm transition-all border border-gray-300"
                            title="Copy to Clipboard"
                        >
                            <Clipboard className="w-4 h-4 mr-1.5" /> Copy
                        </button>
                        <button 
                            onClick={exportToExcel}
                            disabled={!isExcelLibReady}
                            className={`text-sm text-white px-3 py-1.5 rounded-md flex items-center shadow-sm transition-all hover:shadow active:scale-95 ${isExcelLibReady ? 'bg-green-600 hover:bg-green-700' : 'bg-gray-400 cursor-not-allowed'}`}
                            title="Export All to Excel (.xlsx)"
                        >
                            <Download className="w-4 h-4 mr-1.5" /> 
                            {isExcelLibReady ? 'Export Excel' : 'Loading...'}
                        </button>
                      </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-0 bg-gray-50/30">
                      {error ? (
                        <div className="text-red-500 text-center mt-10 p-4 bg-red-50 mx-4 rounded-lg border border-red-100">{error}</div>
                      ) : schedule.length === 0 ? (
                        <div className="text-gray-400 text-center mt-20 flex flex-col items-center">
                          <User className="w-12 h-12 mb-3 opacity-20" />
                          <p>Paste a schedule or import a file to generate the timeline</p>
                        </div>
                      ) : (
                        <div className="divide-y divide-gray-100">
                          {schedule.map((event, idx) => (
                            <div 
                              key={idx} 
                              className={`flex items-start p-4 hover:bg-gray-50 transition-colors ${getEventColor(event)}`}
                            >
                              <div className={`font-mono text-lg font-bold w-16 flex-shrink-0 pt-0.5 ${event.isClash ? 'text-red-700' : 'text-gray-700'}`}>
                                {event.displayTime}
                              </div>
                              
                              <div className="mx-3 mt-1.5">
                                  {getIcon(event)}
                              </div>

                              <div className="flex-1 min-w-0">
                                <div className={`font-medium flex flex-wrap items-center gap-2 ${event.isClash ? 'text-red-900' : 'text-gray-900'}`}>
                                    {event.label}
                                </div>
                                
                                {event.details && (
                                     <div className={`text-sm mt-1 font-medium inline-block px-2 py-0.5 rounded ${event.isClash ? 'bg-red-200 text-red-800' : 'text-purple-600 bg-purple-100'}`}>
                                         {event.details}
                                     </div>
                                )}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    
                    <div className="p-3 border-t border-gray-100 bg-white text-xs text-gray-500 text-center rounded-b-xl flex-shrink-0">
                      Timeline for: <span className="font-semibold text-indigo-700">{formatDateWithDay(selectedDate) || 'All'}</span>
                    </div>
                  </div>

                </div>
              </div>
              <footer className="w-full text-center py-6 text-gray-400 text-sm mt-8 border-t border-gray-200 flex-shrink-0">
                Created by Mr. KM So with Google Gemini
              </footer>
            </div>
          );
        };

        // 3. Mount Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
