                              if (isNewTeacherAcc && teachers.some(t => t.id === trimmedId)) {
                                setTeacherEditError("This User ID is already in use.");
                                return;
                              }

                              let finalHash = editingTeacherAccount.passwordHash || '';
                              if (editingTeacherAccount.newPassword && editingTeacherAccount.newPassword.trim() !== '') {
                                finalHash = await hashPassword(editingTeacherAccount.newPassword.trim());
                              }

                              setTeacherEditError('');
                              const updatedT = {
                                id: trimmedId,
                                name: trimmedName,
                                role: editingTeacherAccount.role,
                                passwordHash: finalHash
                              };
                              await setDoc(doc(db, TEACHERS_PATH, trimmedId), updatedT);
                              
                              if (teacher.id === trimmedId) {
                                updateSession(updatedT); // Update own session if editing self
                              }
                              
                              setEditingTeacherAccount(null);
                            }} 
                            className="px-6 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-lg font-bold transition-colors shadow-lg"
                          >
                            Save Teacher
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {activeTab === 'progress' && (
                <div className="space-y-6">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                      <Award className="w-6 h-6 text-blue-400" /> {t('Student Progress')}
                    </h2>
                    <div className="flex gap-2 w-full md:w-auto">
                      <select 
                        value={progressFilterGroup} 
                        onChange={(e) => setProgressFilterGroup(e.target.value)}
                        className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-sm focus:outline-none focus:border-emerald-500 flex-1 md:w-48"
                      >
                        <option value="">{t('All Groups')}</option>
                        {displayGroups.map(g => <option key={g.id} value={g.id}>{g.title}</option>)}
                      </select>
                      <select 
                        value={progressFilterChapter} 
                        onChange={(e) => setProgressFilterChapter(e.target.value)}
                        className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-sm focus:outline-none focus:border-emerald-500 flex-1 md:w-48"
                      >
                        <option value="">{t('All Chapters')}</option>
                        {displayGames.map(g => <option key={g.id} value={g.id}>{g.title}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
                    <table className="w-full text-left">
                      <thead className="bg-slate-900/50">
                        <tr>
                          <th className="p-4 text-slate-300 font-semibold">{t('Student Details')}</th>
                          <th className="p-4 text-slate-300 font-semibold">{t('Chapter Progress')}</th>
                          <th className="p-4 text-slate-300 font-semibold">{t('Items Collected')}</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-700/50">
                        {students.length === 0 ? (
                          <tr><td colSpan="3" className="p-8 text-center text-slate-500">No student accounts found. Add students in the Accounts tab to start tracking progress.</td></tr>
                        ) : (
                          (() => {
                            let displayedStudents = [...students].sort((a, b) => {
                              const classA = a.className || '';
                              const classB = b.className || '';
                              const classComp = classA.localeCompare(classB);
                              if (classComp !== 0) return classComp;
                              const numA = a.classNumber || '';
                              const numB = b.classNumber || '';
                              return numA.localeCompare(numB, undefined, { numeric: true });
                            });

                            if (progressFilterGroup) {
                              if (progressFilterGroup === 'guest_group') {
                                displayedStudents = displayedStudents.filter(s => s.isGuest);
                              } else {
                                const targetGroup = displayGroups.find(g => g.id === progressFilterGroup);
                                if (targetGroup) {
                                  displayedStudents = displayedStudents.filter(s => (targetGroup.students || []).includes(s.id));
                                } else {
                                  displayedStudents = []; // Group not found in allowed groups
                                }
                              }
                            } else if (!isAdmin) {
                              // Regular teachers only see progress for students in their groups
                              const allowedStudentIds = new Set(displayGroups.flatMap(g => g.students || []));
                              displayedStudents = displayedStudents.filter(s => allowedStudentIds.has(s.id));
                            }

                            if (displayedStudents.length === 0) {
                               return <tr><td colSpan="3" className="p-8 text-center text-slate-500">No students match the selected filters.</td></tr>;
                            }

                            return displayedStudents.map(student => {
                              const prog = allProgress.find(p => p.id === student.id);
                              
                              let progressEntries = prog && prog.progress ? Object.entries(prog.progress) : [];
                              if (progressFilterChapter) {
                                progressEntries = progressEntries.filter(([gId]) => gId === progressFilterChapter);
                              } else if (!isAdmin) {
                                // Filter out progress for games the regular teacher doesn't own
                                const allowedGameIds = new Set(displayGames.map(g => g.id));
                                progressEntries = progressEntries.filter(([gId]) => allowedGameIds.has(gId));
                              }
                              
                              return (
                                <tr key={student.id} className="hover:bg-slate-700/20 transition-colors">
                                  <td className="p-4">
                                    <div className="font-bold text-white text-base">{student.name}</div>
                                    <div className="text-xs text-slate-400 mt-1 space-y-0.5">
                                      <div>Class: <span className="text-slate-300">{student.className}</span> | No. <span className="text-slate-300">{student.classNumber}</span></div>
                                      <div>ID: <span className="font-mono text-slate-500">{student.id}</span></div>
                                    </div>
                                  </td>
                                  <td className="p-4">
                                    {progressEntries.length === 0 ? (
                                      <span className="text-slate-500 text-sm italic">{t('No progress yet')}</span>
                                    ) : (
                                      progressEntries.map(([gId, p]) => {
                                        const game = games.find(g => g.id === gId);
                                        const total = game?.nodes?.length || 0;
                                        const completed = p.completedNodes?.length || 0;
                                        if (!game) return null;
                                        
                                        const finalNodes = game.nodes?.filter(n => n.isFinalNode) || [];
                                        const isComplete = finalNodes.length > 0 
                                          ? finalNodes.every(n => p.completedNodes?.includes(n.id))
                                          : (total > 0 && completed === total);
                                        
                                        return (
                                          <div key={gId} className="mb-3 last:mb-0">
                                            <div className="text-sm text-slate-300 mb-1 flex justify-between items-center">
                                              <span className={`font-bold flex items-center gap-2 ${isComplete ? 'text-emerald-400' : ''}`}>
                                                {game.title}
                                                {isComplete && <span className="text-[10px] bg-emerald-900/50 text-emerald-400 px-1.5 py-0.5 rounded border border-emerald-700/50 uppercase tracking-wider">Completed</span>}
                                              </span>
                                              <div className="flex items-center gap-2">
                                                <span className="text-xs">{completed}/{total} Nodes</span>
                                                <button 
                                                  onClick={async () => {
                                                    if (confirmResetProgress?.studentId === student.id && confirmResetProgress?.gameId === gId) {
                                                      const progressRef = doc(db, PROGRESS_PATH, student.id);
                                                      await setDoc(progressRef, {
                                                        progress: { [gId]: { completedNodes: [], inventory: [], nodeProgress: {}, unlockedNodes: [], unlockedObjects: [] } }
                                                      }, { merge: true });
                                                      setConfirmResetProgress(null);
                                                    } else {
                                                      setConfirmResetProgress({ studentId: student.id, gameId: gId });
                                                      setTimeout(() => setConfirmResetProgress(null), 3000);
                                                    }
                                                  }}
                                                  className={`p-1 rounded transition-colors text-xs flex items-center gap-1 ${confirmResetProgress?.studentId === student.id && confirmResetProgress?.gameId === gId ? 'bg-red-600 text-white font-bold' : 'text-slate-500 hover:text-red-400 bg-slate-800'}`}
                                                  title="Reset Progress"
                                                >
                                                  {confirmResetProgress?.studentId === student.id && confirmResetProgress?.gameId === gId ? 'Confirm Reset?' : <RotateCcw className="w-3 h-3" />}
                                                </button>
                                              </div>
                                            </div>
                                            <div className="w-full bg-slate-900 rounded-full h-2">
                                              <div className={`h-2 rounded-full ${isComplete ? 'bg-emerald-500' : 'bg-blue-500'}`} style={{ width: `${total > 0 ? (completed/total)*100 : 0}%` }}></div>
                                            </div>
                                          </div>
                                        );
                                      })
                                    )}
                                  </td>
                                  <td className="p-4">
                                    <div className="flex flex-col gap-2">
                                      {progressEntries.map(([gId, p]) => {
                                        const game = games.find(g => g.id === gId);
                                        if (!game || !p.inventory || p.inventory.length === 0) return null;
                                        return (
                                          <div key={gId} className="bg-slate-900/50 p-2 rounded border border-slate-700/50">
                                            <div className="text-[10px] font-semibold text-emerald-400/70 mb-1 uppercase tracking-wider">{game.title}</div>
                                            <div className="flex flex-wrap gap-1">
                                              {p.inventory.map((item, i) => (
                                                <span key={i} className="text-[10px] bg-emerald-900/30 text-emerald-400 px-1.5 py-0.5 rounded border border-emerald-700/30 flex items-center gap-1">
                                                  {game.itemImages?.[item] && <img src={game.itemImages[item]} alt={item} className="w-3 h-3 object-contain" />}
                                                  {item}
                                                </span>
                                              ))}
                                            </div>
                                          </div>
                                        );
                                      })}
                                    </div>
                                  </td>
                                </tr>
                              );
                            });
                          })()
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {activeTab === 'backup' && (
                <div className="space-y-6">
                  <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                    <Database className="w-6 h-6 text-blue-400" /> {t('System Settings & Data')}
                  </h2>
                  <p className="text-slate-400">Configure your account, set up API keys, and {isAdmin ? 'export/restore global platform data.' : 'manage your settings.'}</p>
                  
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                    {/* Change Own Teacher Name */}
                    <div className="bg-slate-800 rounded-xl border border-slate-700 p-6 flex flex-col shadow-lg">
                      <h3 className="text-xl font-bold text-white mb-2 flex items-center gap-2"><User className="w-5 h-5 text-blue-400"/> {t('Change My Display Name')}</h3>
                      <p className="text-sm text-slate-400 mb-4">Update how your name appears to students across the platform.</p>
                      <div className="flex flex-col gap-3">
                        <input 
                          type="text" 
                          value={myProfileName} 
                          onChange={(e) => { setMyProfileName(e.target.value); setProfileNameMsg(''); }} 
                          placeholder="e.g. Mr. Smith" 
                          className="bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 w-full"
                        />
                        <button 
                          onClick={async () => {
                            setProfileNameMsg('');
                            if (!myProfileName.trim()) return setProfileNameMsg('Error: Name cannot be empty.');
                            
                            try {
                              const updatedT = { ...teacher, name: myProfileName.trim() };
                              await setDoc(doc(db, TEACHERS_PATH, teacher.id), { name: myProfileName.trim() }, { merge: true });
                              updateSession(updatedT);
                              
                              setProfileNameMsg('Name successfully updated!');
                              setTimeout(() => setProfileNameMsg(''), 3000);
                            } catch (err) {
                              setProfileNameMsg('Error updating name.');
                            }
                          }}
                          className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-bold transition-colors w-full sm:w-auto self-end mt-1"
                        >
                          {t('Update Name')}
                        </button>
                      </div>
                      {profileNameMsg && <p className={`text-sm mt-3 font-semibold ${profileNameMsg.includes('Error') ? 'text-red-400' : 'text-emerald-400'}`}>{profileNameMsg}</p>}
                    </div>

                    {/* Change Own Teacher Password */}
                    <div className="bg-slate-800 rounded-xl border border-slate-700 p-6 flex flex-col shadow-lg">
                      <h3 className="text-xl font-bold text-white mb-2 flex items-center gap-2"><Key className="w-5 h-5 text-purple-400"/> {t('Change My Password')}</h3>
                      <p className="text-sm text-slate-400 mb-4">Update your secure login password. This only affects your account.</p>
                      <div className="flex flex-col gap-3">
                        <input 
                          type="password" 
                          value={pwData.current} 
                          onChange={(e) => { setPwData({...pwData, current: e.target.value}); setPasswordMsg(''); }} 
                          placeholder={t('Current Password')}
                          className="bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 w-full"
                        />
                        <div className="flex flex-col sm:flex-row gap-3">
                          <input 
                            type="password" 
                            value={pwData.newPw} 
                            onChange={(e) => { setPwData({...pwData, newPw: e.target.value}); setPasswordMsg(''); }} 
                            placeholder={t('New Password')}
                            className="bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 flex-1 w-full"
                          />
                          <input 
                            type="password" 
                            value={pwData.confirm} 
                            onChange={(e) => { setPwData({...pwData, confirm: e.target.value}); setPasswordMsg(''); }} 
                            placeholder={t('Confirm New')}
                            className="bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 flex-1 w-full"
                          />
                        </div>
                        <button 
                          onClick={async () => {
                            setPasswordMsg('');
                            if (!pwData.current || !pwData.newPw || !pwData.confirm) return setPasswordMsg('Error: All fields are required.');
                            if (pwData.newPw !== pwData.confirm) return setPasswordMsg('Error: New passwords do not match.');
                            if (pwData.newPw.length < 4) return setPasswordMsg('Error: Password too short.');
                            
                            try {
                              const expectedHash = teacher.passwordHash || await hashPassword(teacher.id);
                              const currentInputHash = await hashPassword(pwData.current);
                              
                              if (currentInputHash !== expectedHash) return setPasswordMsg('Error: Current password is incorrect.');
                              
                              const newHash = await hashPassword(pwData.newPw);
                              const updatedT = { ...teacher, passwordHash: newHash };
                              await setDoc(doc(db, TEACHERS_PATH, teacher.id), updatedT);
                              updateSession(updatedT);
                              
                              setPasswordMsg('Password successfully updated!');
                              setPwData({ current: '', newPw: '', confirm: '' });
                              setTimeout(() => setPasswordMsg(''), 3000);
                            } catch (err) {
                              setPasswordMsg('Error updating password.');
                            }
                          }}
                          className="bg-purple-600 hover:bg-purple-500 text-white px-6 py-3 rounded-lg font-bold transition-colors w-full sm:w-auto self-end mt-1"
                        >
                          {t('Update Password')}
                        </button>
                      </div>
                      {passwordMsg && <p className={`text-sm mt-3 font-semibold ${passwordMsg.includes('Error') ? 'text-red-400' : 'text-emerald-400'}`}>{passwordMsg}</p>}
                    </div>

                    {/* Gemini API Key Block */}
                    <div className="bg-slate-800 rounded-xl border border-slate-700 p-6 flex flex-col shadow-lg lg:col-span-2">
                      <h3 className="text-xl font-bold text-white mb-2 flex items-center gap-2"><Sparkles className="w-5 h-5 text-purple-400"/> Gemini API Key (For AI Generation)</h3>
                      <p className="text-sm text-slate-400 mb-4">Provide your own Gemini API key if hosting outside the Canvas environment. This key is kept securely in browser memory and is <strong>never</strong> saved to the database.</p>
                      <div className="flex flex-col sm:flex-row gap-3">
                        <input 
                          type="password" 
                          value={geminiApiKey} 
                          onChange={(e) => setGeminiApiKey(e.target.value)} 
                          placeholder="AIzaSy..." 
                          className="bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 flex-1 font-mono tracking-widest"
                        />
                      </div>
                    </div>
                  </div>

                  {isAdmin && (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {/* Export Card */}
                      <div className="bg-slate-800 rounded-xl border border-slate-700 p-6 flex flex-col items-center text-center shadow-lg">
                        <Download className="w-12 h-12 text-emerald-400 mb-4" />
                        <h3 className="text-xl font-bold text-white mb-2">{t('Export Global Data')}</h3>
                        <p className="text-sm text-slate-400 mb-6">Download a complete JSON backup containing all teachers, students, groups, and chapters.</p>
                        <button onClick={handleExport} className="mt-auto w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                          <Download className="w-5 h-5" /> {t('Download Backup')}
                        </button>
                      </div>

                      {/* Import Card */}
                      <div className="bg-slate-800 rounded-xl border border-slate-700 p-6 flex flex-col items-center text-center shadow-lg relative overflow-hidden">
                        <Upload className="w-12 h-12 text-blue-400 mb-4" />
                        <h3 className="text-xl font-bold text-white mb-2">{t('Restore Global Data')}</h3>
                        <p className="text-sm text-slate-400 mb-6">Upload a previously exported JSON backup file to merge or restore your system data.</p>
                        
                        {importState === 'idle' && (
                          <>
                            <input type="file" accept=".json" ref={fileInputRef} onChange={handleFileSelect} className="hidden" />
                            <button onClick={() => fileInputRef.current.click()} className="mt-auto w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                              <Upload className="w-5 h-5" /> {t('Select Backup File')}
                            </button>
                          </>
                        )}

                        {importState === 'confirming' && (
                          <div className="absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center p-6 text-center z-10 animate-in fade-in">
                            <AlertTriangle className="w-10 h-10 text-amber-400 mb-2" />
                            <h4 className="text-lg font-bold text-white mb-2">Overwrite Data?</h4>
                            <p className="text-xs text-slate-300 mb-4">Restoring will merge existing records with the backup file data. Unassigned legacy data will be assigned to you.</p>
                            <div className="flex gap-2 w-full">
                              <button onClick={() => setImportState('idle')} className="flex-1 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-semibold transition-colors">Cancel</button>
                              <button onClick={executeImport} className="flex-1 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-sm font-semibold transition-colors">Confirm Restore</button>
                            </div>
                          </div>
                        )}

                        {importState === 'uploading' && (
                          <div className="absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center p-6 text-center z-10 animate-in fade-in">
                            <Database className="w-10 h-10 text-blue-400 mb-4 animate-bounce" />
                            <h4 className="text-lg font-bold text-white mb-4">Restoring Data...</h4>
                            <div className="w-full max-w-xs bg-slate-800 rounded-full h-3 mb-2 overflow-hidden border border-slate-700">
                              <div className="bg-blue-500 h-full rounded-full transition-all duration-300" style={{ width: `${importProgress}%` }}></div>
                            </div>
                            <p className="text-sm font-bold text-blue-400 mb-2">{importProgress}% Completed</p>
                            <p className="text-xs text-slate-400">Please do not close the window.</p>
                          </div>
                        )}

                        {importState === 'success' && (
                          <div className="absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center p-6 text-center z-10 animate-in fade-in">
                            <CheckCircle className="w-10 h-10 text-emerald-400 mb-4" />
                            <h4 className="text-lg font-bold text-white mb-2">Restore Complete!</h4>
                          </div>
                        )}

                        {importState === 'error' && (
                          <div className="absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center p-6 text-center z-10 animate-in fade-in">
                            <AlertTriangle className="w-10 h-10 text-red-500 mb-2" />
                            <h4 className="text-lg font-bold text-white mb-2">Import Failed</h4>
                            <p className="text-xs text-red-400 mb-4">{importError}</p>
                            <button onClick={() => setImportState('idle')} className="w-full py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-semibold transition-colors">Try Again</button>
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </>
          ) : showAIGenerator ? (
            <AIGeneratorModal 
              geminiApiKey={geminiApiKey}
              onClose={() => setShowAIGenerator(false)}
              onGenerate={(generatedGame) => {
                setShowAIGenerator(false);
                setEditingGame({ ...generatedGame, teacherId: teacher.id });
                setActiveTheme(generatedGame.themeColor || 'slate');
              }}
            />
          ) : editingGroup ? (
            <GroupBuilder 
              group={editingGroup} 
              games={displayGames}
              students={students}
              isReadOnly={!editingGroup.isSystem && editingGroup.teacherId !== teacher.id}
              onSave={async (updatedGroup) => {
                await setDoc(doc(db, GROUPS_PATH, updatedGroup.id), updatedGroup);
                setEditingGroup(null);
              }}
              onClose={() => setEditingGroup(null)}
            />
          ) : (
            <GameBuilder 
              game={editingGame} 
              isReadOnly={editingGame.teacherId !== teacher.id}
              setActiveTheme={setActiveTheme}
              geminiApiKey={geminiApiKey}
              onSave={async (updatedGame) => {
                await setDoc(doc(db, GAMES_PATH, updatedGame.id), updatedGame);
                setEditingGame(null);
                setActiveTheme('slate');
              }}
              onClose={() => { setEditingGame(null); setActiveTheme('slate'); }}
            />
          )}
        </div>
      );
    }

    // ==========================================
    // AI GENERATOR MODAL (TEACHER)
    // ==========================================
    function AIGeneratorModal({ onClose, onGenerate, geminiApiKey }) {
      const [links, setLinks] = useState('');
      const [codes, setCodes] = useState('');
      const [promptStr, setPromptStr] = useState('');
      const [features, setFeatures] = useState({
        reqItems: false,
        reqPasswords: false,
        escapeRooms: false,
        itemCombining: false
      });
      const [isGenerating, setIsGenerating] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const handleGenerate = async () => {
        const linksArr = links.split('\n').filter(l => l.trim() !== '');
        const codesArr = codes.split('\n').filter(c => c.trim() !== '');

        if (linksArr.length === 0) {
          setErrorMsg('Please provide at least one online exercise link.');
          return;
        }

        if (linksArr.length !== codesArr.length) {
          setErrorMsg(`Line count mismatch: ${linksArr.length} link lines vs ${codesArr.length} passcode lines. They must match exactly.`);
          return;
        }

        setIsGenerating(true);
        setErrorMsg('');

        const promptText = `
        You are an expert educational game designer AI.
        Create an educational escape room/RPG chapter JSON based on these inputs.

        Theme/Additional Prompt: ${promptStr || 'A generic engaging educational adventure'}

        Enabled Features (If a feature is false, DO NOT use its mechanics):
        - Prerequisite Items: ${features.reqItems}
        - Prerequisite Passwords: ${features.reqPasswords}
        - Escape Room Stages: ${features.escapeRooms}
        - Item Combining: ${features.itemCombining}

        Exercise Links (Line by line):
        ${links}

        Passcodes (Matching the links line by line):
        ${codes}

        CRITICAL INSTRUCTIONS FOR QUESTS & NODES:
        1. You MUST generate a robust 'nodes' array containing the quests. Do NOT leave it empty.
        2. Every single Exercise Link provided above MUST be included in the game. Place the link in the 'link' field of a task (or object if escape room) inside a node.
        3. Each link's corresponding passcode MUST be placed in the 'passcode' field exactly as provided.
        4. If a line starts with '*', it is an OPTIONAL Side Quest (set isFinalNode: false, type: 'side').
        5. PARALLEL QUESTS (|): If a line contains multiple pipe-separated (|) links, you MUST create a SEPARATE, independent node for EACH link on that line. These parallel nodes should all share the exact same 'requiredNodes' (branching from the previous step), allowing them to be completed in any order.
        6. SEQUENTIAL TASKS (,): If a line contains multiple comma-separated (,) links, you MUST create a SINGLE node and place each link as a separate sequential task within the 'tasks' array of that same node (or as separate objects if it is an escape room).
        7. Ensure logical map progression: Subsequent nodes must have the previous step's node ID(s) in their 'requiredNodes' array. If the previous step had parallel nodes (|), the next node must require ALL of those parallel node IDs.
        8. The final mandatory node MUST have 'isFinalNode: true'.
        9. Set sensible x and y integer coordinates (10 to 90) for nodes to lay out a logical map structure.
        10. ITEMS: Do NOT duplicate reward items. An item should only be rewarded ONCE. Use EITHER the 'rewardItem' string field OR the 'rewardItems' array field, but never put the exact same item in both.
        11. ESCAPE ROOMS: If 'Escape Room Stages' is true, you MUST make at least some of the nodes have 'type: "escape_room"'. For these nodes, you MUST place the exercise links and passcodes into the 'objects' array and leave the 'tasks' array empty.

        IMAGE URLS:
        For ALL image fields (chapterImageUrl, mapImageUrl, imageUrl, lockedImageUrl, completedImageUrl, task images, and itemImages), you MUST generate a stock image URL using this exact format:
        https://image.pollinations.ai/prompt/{URL-encoded-detailed-description-of-the-image}
        Example: https://image.pollinations.ai/prompt/a%20rusty%20medieval%20key%20on%20a%20wooden%20table
        Make sure to use %20 for spaces in the URL.
        `;

        const systemInstructionText = `You MUST return strictly formatted JSON matching this exact structure:
{
  "title": "Chapter Title",
  "description": "Chapter story background...",
  "themeColor": "indigo", // Pick from: slate, indigo, rose, emerald, amber, purple, sky-light, mint-light, pink-light, amber-light, lavender-light
  "chapterImageUrl": "https://image.pollinations.ai/prompt/...",
  "mapImageUrl": "https://image.pollinations.ai/prompt/...",
  "definedItems": ["Item1", "Item2"],
  "itemImages": { "Item1": "https://...", "Item2": "https://..." },
  "itemDescriptions": { "Item1": "Desc...", "Item2": "Desc..." },
  "recipes": [
    { "id": "rec_1", "inputs": ["Item1", "Item2"], "output": "Item3" }
  ],
  "nodes": [
    {
      "id": "node_1",
      "title": "Standard Quest",
      "type": "main",
      "isFinalNode": false,
      "lockedStory": "...",
      "lockedImageUrl": "...",
      "story": "...",
      "imageUrl": "...",
      "completedStory": "...",
      "completedImageUrl": "...",
      "rewardItem": "Item1",
      "rewardItems": [],
      "requiredItems": [],
      "requiredNodes": [],
      "requiredPassword": "",
      "x": 20,
      "y": 50,
      "tasks": [
        { "imageUrl": "...", "description": "...", "link": "https://...", "passcode": "123456" }
      ],
      "objects": []
    },
    {
      "id": "node_2",
      "title": "Escape Room Stage",
      "type": "escape_room",
      "isFinalNode": true,
      "lockedStory": "...",
      "lockedImageUrl": "...",
      "story": "...",
      "imageUrl": "...",
      "completedStory": "...",
      "completedImageUrl": "...",
      "rewardItem": "",
      "rewardItems": [],
      "requiredItems": ["Item1"],
      "requiredNodes": ["node_1"],
      "requiredPassword": "",
      "x": 80,
      "y": 50,
      "tasks": [],
      "objects": [
        { "id": "obj_1", "name": "Locked Safe", "description": "...", "requiresItem": "", "link": "https://...", "passcode": "654321", "rewardItems": ["Item2"], "isFinal": true }
      ]
    }
  ]
}`;

        const payload = {
          contents: [{ parts: [{ text: promptText }] }],
          systemInstruction: { parts: [{ text: systemInstructionText }] },
          generationConfig: {
            responseMimeType: "application/json"
          }
        };

        const apiKey = (geminiApiKey || "").trim(); 
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        let lastError = null;
        for (let i = 0; i < 5; i++) {
          try {
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            
            if (!res.ok) {
              const errText = await res.text();
              throw new Error(`API Error ${res.status}: ${errText}`);
            }
            
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error('Empty response from AI');
            
            let parsedGame = JSON.parse(text);
            
            // Post-generation cleanup to ensure required IDs exist and deduplicate items
            parsedGame.id = `game_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
            
            if (parsedGame.definedItems) {
              parsedGame.definedItems = Array.from(new Set(parsedGame.definedItems));
            }
            
            parsedGame.nodes = (parsedGame.nodes || []).map((n, idx) => {
              n.id = n.id || `node_${Date.now()}_${idx}`;
              n.tasks = (n.tasks || []).map(t => ({...t, passcode: t.passcode || ''}));
              
              // Deduplicate rewards inside the node to prevent the same item appearing multiple times
              const uniqueRewards = Array.from(new Set([
                ...(n.rewardItem ? [n.rewardItem] : []),
                ...(n.rewardItems || [])
              ]));
              n.rewardItem = uniqueRewards.length > 0 ? uniqueRewards[0] : '';
              n.rewardItems = uniqueRewards.length > 1 ? uniqueRewards.slice(1) : [];

              n.objects = (n.objects || []).map((o, j) => {
                o.id = o.id || `obj_${Date.now()}_${idx}_${j}`;
                if (o.rewardItems) {
                  o.rewardItems = Array.from(new Set(o.rewardItems));
                }
                return o;
              });
              return n;
            });

            onGenerate(parsedGame);
            return; // Success, exit loop
          } catch (err) {
            lastError = err;
            await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
          }
        }
        
        setIsGenerating(false);
        setErrorMsg(`Failed after retries: ${lastError?.message || 'Unknown error'}`);
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto pb-20 animate-in fade-in zoom-in-95 duration-200">
          <div className="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 sticky top-20 z-30 shadow-lg">
            <h2 className="text-2xl font-bold text-white flex items-center gap-2">
              <Sparkles className="text-purple-400 w-6 h-6" /> 
              Generate Chapter with AI
            </h2>
            <div className="flex space-x-3">
              <button onClick={onClose} disabled={isGenerating} className="px-4 py-2 text-slate-300 hover:bg-slate-700 rounded-lg transition-colors disabled:opacity-50">Cancel</button>
              <button onClick={handleGenerate} disabled={isGenerating} className="px-6 py-2 bg-purple-600 hover:bg-purple-500 disabled:bg-slate-700 text-white rounded-lg font-bold transition-colors flex items-center gap-2 shadow-lg">
                <Sparkles className={`w-4 h-4 ${isGenerating ? 'animate-spin' : ''}`} /> {isGenerating ? 'Generating...' : 'Generate Chapter'}
              </button>
            </div>
          </div>

          <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label className="block text-sm font-semibold text-slate-400 mb-2 uppercase tracking-wider flex items-center gap-2">
                  <BookOpen className="w-4 h-4"/> Online Exercise Links
                </label>
                <p className="text-[10px] text-slate-500 mb-2">Order dictates progression. "*" prefix = optional side quest. "|" = independent parallel quests. "," = sequential tasks in ONE quest.</p>
                <textarea 
                  value={links} 
                  onChange={e => setLinks(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 h-48 font-mono text-xs whitespace-pre"
                  placeholder="https://link1.com&#10;*https://link2.com (optional)&#10;https://link3.com | https://link4.com (parallel quests)&#10;https://link5.com, https://link6.com (sequential tasks)"
                  wrap="off"
                />
              </div>
              <div>
                <label className="block text-sm font-semibold text-slate-400 mb-2 uppercase tracking-wider flex items-center gap-2">
                  <Key className="w-4 h-4"/> Access Codes / Passwords
                </label>
                <p className="text-[10px] text-slate-500 mb-2">Must match the exact structure and line count of the exercise links box.</p>
                <textarea 
                  value={codes} 
                  onChange={e => setCodes(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 h-48 font-mono text-xs whitespace-pre"
                  placeholder="123456&#10;*secretphrase&#10;111111 | 222222&#10;333333, 444444"
                  wrap="off"
                />
              </div>
            </div>

            <div>
              <label className="block text-sm font-semibold text-slate-400 mb-2 uppercase tracking-wider">Additional Prompt / Storyline Theme</label>
              <input 
                type="text" 
                value={promptStr} 
                onChange={e => setPromptStr(e.target.value)}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500"
                placeholder="e.g. A sci-fi mystery on an abandoned space station exploring human biology..."
              />
            </div>

            <div className="p-4 bg-slate-900/50 rounded-xl border border-slate-700/50">
              <label className="block text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">Included Gameplay Features</label>
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                <label className="flex items-center gap-3 cursor-pointer">
                  <input type="checkbox" checked={features.reqItems} onChange={e => setFeatures({...features, reqItems: e.target.checked})} className="w-5 h-5 rounded border-slate-600 text-purple-500 focus:ring-purple-500 bg-slate-800" />
                  <span className="text-sm font-medium text-slate-300">Prerequisite Items</span>
                </label>
                <label className="flex items-center gap-3 cursor-pointer">
                  <input type="checkbox" checked={features.reqPasswords} onChange={e => setFeatures({...features, reqPasswords: e.target.checked})} className="w-5 h-5 rounded border-slate-600 text-purple-500 focus:ring-purple-500 bg-slate-800" />
                  <span className="text-sm font-medium text-slate-300">Prerequisite Passwords</span>
                </label>
                <label className="flex items-center gap-3 cursor-pointer">
                  <input type="checkbox" checked={features.escapeRooms} onChange={e => setFeatures({...features, escapeRooms: e.target.checked})} className="w-5 h-5 rounded border-slate-600 text-purple-500 focus:ring-purple-500 bg-slate-800" />
                  <span className="text-sm font-medium text-slate-300">Escape Room Stages</span>
                </label>
                <label className="flex items-center gap-3 cursor-pointer">
                  <input type="checkbox" checked={features.itemCombining} onChange={e => setFeatures({...features, itemCombining: e.target.checked})} className="w-5 h-5 rounded border-slate-600 text-purple-500 focus:ring-purple-500 bg-slate-800" />
                  <span className="text-sm font-medium text-slate-300">Item Combining</span>
                </label>
              </div>
            </div>

            {errorMsg && (
              <div className="p-4 bg-red-900/20 border border-red-800/50 rounded-xl flex items-center gap-3 text-red-400">
                <AlertTriangle className="w-5 h-5 shrink-0" />
                <p className="text-sm font-bold">{errorMsg}</p>
              </div>
            )}

            {isGenerating && (
              <div className="p-6 bg-purple-900/20 border border-purple-800/50 rounded-xl flex flex-col items-center justify-center text-purple-400 text-center animate-pulse">
                <Sparkles className="w-10 h-10 mb-4 animate-spin" />
                <h3 className="text-lg font-bold mb-1">AI is weaving the storyline...</h3>
                <p className="text-sm text-purple-400/80">Generating maps, quests, and finding stock images. This usually takes 15-30 seconds.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // AI FINE-TUNE MODAL (TEACHER)
    // ==========================================
    function AIFineTuneModal({ onClose, onApply, currentData, geminiApiKey }) {
      const [promptStr, setPromptStr] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const handleGenerate = async () => {
        if (!promptStr.trim()) {
          setErrorMsg('Please enter instructions for the AI.');
          return;
        }

        setIsGenerating(true);
        setErrorMsg('');

        const systemInstructionText = `You are an expert educational game designer AI.
        You will be provided with an existing game chapter in JSON format.
        Your task is to precisely modify the JSON according to the user's request.
        For example: translating content to another language, adding a new quest/stage, adjusting difficulty, adding items, etc.
        Do NOT change the IDs of existing nodes, tasks, objects, or recipes unless you are entirely replacing them.
        Return ONLY valid JSON matching the exact original structure. Do not include markdown code blocks in your final raw text if possible, just the pure JSON.`;

        const userPrompt = `USER REQUEST: ${promptStr}\n\nEXISTING JSON:\n${JSON.stringify(currentData, null, 2)}`;

        const payload = {
          contents: [{ parts: [{ text: userPrompt }] }],
          systemInstruction: { parts: [{ text: systemInstructionText }] },
          generationConfig: { responseMimeType: "application/json" }
        };

        const apiKey = (geminiApiKey || "").trim();
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        let lastError = null;
        for (let i = 0; i < 5; i++) {
          try {
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!res.ok) {
              const errText = await res.text();
              throw new Error(`API Error ${res.status}: ${errText}`);
            }

            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error('Empty response from AI');

            // Clean up potential markdown formatting in case the model returns it
            const cleanedText = text.replace(/^```(json)?/, '').replace(/```$/, '').trim();
            let parsedGame = JSON.parse(cleanedText);
            
            // Ensure crucial metadata remains intact
            parsedGame.id = currentData.id;
            parsedGame.teacherId = currentData.teacherId;

            onApply(parsedGame);
            return;
          } catch (err) {
            lastError = err;
            await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
          }
        }
        
        setIsGenerating(false);
        setErrorMsg(`Failed after retries: ${lastError?.message || 'Unknown error'}`);
      };

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/90 backdrop-blur-sm p-4">
          <div className="bg-slate-800 rounded-2xl border border-purple-500/50 shadow-[0_0_30px_rgba(168,85,247,0.2)] max-w-2xl w-full p-6 relative overflow-hidden animate-in fade-in zoom-in-95 duration-300">
            <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
              <h3 className="text-2xl font-bold text-white flex items-center gap-2">
                <Sparkles className="w-6 h-6 text-purple-400" /> AI Fine-Tuning
              </h3>
              <button onClick={onClose} disabled={isGenerating} className="text-slate-400 hover:text-white transition-colors">
                <X className="w-6 h-6" />
              </button>
            </div>
            
            <div className="space-y-4">
              <p className="text-sm text-slate-300">
                Describe how you want to change the current chapter. The AI will modify the chapter data according to your prompt.
              </p>
              
              <textarea 
                value={promptStr} 
                onChange={e => setPromptStr(e.target.value)}
                disabled={isGenerating}
                className="w-full bg-slate-900 border border-slate-600 focus:border-purple-500 rounded-xl p-4 text-white h-32 resize-none transition-colors outline-none placeholder:text-slate-500"
                placeholder="e.g., Translate all quest stories into Traditional Chinese, add a new side quest about fractions, insert an escape room between Quest 1 and Quest 2..."
              />
              
              {errorMsg && (
                <div className="p-3 bg-red-900/20 border border-red-800/50 rounded-lg flex items-center gap-2 text-red-400 text-sm font-bold">
                  <AlertTriangle className="w-4 h-4 shrink-0" />
                  {errorMsg}
                </div>
              )}
              
              <div className="flex justify-end gap-3 pt-4">
                <button onClick={onClose} disabled={isGenerating} className="px-4 py-2 text-slate-300 hover:bg-slate-700 rounded-lg transition-colors font-medium">
                  Cancel
                </button>
                <button 
                  onClick={handleGenerate} 
                  disabled={isGenerating || !promptStr.trim()} 
                  className="px-6 py-2 bg-purple-600 hover:bg-purple-500 disabled:bg-slate-700 text-white rounded-lg font-bold transition-colors flex items-center gap-2 shadow-lg"
                >
                  {isGenerating ? (
                    <><Sparkles className="w-4 h-4 animate-spin" /> Processing...</>
                  ) : (
                    <><Sparkles className="w-4 h-4" /> Apply Magic</>
                  )}
                </button>
              </div>
            </div>
            
            {isGenerating && (
              <div className="absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center z-10">
                <Sparkles className="w-12 h-12 text-purple-400 animate-spin mb-4" />
                <h4 className="text-lg font-bold text-white mb-1">Rebuilding Chapter...</h4>
                <p className="text-sm text-purple-300/80">This may take 10-20 seconds.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // GROUP BUILDER (TEACHER)
    // ==========================================
    function GroupBuilder({ group, games, students, onSave, onClose, isReadOnly }) {
      const [formData, setFormData] = useState(group);
      const [classFilter, setClassFilter] = useState('');
      const isGuestGroup = group.id === 'guest_group';

      const regularStudents = students.filter(s => !s.isGuest);
      const uniqueClasses = [...new Set(regularStudents.map(s => s.className).filter(Boolean))].sort();
      
      const filteredStudents = regularStudents
        .filter(s => !classFilter || s.className === classFilter)
        .sort((a, b) => {
          const classA = a.className || '';
          const classB = b.className || '';
          const classComp = classA.localeCompare(classB);
          if (classComp !== 0) return classComp;
          const numA = a.classNumber || '';
          const numB = b.classNumber || '';
          return numA.localeCompare(numB, undefined, { numeric: true });
        });

      const handleSelectAllFiltered = () => {
        const filteredIds = filteredStudents.map(s => s.id);
        const currentEnrolled = formData.students || [];
        const newEnrolled = [...new Set([...currentEnrolled, ...filteredIds])];
        setFormData({ ...formData, students: newEnrolled });
      };

      const handleDeselectAllFiltered = () => {
        const filteredIds = filteredStudents.map(s => s.id);
        const currentEnrolled = formData.students || [];
        const newEnrolled = currentEnrolled.filter(id => !filteredIds.includes(id));
        setFormData({ ...formData, students: newEnrolled });
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto pb-20">
          <div className="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 sticky top-20 z-30 shadow-lg transition-colors">
            <h2 className="text-2xl font-bold text-white flex items-center gap-2">
              {isReadOnly ? <Eye className="text-emerald-400 w-6 h-6" /> : <Library className="text-emerald-400 w-6 h-6" />} 
              {isReadOnly ? 'View Group' : (group.id.startsWith('group_') ? 'Create Group' : 'Edit Group')}
            </h2>
            <div className="flex space-x-3">
              <button onClick={onClose} className="px-4 py-2 text-slate-300 hover:bg-slate-700 rounded-lg transition-colors">{isReadOnly ? 'Close' : 'Cancel'}</button>
              {!isReadOnly && (
                <button onClick={() => onSave(formData)} className="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold transition-colors flex items-center gap-2 shadow-lg">
                  <Save className="w-4 h-4" /> Save Group
                </button>
              )}
            </div>
          </div>

          <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4 transition-colors">
            <div>
              <label className="block text-sm font-semibold text-slate-400 mb-1 uppercase tracking-wider">Group / Class Name</label>
              <input disabled={isReadOnly} type="text" value={formData.title} onChange={(e) => setFormData({...formData, title: e.target.value})} className={`w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none ${!isReadOnly && 'focus:border-emerald-500'}`} placeholder="e.g., Biology 101 - Fall Cohort" />
            </div>
            <div>
              <label className="block text-sm font-semibold text-slate-400 mb-1 uppercase tracking-wider">Description</label>
              <textarea disabled={isReadOnly} value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} className={`w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none h-20 ${!isReadOnly && 'focus:border-emerald-500'}`} placeholder="Details about this group..." />
            </div>
            <div>
              <label className="block text-sm font-semibold text-slate-400 mb-1 flex items-center gap-2 uppercase tracking-wider"><ImageIcon className="w-4 h-4"/> Cover Image URL</label>
              <input disabled={isReadOnly} type="text" value={formData.imageUrl || ''} onChange={(e) => setFormData({...formData, imageUrl: e.target.value})} className={`w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none ${!isReadOnly && 'focus:border-emerald-500'}`} placeholder="https://example.com/class-cover.jpg" />
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* Chapters Selection */}
            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg flex flex-col h-96 transition-colors">
              <h4 className="text-emerald-400 font-bold mb-4 flex items-center gap-2 text-lg border-b border-slate-700 pb-2">
                <Layers className="w-5 h-5" /> Assigned Chapters
              </h4>
              {games.length === 0 ? (
                <div className="text-slate-500 text-sm italic text-center mt-4">No chapters available yet.</div>
              ) : (
                <div className="space-y-2 overflow-y-auto flex-1 pr-2 custom-scrollbar">
                  {games.map(g => {
                    const isAssigned = (formData.chapters || []).includes(g.id);
                    return (
                      <label key={g.id} className={`flex items-center gap-3 p-3 rounded-xl border transition-all ${isAssigned ? 'bg-emerald-900/20 border-emerald-500/50 shadow-sm' : 'bg-slate-900 border-slate-700 hover:border-slate-500'} ${isReadOnly ? 'cursor-default' : 'cursor-pointer'}`}>
                        <input disabled={isReadOnly} type="checkbox" checked={isAssigned} onChange={(e) => {
                          const newChaps = e.target.checked ? [...(formData.chapters||[]), g.id] : (formData.chapters||[]).filter(id => id !== g.id);
                          setFormData({...formData, chapters: newChaps});
                        }} className={`w-5 h-5 rounded border-slate-600 text-emerald-500 bg-slate-800 ${!isReadOnly && 'focus:ring-emerald-500'}`} />
                        <span className={`text-sm font-semibold ${isAssigned ? 'text-emerald-400' : 'text-slate-200'}`}>{g.title}</span>
                      </label>
                    )
                  })}
                </div>
              )}
            </div>

            {/* Students Selection */}
            {isGuestGroup ? (
              <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg flex flex-col h-96 items-center justify-center text-center transition-colors">
                <div className="p-4 bg-blue-900/20 rounded-full mb-4 border border-blue-800/50">
                  <Users className="w-12 h-12 text-blue-400" />
                </div>
                <h4 className="text-white font-bold mb-2 text-xl">Open Guest Access</h4>
                <p className="text-slate-400 text-sm max-w-sm">All students who log in using the Guest ID (guest) and Password (000000) will automatically have access to this group's assigned chapters. Manual student enrollment is disabled for the Guest Lounge.</p>
              </div>
            ) : (
              <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg flex flex-col h-96 transition-colors">
                <h4 className="text-blue-400 font-bold mb-4 flex items-center gap-2 text-lg border-b border-slate-700 pb-2 justify-between">
                  <span className="flex items-center gap-2"><Users className="w-5 h-5" /> Enrolled Students</span>
                  <span className="text-xs bg-slate-900 px-2 py-1 rounded text-slate-400 font-mono">{(formData.students || []).length} / {regularStudents.length}</span>
                </h4>

                {regularStudents.length > 0 && (
                  <div className="flex flex-wrap gap-2 mb-3 items-center">
                    <select
                      value={classFilter}
                      onChange={(e) => setClassFilter(e.target.value)}
                      className="bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-white text-xs focus:outline-none focus:border-blue-500 flex-1 min-w-[100px]"
                    >
                      <option value="">All Classes</option>
                      {uniqueClasses.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    {!isReadOnly && (
                      <div className="flex gap-1 shrink-0">
                        <button onClick={handleSelectAllFiltered} className="bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white border border-blue-500/50 px-2 py-1.5 rounded text-xs transition-colors whitespace-nowrap font-semibold">
                          Select All
                        </button>
                        <button onClick={handleDeselectAllFiltered} className="bg-slate-700 hover:bg-slate-600 text-slate-300 px-2 py-1.5 rounded text-xs transition-colors whitespace-nowrap border border-slate-600">
                          Clear
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {regularStudents.length === 0 ? (
                  <div className="text-slate-500 text-sm italic text-center mt-4">No regular students created yet.</div>
                ) : (
                  <div className="space-y-2 overflow-y-auto flex-1 pr-2 custom-scrollbar">
                    {filteredStudents.map(s => {
                      const isEnrolled = (formData.students || []).includes(s.id);
                      return (
                        <label key={s.id} className={`flex items-center justify-between p-3 rounded-xl border transition-all ${isEnrolled ? 'bg-blue-900/20 border-blue-500/50 shadow-sm' : 'bg-slate-900 border-slate-700 hover:border-slate-500'} ${isReadOnly ? 'cursor-default' : 'cursor-pointer'}`}>
                          <div className="flex items-center gap-3">
                            <input disabled={isReadOnly} type="checkbox" checked={isEnrolled} onChange={(e) => {
                              const newStus = e.target.checked ? [...(formData.students||[]), s.id] : (formData.students||[]).filter(id => id !== s.id);
                              setFormData({...formData, students: newStus});
                            }} className={`w-5 h-5 rounded border-slate-600 text-blue-500 bg-slate-800 ${!isReadOnly && 'focus:ring-blue-500'}`} />
                            <div className="flex flex-col">
                              <span className={`text-sm font-bold ${isEnrolled ? 'text-blue-400' : 'text-slate-200'}`}>{s.name}</span>
                              <span className="text-[10px] text-slate-500 font-mono">{s.id}</span>
                            </div>
                          </div>
                          <span className="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded">{s.className} - {s.classNumber}</span>
                        </label>
                      )
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // GAME BUILDER (TEACHER)
    // ==========================================
    function GameBuilder({ game, onSave, onClose, setActiveTheme, isReadOnly, geminiApiKey }) {
      const [formData, setFormData] = useState(() => {
        const legacyItems = game.nodes?.flatMap(n => {
          const items = [];
          if (n.rewardItem) items.push(n.rewardItem);
          if (n.rewardItems) items.push(...n.rewardItems);
          if (n.type === 'escape_room' && n.objects) {
            n.objects.forEach(obj => {
              if (obj.rewardItems) items.push(...obj.rewardItems);
            });
          }
          return items;
        }).filter(Boolean) || [];
        const defined = game.definedItems || [];
        return { ...game, definedItems: Array.from(new Set([...defined, ...legacyItems])) };
      });
      const [draggingNodeId, setDraggingNodeId] = useState(null);
      const [newItemName, setNewItemName] = useState('');
      const [showAIFineTune, setShowAIFineTune] = useState(false);
      
      // Item editing states
      const [editingItemName, setEditingItemName] = useState(null);
      const [editItemDraft, setEditItemDraft] = useState('');
      
      // Recipe States
      const [recipeInputs, setRecipeInputs] = useState([]);
      const [recipeOutput, setRecipeOutput] = useState('');

      // Save state indicator
      const [saveStatus, setSaveStatus] = useState('idle');
      
      // Auto-focus state for new quests
      const [focusNodeId, setFocusNodeId] = useState(null);
      const hasDragged = React.useRef(false);

      const handleSaveClick = async () => {
        setSaveStatus('saving');
        try {
          await onSave(formData);
          setSaveStatus('success');
          setTimeout(() => {
            setSaveStatus('idle');
          }, 2000);
        } catch (error) {
          console.error("Save error:", error);
          setSaveStatus('error');
          setTimeout(() => setSaveStatus('idle'), 3000);
        }
      };

      const addNewItemToDictionary = () => {
        const name = newItemName.trim();
        if (!name) return;
        const currentItems = formData.definedItems || [];
        if (!currentItems.includes(name)) {
          setFormData({ ...formData, definedItems: [...currentItems, name] });
        }
        setNewItemName('');
      };

      const startEditingItem = (itemName) => {
        setEditingItemName(itemName);
        setEditItemDraft(itemName);
      };

      const saveEditedItem = () => {
        const oldName = editingItemName;
        const newName = editItemDraft.trim();
        
        if (!newName || newName === oldName) {
          setEditingItemName(null);
          return;
        }

        if ((formData.definedItems || []).includes(newName)) {
          setEditingItemName(null);
          return; 
        }

        const newDefinedItems = (formData.definedItems || []).map(i => i === oldName ? newName : i);

        const newItemImages = { ...(formData.itemImages || {}) };
        if (newItemImages[oldName] !== undefined) {
          newItemImages[newName] = newItemImages[oldName];
          delete newItemImages[oldName];
        }

        const newItemDescriptions = { ...(formData.itemDescriptions || {}) };
        if (newItemDescriptions[oldName] !== undefined) {
          newItemDescriptions[newName] = newItemDescriptions[oldName];
          delete newItemDescriptions[oldName];
        }

        const newNodes = (formData.nodes || []).map(node => {
          const newNode = { ...node };
          if (newNode.rewardItem === oldName) newNode.rewardItem = newName;
          if (newNode.rewardItems) newNode.rewardItems = newNode.rewardItems.map(i => i === oldName ? newName : i);
          if (newNode.requiredItems) newNode.requiredItems = newNode.requiredItems.map(i => i === oldName ? newName : i);
          
          if (newNode.type === 'escape_room' && newNode.objects) {
            newNode.objects = newNode.objects.map(obj => {
              const newObj = { ...obj };
              if (newObj.requiresItem === oldName) newObj.requiresItem = newName;
              if (newObj.rewardItems) newObj.rewardItems = newObj.rewardItems.map(i => i === oldName ? newName : i);
              return newObj;
            });
          }
          return newNode;
        });

        const newRecipes = (formData.recipes || []).map(r => ({
          ...r,
          inputs: r.inputs.map(i => i === oldName ? newName : i),
          output: r.output === oldName ? newName : r.output
        }));

        setRecipeInputs(prev => prev.map(i => i === oldName ? newName : i));
        setRecipeOutput(prev => prev === oldName ? newName : prev);

        setFormData({
          ...formData,
          definedItems: newDefinedItems,
          itemImages: newItemImages,
          itemDescriptions: newItemDescriptions,
          nodes: newNodes,
          recipes: newRecipes
        });
        setEditingItemName(null);
      };

      const deleteItemFromDictionary = (itemName) => {
        const newNodes = (formData.nodes || []).map(node => {
          const newNode = { ...node };
          if (newNode.rewardItem === itemName) newNode.rewardItem = '';
          if (newNode.rewardItems) newNode.rewardItems = newNode.rewardItems.filter(i => i !== itemName);
          if (newNode.requiredItems) newNode.requiredItems = newNode.requiredItems.filter(i => i !== itemName);
          
          if (newNode.type === 'escape_room' && newNode.objects) {
            newNode.objects = newNode.objects.map(obj => {
              const newObj = { ...obj };
              if (newObj.requiresItem === itemName) newObj.requiresItem = '';
              if (newObj.rewardItems) newObj.rewardItems = newObj.rewardItems.filter(i => i !== itemName);
              return newObj;
            });
          }
          return newNode;
        });

        const newRecipes = (formData.recipes || []).filter(r => 
          r.output !== itemName && !r.inputs.includes(itemName)
        );

        setRecipeInputs(prev => prev.filter(i => i !== itemName));
        setRecipeOutput(prev => prev === itemName ? '' : prev);

        const currentItems = formData.definedItems || [];
        setFormData({ 
          ...formData, 
          nodes: newNodes,
          recipes: newRecipes,
          definedItems: currentItems.filter(i => i !== itemName) 
        });
      };

      const handleImageChange = (itemName, url) => {
        setFormData(prev => ({
          ...prev,
          itemImages: { ...(prev.itemImages || {}), [itemName]: url }
        }));
      };

      const handleDescriptionChange = (itemName, desc) => {
        setFormData(prev => ({
          ...prev,
          itemDescriptions: { ...(prev.itemDescriptions || {}), [itemName]: desc }
        }));
      };

      const updateTask = (nodeIndex, taskIndex, field, value) => {
        const newNodes = [...formData.nodes];
        if (!newNodes[nodeIndex].tasks) {
          newNodes[nodeIndex].tasks = [{ imageUrl: '', description: '', link: newNodes[nodeIndex].link || '', passcode: newNodes[nodeIndex].passcode || '' }];
        }
        newNodes[nodeIndex].tasks[taskIndex][field] = value;
        setFormData({ ...formData, nodes: newNodes });
      };

      const addTask = (nodeIndex) => {
        const newNodes = [...formData.nodes];
        if (!newNodes[nodeIndex].tasks) {
          newNodes[nodeIndex].tasks = [{ imageUrl: '', description: '', link: newNodes[nodeIndex].link || '', passcode: newNodes[nodeIndex].passcode || '' }];
        }
        newNodes[nodeIndex].tasks.push({ imageUrl: '', description: '', link: '', passcode: '' });
        setFormData({ ...formData, nodes: newNodes });
      };

      const removeTask = (nodeIndex, taskIndex) => {
        const newNodes = [...formData.nodes];
        newNodes[nodeIndex].tasks.splice(taskIndex, 1);
        setFormData({ ...formData, nodes: newNodes });
      };

      const addObject = (nodeIndex) => {
        const newNodes = [...formData.nodes];
        if (!newNodes[nodeIndex].objects) newNodes[nodeIndex].objects = [];
        newNodes[nodeIndex].objects.push({
          id: `obj_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
          name: 'New Object',
          description: '',
          requiresItem: '',
          link: '',
          passcode: '',
          rewardItems: [],
          isFinal: false
        });
        setFormData({ ...formData, nodes: newNodes });
      };

      const updateObject = (nodeIndex, objIndex, field, value) => {
        const newNodes = [...formData.nodes];
        newNodes[nodeIndex].objects[objIndex][field] = value;
        setFormData({ ...formData, nodes: newNodes });
      };

      const removeObject = (nodeIndex, objIndex) => {
        const newNodes = [...formData.nodes];
        newNodes[nodeIndex].objects.splice(objIndex, 1);
        setFormData({ ...formData, nodes: newNodes });
      };

      const addNode = () => {
        const newNodeId = `node_${Date.now()}`;
        setFormData({
          ...formData,
          nodes: [...(formData.nodes || []), {
            id: newNodeId,
            title: 'New Quest',
            type: 'main',
            isFinalNode: false,
            lockedStory: '',
            lockedImageUrl: '',
            story: '',
            imageUrl: '',
            completedStory: '',
            completedImageUrl: '',
            tasks: [{ imageUrl: '', description: '', link: '', passcode: '' }],
            rewardItem: '',
            rewardItems: [],
            requiredItems: [],
            requiredNodes: [],
            requiredPassword: '',
            x: 50 + (Math.random() * 10 - 5),
            y: 50 + (Math.random() * 10 - 5)
          }]
        });
        setFocusNodeId(newNodeId);
      };

      const updateNode = (index, field, value) => {
        const newNodes = [...formData.nodes];
        newNodes[index][field] = value;
        setFormData({ ...formData, nodes: newNodes });
      };

      const updateNodePosition = (id, x, y) => {
        setFormData(prev => ({
          ...prev,
          nodes: prev.nodes.map(n => n.id === id ? { ...n, x, y } : n)
        }));
      };

      const moveNodeUp = (index) => {
        if (index === 0) return;
        const newNodes = [...formData.nodes];
        [newNodes[index - 1], newNodes[index]] = [newNodes[index], newNodes[index - 1]];
        setFormData({ ...formData, nodes: newNodes });
      };

      const moveNodeDown = (index) => {
        if (index === formData.nodes.length - 1) return;
        const newNodes = [...formData.nodes];
        [newNodes[index], newNodes[index + 1]] = [newNodes[index + 1], newNodes[index]];
        setFormData({ ...formData, nodes: newNodes });
      };

      const duplicateNode = (index) => {
        const nodeToClone = formData.nodes[index];
        const clonedNode = JSON.parse(JSON.stringify(nodeToClone));
        
        clonedNode.id = `node_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
        clonedNode.title = `${clonedNode.title} (Copy)`;
        
        clonedNode.x = Math.min(100, Math.max(0, (clonedNode.x || 50) + 5));
        clonedNode.y = Math.min(100, Math.max(0, (clonedNode.y || 50) + 5));

        if (clonedNode.type === 'escape_room' && clonedNode.objects) {
          clonedNode.objects = clonedNode.objects.map(obj => ({
            ...obj,
            id: `obj_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`
          }));
        }

        const newNodes = [...formData.nodes];
        newNodes.splice(index + 1, 0, clonedNode);
        setFormData({ ...formData, nodes: newNodes });
        setFocusNodeId(clonedNode.id);
      };

      const insertNodeAfter = (index) => {
        const newNodes = [...(formData.nodes || [])];
        const newNodeId = `node_${Date.now()}`;
        newNodes.splice(index + 1, 0, {
          id: newNodeId,
          title: 'New Quest',
          type: 'main',
          isFinalNode: false,
          lockedStory: '',
          lockedImageUrl: '',
          story: '',
          imageUrl: '',
          completedStory: '',
          completedImageUrl: '',
          tasks: [{ imageUrl: '', description: '', link: '', passcode: '' }],
          rewardItem: '',
          rewardItems: [],
          requiredItems: [],
          requiredNodes: [],
          requiredPassword: '',
          x: 50 + (Math.random() * 10 - 5),
          y: 50 + (Math.random() * 10 - 5)
        });
        setFormData({ ...formData, nodes: newNodes });
        setFocusNodeId(newNodeId);
      };

      const deleteNode = (index) => {
        const newNodes = [...formData.nodes];
        newNodes.splice(index, 1);
        setFormData({ ...formData, nodes: newNodes });
      };

      const availableItems = formData.definedItems || [];

      return (
        <div className="space-y-6 max-w-5xl mx-auto pb-20">
          <div className="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 sticky top-20 z-30 shadow-lg">
            <h2 className="text-2xl font-bold text-white flex items-center gap-2">
              {isReadOnly ? <Eye className="text-emerald-400" /> : <Edit3 className="text-emerald-400" />} 
              {isReadOnly ? 'View Chapter' : (game.id.startsWith('game_') ? 'Edit Chapter' : 'Create Chapter')}
            </h2>
            <div className="flex space-x-3">
              <button onClick={onClose} disabled={saveStatus === 'saving'} className="px-4 py-2 text-slate-300 hover:bg-slate-700 rounded-lg transition-colors">
                {isReadOnly ? 'Close' : 'Cancel'}
              </button>
              {!isReadOnly && (
                <button 
                  onClick={() => setShowAIFineTune(true)}
                  disabled={saveStatus === 'saving'}
