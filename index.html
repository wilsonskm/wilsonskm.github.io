                  className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-lg flex items-center gap-2 font-medium transition-colors shadow-lg"
                >
                  <Sparkles className="w-4 h-4" /> <span className="hidden md:inline">AI Fine-Tune</span>
                </button>
              )}
              {!isReadOnly && (
                <button 
                  onClick={handleSaveClick} 
                  disabled={saveStatus === 'saving' || saveStatus === 'success'}
                  className={`px-4 py-2 text-white rounded-lg flex items-center gap-2 font-medium transition-colors ${
                    saveStatus === 'success' ? 'bg-emerald-500' :
                    saveStatus === 'saving' ? 'bg-slate-600 cursor-not-allowed' : 
                    saveStatus === 'error' ? 'bg-red-600 hover:bg-red-500' :
                    'bg-emerald-600 hover:bg-emerald-500'
                  }`}
                >
                  {saveStatus === 'success' ? <CheckCircle className="w-4 h-4" /> : 
                   saveStatus === 'error' ? <AlertTriangle className="w-4 h-4" /> :
                   <Save className={`w-4 h-4 ${saveStatus === 'saving' ? 'animate-pulse' : ''}`} />} 
                  {saveStatus === 'success' ? 'Saved!' : 
                   saveStatus === 'saving' ? 'Saving...' : 
                   saveStatus === 'error' ? 'Error!' : 'Save'}
                </button>
              )}
            </div>
          </div>

          <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="block text-sm font-medium text-slate-400 mb-1">Chapter Title</label>
                <input disabled={isReadOnly} type="text" value={formData.title} onChange={(e) => setFormData({...formData, title: e.target.value})} className={`w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none ${!isReadOnly && 'focus:border-emerald-500'}`} placeholder="e.g., The Cell Structure" />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-400 mb-1 flex items-center gap-2"><Sparkles className="w-4 h-4"/> Chapter Theme Color</label>
                <select disabled={isReadOnly} value={formData.themeColor || 'slate'} onChange={(e) => { setFormData({...formData, themeColor: e.target.value}); setActiveTheme(e.target.value); }} className={`w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none ${!isReadOnly && 'focus:border-emerald-500'}`}>
                  <option value="slate">Slate (Default Dark)</option>
                  <option value="indigo">Indigo (Deep Ocean / Sci-Fi)</option>
                  <option value="rose">Rose (Crimson / Danger)</option>
                  <option value="emerald">Emerald (Toxic / Forest)</option>
                  <option value="amber">Amber (Desert / Warning)</option>
                  <option value="purple">Purple (Mystic / Void)</option>
                  <option value="sky-light">Sky Blue (Light)</option>
                  <option value="mint-light">Mint Green (Light)</option>
                  <option value="pink-light">Cherry Blossom (Light)</option>
                  <option value="amber-light">Golden Amber (Light)</option>
                  <option value="lavender-light">Lavender (Light)</option>
                </select>
              </div>
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-400 mb-1 flex items-center gap-2"><ImageIcon className="w-4 h-4"/> Chapter Illustration Image URL (Story Background)</label>
              <input disabled={isReadOnly} type="text" value={formData.chapterImageUrl || ''} onChange={(e) => setFormData({...formData, chapterImageUrl: e.target.value})} className={`w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none ${!isReadOnly && 'focus:border-emerald-500'}`} placeholder="https://example.com/story-bg.jpg" />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-400 mb-1">Description / Story Background</label>
              <textarea disabled={isReadOnly} value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} className={`w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none h-20 ${!isReadOnly && 'focus:border-emerald-500'}`} placeholder="Introduce the background story here..." />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-400 mb-1 flex items-center gap-2"><ImageIcon className="w-4 h-4"/> Map Background Image URL (Optional)</label>
              <input disabled={isReadOnly} type="text" value={formData.mapImageUrl || ''} onChange={(e) => setFormData({...formData, mapImageUrl: e.target.value})} className={`w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none ${!isReadOnly && 'focus:border-emerald-500'}`} placeholder="https://example.com/map.jpg" />
            </div>
          </div>

          {/* Map Interactive Editor */}
          <div className="bg-slate-800 p-6 rounded-xl border border-slate-700">
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-xl font-bold text-white flex items-center gap-2"><MapPin className="text-emerald-400" /> Spatial Map Editor</h3>
              <p className="text-sm text-slate-400">{isReadOnly ? 'Viewing quest markers.' : 'Drag and drop the quest markers to position them on the map. Click a marker to jump to its editing block.'}</p>
            </div>
            
            <div className="p-4 sm:p-8 bg-slate-900 rounded-xl border border-slate-700 border-dashed overflow-visible">
              <div 
                className={`relative w-full aspect-[4/3] md:aspect-[16/10] group ${isReadOnly ? 'cursor-default' : 'cursor-crosshair'}`}
                onPointerMove={(e) => {
                  if (!draggingNodeId || isReadOnly) return;
                  hasDragged.current = true;
                  const rect = e.currentTarget.getBoundingClientRect();
                  let x = ((e.clientX - rect.left) / rect.width) * 100;
                  let y = ((e.clientY - rect.top) / rect.height) * 100;
                  x = Math.max(0, Math.min(100, x));
                  y = Math.max(0, Math.min(100, y));
                  updateNodePosition(draggingNodeId, x, y);
                }}
                onPointerUp={() => setDraggingNodeId(null)}
                onPointerLeave={() => setDraggingNodeId(null)}
              >
                {/* Background Layer with Overflow Hidden for rounded corners */}
                <div className="absolute inset-0 rounded-xl overflow-hidden bg-slate-900 shadow-inner pointer-events-none border border-slate-700/50">
                  {formData.mapImageUrl ? (
                    <img src={formData.mapImageUrl} alt="Map Background" className="absolute inset-0 w-full h-full object-cover opacity-60" />
                  ) : (
                    <div className="absolute inset-0 flex items-center justify-center text-slate-600 font-medium bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-30">No background image. Add a URL above to see your map.</div>
                  )}
                </div>

                {/* Draw Lines for Prerequisites */}
                <svg className="absolute inset-0 w-full h-full pointer-events-none z-10 overflow-visible">
                  {formData.nodes?.map(node => (
                    (node.requiredNodes || []).map(reqNodeId => {
                      const sourceNode = formData.nodes.find(n => n.id === reqNodeId);
                      if (!sourceNode || sourceNode.x == null || node.x == null) return null;
                      return (
                        <line 
                          key={`${sourceNode.id}-${node.id}`}
                          x1={`${sourceNode.x}%`} y1={`${sourceNode.y}%`} 
                          x2={`${node.x}%`} y2={`${node.y}%`} 
                          stroke="#475569" strokeWidth="3" strokeDasharray="6"
                        />
                      );
                    })
                  ))}
                </svg>

                {/* Render Nodes on Map */}
                {formData.nodes?.map((node, idx) => {
                  const x = node.x || 50;
                  const y = node.y || 50;
                  
                  let labelXClass = "left-1/2 -translate-x-1/2";
                  if (x < 10) labelXClass = "left-0 translate-x-0";
                  else if (x > 90) labelXClass = "right-0 translate-x-0";

                  let labelYClass = "top-full mt-1";
                  if (y > 90) labelYClass = "bottom-full mb-1";

                  return (
                    <div 
                      key={node.id}
                      style={{ left: `${x}%`, top: `${y}%` }}
                      className={`absolute -translate-x-1/2 -translate-y-1/2 p-2 rounded-full z-20 transition-transform
                        ${isReadOnly ? 'cursor-pointer hover:scale-110 border-2 border-slate-600 bg-slate-800' : 'cursor-grab active:cursor-grabbing hover:border-emerald-400 hover:scale-110 border-2 border-slate-600 bg-slate-800'}
                        ${draggingNodeId === node.id ? 'bg-emerald-500 scale-125 shadow-[0_0_15px_rgba(16,185,129,0.5)]' : ''}`}
                      onPointerDown={(e) => {
                        if (isReadOnly) return;
                        e.stopPropagation();
                        hasDragged.current = false;
                        setDraggingNodeId(node.id);
                      }}
                      onClick={(e) => {
                        e.stopPropagation();
                        if (!hasDragged.current) {
                          setFocusNodeId(node.id);
                        }
                      }}
                      title={node.title}
                    >
                      <div className={`absolute ${labelYClass} ${labelXClass} text-[10px] font-bold bg-black/80 px-2 py-0.5 rounded text-white pointer-events-none max-w-[120px] truncate text-center z-50`}>
                        {node.title}
                      </div>
                      <MapIcon className={`w-4 h-4 ${draggingNodeId === node.id ? 'text-white' : 'text-slate-300'}`} />
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* Item Dictionary */}
          <div className="bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
              <BookOpen className="w-5 h-5 text-emerald-400" /> Item Management & Dictionary
            </h3>
            <p className="text-sm text-slate-400 mb-4">
              {isReadOnly ? 'Items available in this chapter.' : 'Create items here to use them as rewards or prerequisites in your quests.'}
              {!isReadOnly && <strong className="text-emerald-400 font-medium bg-emerald-900/20 px-2 py-0.5 rounded border border-emerald-800/50 ml-1">Items are isolated and specific to this chapter.</strong>}
            </p>
            
            {!isReadOnly && (
              <div className="flex gap-2 mb-6 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 items-end">
                <div className="flex-1">
                  <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Create New Item</label>
                  <input 
                    type="text" 
                    value={newItemName} 
                    onChange={e => setNewItemName(e.target.value)} 
                    onKeyDown={e => e.key === 'Enter' && addNewItemToDictionary()}
                    className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm focus:outline-none focus:border-emerald-500" 
                    placeholder="e.g., Gold Key" 
                  />
                </div>
                <button onClick={addNewItemToDictionary} className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded font-medium flex items-center gap-2 transition-colors h-[38px]">
                  <Plus className="w-4 h-4" /> Add
                </button>
              </div>
            )}

            {availableItems.length > 0 ? (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {availableItems.map(item => (
                  <div key={item} className="bg-slate-900 p-3 rounded-lg border border-slate-700 flex flex-col gap-2 relative group">
                    {!isReadOnly && (
                      <div className="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity z-10">
                        <button 
                          onClick={() => startEditingItem(item)} 
                          className="text-slate-400 hover:text-blue-400 bg-slate-800 rounded p-1"
                          title="Edit Item Name"
                        >
                          <Edit3 className="w-3 h-3" />
                        </button>
                        <button 
                          onClick={() => deleteItemFromDictionary(item)} 
                          className="text-slate-400 hover:text-red-400 bg-slate-800 rounded p-1"
                          title="Delete item from game"
                        >
                          <Trash2 className="w-3 h-3" />
                        </button>
                      </div>
                    )}

                    {editingItemName === item ? (
                      <div className="pr-14">
                        <input 
                          type="text" 
                          autoFocus
                          value={editItemDraft} 
                          onChange={e => setEditItemDraft(e.target.value)}
                          onKeyDown={e => {
                            if (e.key === 'Enter') saveEditedItem();
                            else if (e.key === 'Escape') setEditingItemName(null);
                          }}
                          onBlur={saveEditedItem}
                          className="w-full bg-slate-800 border border-emerald-500 rounded p-1 text-emerald-400 text-xs font-bold focus:outline-none"
                        />
                      </div>
                    ) : (
                      <label 
                        className={`block text-xs font-bold text-emerald-400 truncate pr-14 ${isReadOnly ? '' : 'cursor-pointer hover:text-emerald-300'}`}
                        title={isReadOnly ? '' : "Click to edit name"}
                        onClick={() => !isReadOnly && startEditingItem(item)}
                      >
                        {item}
                      </label>
                    )}

                    <div className="flex gap-2 items-center">
                      {formData.itemImages?.[item] ? (
                        <img src={formData.itemImages[item]} alt={item} className="w-8 h-8 object-contain rounded bg-slate-800 p-1" />
                      ) : (
                        <div className="w-8 h-8 rounded bg-slate-800 border border-slate-700 flex items-center justify-center shrink-0">
                          <ImageIcon className="w-4 h-4 text-slate-500" />
                        </div>
                      )}
                      <input 
                        disabled={isReadOnly}
                        type="text" 
                        value={formData.itemImages?.[item] || ''} 
                        onChange={(e) => handleImageChange(item, e.target.value)} 
                        className={`w-full bg-slate-800 border border-slate-700 rounded p-2 text-white text-xs focus:outline-none ${!isReadOnly && 'focus:border-emerald-500'}`} 
                        placeholder="Image URL (https://...)" 
                      />
                    </div>
                    <textarea
                      disabled={isReadOnly}
                      value={formData.itemDescriptions?.[item] || ''}
                      onChange={(e) => handleDescriptionChange(item, e.target.value)}
                      className={`w-full bg-slate-800 border border-slate-700 rounded p-2 text-white text-xs focus:outline-none h-10 resize-none ${!isReadOnly && 'focus:border-emerald-500'}`}
                      placeholder="Item description or lore..."
                    />
                  </div>
                ))}
              </div>
            ) : (
              <div className="text-center p-6 bg-slate-900/50 rounded-lg border border-slate-700 border-dashed text-slate-500 text-sm">
                No items available.
              </div>
            )}
          </div>

          {/* Item Combination Recipes */}
          <div className="bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
              <Wrench className="w-5 h-5 text-amber-400" /> Combination Recipes
            </h3>
            
            {!isReadOnly && (
              <>
                <p className="text-sm text-slate-400 mb-4">
                  Define recipes to let students combine two or more items into a new one. (Items used in combination will be consumed).
                </p>
                <div className="flex flex-col md:flex-row gap-4 mb-6 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 items-end">
                  <div className="flex-1 w-full">
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Input Items (Prerequisites)</label>
                    <div className="flex flex-wrap gap-2 mb-2">
                      {recipeInputs.map((req, rIdx) => (
                        <span key={rIdx} className="bg-slate-700 text-slate-200 text-xs px-2 py-1 rounded flex items-center gap-1 border border-slate-600">
                          {req} 
                          <button onClick={() => setRecipeInputs(recipeInputs.filter((_, i) => i !== rIdx))} className="hover:text-red-400 ml-1">×</button>
                        </span>
                      ))}
                    </div>
                    <select 
                      onChange={(e) => {
                        if (e.target.value && !recipeInputs.includes(e.target.value)) {
                          setRecipeInputs([...recipeInputs, e.target.value]);
                        }
                        e.target.value = '';
                      }}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm"
                    >
                      <option value="">+ Add input item...</option>
                      {availableItems.filter(item => !recipeInputs.includes(item)).map((item, i) => (
                        <option key={i} value={item}>{item}</option>
                      ))}
                    </select>
                  </div>

                  <div className="flex items-center justify-center p-2 hidden md:block">
                    <span className="text-slate-500 font-bold text-xl">→</span>
                  </div>

                  <div className="flex-1 w-full">
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Output Item (Result)</label>
                    <select 
                      value={recipeOutput}
                      onChange={(e) => setRecipeOutput(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm"
                    >
                      <option value="">Select result item...</option>
                      {availableItems.map((item, i) => (
                        <option key={i} value={item}>{item}</option>
                      ))}
                    </select>
                  </div>

                  <button 
                    onClick={() => {
                      if (recipeInputs.length >= 2 && recipeOutput) {
                        setFormData({
                          ...formData,
                          recipes: [...(formData.recipes || []), { id: `rec_${Date.now()}`, inputs: recipeInputs, output: recipeOutput }]
                        });
                        setRecipeInputs([]);
                        setRecipeOutput('');
                      }
                    }}
                    disabled={recipeInputs.length < 2 || !recipeOutput}
                    className="bg-amber-600 disabled:bg-slate-700 disabled:text-slate-500 hover:bg-amber-500 text-white px-4 py-2 rounded font-medium flex items-center justify-center gap-2 transition-colors h-[38px] w-full md:w-auto"
                  >
                    <Plus className="w-4 h-4" /> Add Recipe
                  </button>
                </div>
              </>
            )}

            {(formData.recipes || []).length > 0 ? (
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                {formData.recipes.map((rec, idx) => (
                  <div key={rec.id} className="bg-slate-900 p-3 rounded-lg border border-slate-700 flex items-center justify-between overflow-x-auto">
                    <div className="flex items-center gap-2 flex-wrap flex-1 min-w-0">
                      {rec.inputs.map((inp, i) => (
                        <React.Fragment key={i}>
                          <span className="text-xs text-slate-300 bg-slate-800 px-2 py-1 rounded border border-slate-600 truncate max-w-[100px]">{inp}</span>
                          {i < rec.inputs.length - 1 && <span className="text-slate-500 text-xs font-bold">+</span>}
                        </React.Fragment>
                      ))}
                      <span className="text-emerald-500 font-bold mx-1">→</span>
                      <span className="text-xs font-bold text-emerald-400 bg-emerald-900/30 px-2 py-1 rounded border border-emerald-700/50 truncate max-w-[120px]">{rec.output}</span>
                    </div>
                    {!isReadOnly && (
                      <button 
                        onClick={() => {
                          const newRecs = [...formData.recipes];
                          newRecs.splice(idx, 1);
                          setFormData({ ...formData, recipes: newRecs });
                        }}
                        className="text-slate-500 hover:text-red-400 p-1 ml-2 shrink-0"
                      >
                        <Trash2 className="w-4 h-4" />
                      </button>
                    )}
                  </div>
                ))}
              </div>
            ) : (
              <p className="text-sm text-slate-500 text-center">No recipes created yet.</p>
            )}
          </div>

          {/* Quest Editor List */}
          <div className="space-y-4">
            <div className="flex justify-between items-center">
              <h3 className="text-xl font-bold text-white">Quests Details</h3>
            </div>

            {(!formData.nodes || formData.nodes.length === 0) ? (
               <div className="text-center p-8 bg-slate-800/50 rounded-xl border border-slate-700 border-dashed text-slate-400">
                 {isReadOnly ? 'No quests available.' : 'No quests added yet. Click "Add New Quest / Stage" below to start building.'}
               </div>
            ) : (
              formData.nodes.map((node, idx) => (
                <div key={node.id} className="bg-slate-800 p-6 rounded-xl border border-slate-600 relative overflow-visible transition-colors">
                  {!isReadOnly && (
                    <div className="absolute top-4 right-4 flex gap-2">
                      <button onClick={() => moveNodeUp(idx)} disabled={idx === 0} className="p-1.5 text-slate-500 hover:text-white disabled:opacity-30 bg-slate-900 rounded-lg transition-colors" title="Move Up">
                        <ArrowUp className="w-5 h-5" />
                      </button>
                      <button onClick={() => moveNodeDown(idx)} disabled={idx === formData.nodes.length - 1} className="p-1.5 text-slate-500 hover:text-white disabled:opacity-30 bg-slate-900 rounded-lg transition-colors" title="Move Down">
                        <ArrowDown className="w-5 h-5" />
                      </button>
                      <button onClick={() => duplicateNode(idx)} className="p-1.5 text-slate-500 hover:text-blue-400 bg-slate-900 rounded-lg transition-colors ml-2" title="Duplicate Quest">
                        <Copy className="w-5 h-5" />
                      </button>
                      <button onClick={() => insertNodeAfter(idx)} className="p-1.5 text-slate-500 hover:text-emerald-400 bg-slate-900 rounded-lg transition-colors" title="Insert New Quest Below">
                        <Plus className="w-5 h-5" />
                      </button>
                      <button onClick={() => deleteNode(idx)} className="p-1.5 text-slate-500 hover:text-red-400 bg-slate-900 rounded-lg transition-colors" title="Delete Quest">
                        <Trash2 className="w-5 h-5" />
                      </button>
                    </div>
                  )}
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4 mt-2 pr-44">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Quest Title</label>
                      <input 
                        disabled={isReadOnly}
                        type="text" 
                        value={node.title} 
                        onChange={(e) => updateNode(idx, 'title', e.target.value)} 
                        ref={(el) => {
                          if (el && focusNodeId === node.id) {
                            setTimeout(() => {
                              el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                              el.focus();
                            }, 50);
                            setFocusNodeId(null);
                          }
                        }}
                        className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white ${!isReadOnly && 'focus:border-emerald-500 focus:outline-none'}`} 
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Type</label>
                      <select disabled={isReadOnly} value={node.type} onChange={(e) => updateNode(idx, 'type', e.target.value)} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white ${!isReadOnly && 'focus:border-emerald-500 focus:outline-none'}`}>
                        <option value="main">Main Quest</option>
                        <option value="side">Side Quest</option>
                        <option value="escape_room">Escape Room Stage</option>
                      </select>
                    </div>
                    <div className="md:col-span-2 flex items-center gap-3 p-3 bg-amber-900/20 border border-amber-800/50 rounded-lg mt-[-10px]">
                      <input 
                        disabled={isReadOnly}
                        type="checkbox" 
                        checked={node.isFinalNode || false} 
                        onChange={(e) => updateNode(idx, 'isFinalNode', e.target.checked)} 
                        className={`w-5 h-5 rounded border-slate-600 text-emerald-500 focus:ring-emerald-500 bg-slate-800 ${isReadOnly ? 'cursor-default' : 'cursor-pointer'}`} 
                      />
                      <div>
                        <div className="text-sm font-bold text-amber-400">Mark as Final Quest</div>
                        <div className="text-xs text-slate-400 mt-0.5">Completing all marked Final Quests will mark the entire chapter as finished (students can still explore other side quests afterwards).</div>
                      </div>
                    </div>
                  </div>

                  {/* Before Access State */}
                  <div className="mb-4 p-4 bg-slate-900/40 rounded-xl border border-slate-700/50">
                    <h4 className="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2"><Lock className="w-4 h-4"/> Before Access (Locked / Password Required)</h4>
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1 flex items-center gap-1"><ImageIcon className="w-3 h-3"/> Locked Illustration Image URL (Optional)</label>
                    <div className="flex gap-3 mb-3">
                      {node.lockedImageUrl && <img src={node.lockedImageUrl} alt="Preview" className="w-10 h-10 object-cover rounded border border-slate-700 shrink-0" />}
                      <input disabled={isReadOnly} type="text" value={node.lockedImageUrl || ''} onChange={(e) => updateNode(idx, 'lockedImageUrl', e.target.value)} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white ${!isReadOnly && 'focus:outline-none focus:border-emerald-500'}`} placeholder="https://example.com/locked-door.jpg" />
                    </div>
                    
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Locked Description / Story</label>
                    <textarea disabled={isReadOnly} value={node.lockedStory || ''} onChange={(e) => updateNode(idx, 'lockedStory', e.target.value)} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white h-10 ${!isReadOnly && 'focus:outline-none focus:border-emerald-500'}`} placeholder="A heavy steel door blocks your path..." />
                  </div>

                  {/* Prerequisite Quests */}
                  <div className="p-4 bg-indigo-900/20 border border-indigo-800/50 rounded-lg mb-4">
                    <label className="block text-xs font-semibold text-indigo-400 uppercase mb-1 flex items-center gap-1"><MapIcon className="w-3 h-3"/> Prerequisite Quests (Map Connections)</label>
                    <p className="text-[10px] text-indigo-400/80 mb-2">Lines will be drawn on the map to connect these prerequisite quests to this quest.</p>
                    <div className="flex flex-wrap gap-2 mb-2">
                      {(node.requiredNodes || []).map((reqId, rIdx) => {
                        const reqNode = formData.nodes.find(n => n.id === reqId);
                        return (
                          <span key={rIdx} className="bg-indigo-600/30 text-indigo-400 text-xs px-2 py-1 rounded flex items-center gap-1 border border-indigo-500/30">
                            {reqNode ? reqNode.title : 'Unknown Quest'} 
                            {!isReadOnly && <button onClick={() => updateNode(idx, 'requiredNodes', node.requiredNodes.filter((_, i) => i !== rIdx))} className="hover:text-red-400 ml-1">×</button>}
                          </span>
                        );
                      })}
                    </div>
                    {!isReadOnly && (
                      <select 
                        onChange={(e) => {
                          const val = e.target.value;
                          if (val && !(node.requiredNodes || []).includes(val)) {
                            updateNode(idx, 'requiredNodes', [...(node.requiredNodes || []), val]);
                          }
                          e.target.value = '';
                        }}
                        className="w-full bg-slate-900 border border-indigo-800/50 rounded p-2 text-white text-sm focus:outline-none focus:border-indigo-500"
                      >
                        <option value="">+ Select a prerequisite quest...</option>
                        {formData.nodes.filter(n => n.id !== node.id && !(node.requiredNodes || []).includes(n.id)).map(n => (
                          <option key={n.id} value={n.id}>{n.title}</option>
                        ))}
                      </select>
                    )}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                    {/* Prerequisite Items */}
                    <div className="p-3 bg-blue-900/20 border border-blue-800/50 rounded-lg">
                      <label className="block text-xs font-semibold text-blue-400 uppercase mb-1 flex items-center gap-1"><Lock className="w-3 h-3"/> Prerequisite Items (Backtracking mechanic)</label>
                      <div className="flex flex-wrap gap-2 mb-2">
                        {(node.requiredItems || []).map((req, rIdx) => (
                          <span key={rIdx} className="bg-blue-600/30 text-blue-400 text-xs px-2 py-1 rounded flex items-center gap-1 border border-blue-500/30">
                            {req} 
                            {!isReadOnly && <button onClick={() => updateNode(idx, 'requiredItems', (node.requiredItems || []).filter((_, i) => i !== rIdx))} className="hover:text-red-400 ml-1">×</button>}
                          </span>
                        ))}
                      </div>
                      {!isReadOnly && (
                        <select 
                          onChange={(e) => {
                            if (e.target.value && !(node.requiredItems || []).includes(e.target.value)) {
                              updateNode(idx, 'requiredItems', [...(node.requiredItems || []), e.target.value]);
                            }
                            e.target.value = '';
                          }}
                          className="w-full bg-slate-900 border border-blue-800/50 rounded p-2 text-white text-sm focus:outline-none focus:border-blue-500"
                        >
                          <option value="">+ Add prerequisite item...</option>
                          {availableItems.filter(item => 
                            item && 
                            item !== node.rewardItem && 
                            !(node.rewardItems || []).includes(item) &&

                      <input disabled={isReadOnly} type="text" value={node.requiredPassword || ''} onChange={(e) => updateNode(idx, 'requiredPassword', e.target.value)} className={`w-full bg-slate-900 border border-purple-800/50 rounded p-2 text-white text-sm ${!isReadOnly && 'focus:outline-none focus:border-purple-500'}`} placeholder="Leave blank for no password barrier" />
                      <p className="text-[10px] text-purple-400/80 mt-1">Students will see the "Before Access" screen and must enter this password to reveal the "Inside" content.</p>
                    </div>
                  </div>

                  {/* After Access State */}
                  <div className="mb-4 p-4 bg-slate-900/40 rounded-xl border border-slate-700/50">
                    <h4 className="text-sm font-bold text-emerald-400 mb-3 flex items-center gap-2"><Unlock className="w-4 h-4"/> After Access (Inside the Quest)</h4>
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1 flex items-center gap-1"><ImageIcon className="w-3 h-3"/> Inside Illustration Image URL (Optional)</label>
                    <div className="flex gap-3 mb-3">
                      {node.imageUrl && <img src={node.imageUrl} alt="Preview" className="w-10 h-10 object-cover rounded border border-slate-700 shrink-0" />}
                      <input disabled={isReadOnly} type="text" value={node.imageUrl || ''} onChange={(e) => updateNode(idx, 'imageUrl', e.target.value)} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white ${!isReadOnly && 'focus:outline-none focus:border-emerald-500'}`} placeholder="https://example.com/inside-room.jpg" />

                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Inside Story / Instructions</label>
                    <textarea disabled={isReadOnly} value={node.story} onChange={(e) => updateNode(idx, 'story', e.target.value)} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white h-10 ${!isReadOnly && 'focus:outline-none focus:border-emerald-500'}`} placeholder="You step into the room..." />

                  <div className="mb-4">

                      <>

                        {(() => {
                          const tasks = node.tasks || [{ imageUrl: '', description: '', link: node.link || '', passcode: node.passcode || '' }];

                            <div key={tIdx} className="flex flex-col gap-3 mb-3 bg-slate-900/50 p-4 rounded-lg border border-slate-700/50 relative">

                                {!isReadOnly && tasks.length > 1 && (
                                  <button onClick={() => removeTask(idx, tIdx)} className="text-slate-500 hover:text-red-400 transition-colors">

                              <div>
                                <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1 flex items-center gap-1"><ImageIcon className="w-3 h-3"/> Illustration Image URL (Optional)</label>

                              </div>
                              <div>
                                <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1">Plot / Instructions (Optional)</label>
                                <textarea disabled={isReadOnly} value={task.description || ''} onChange={(e) => updateTask(idx, tIdx, 'description', e.target.value)} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm h-10 ${!isReadOnly && 'focus:outline-none focus:border-emerald-500'}`} placeholder="Introduce the specific story for this exercise..." />
                              </div>
                              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                  <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1 flex items-center gap-1"><BookOpen className="w-3 h-3"/> Exercise Link</label>
                                  <input disabled={isReadOnly} type="text" value={task.link} onChange={(e) => updateTask(idx, tIdx, 'link', e.target.value)} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm ${!isReadOnly && 'focus:outline-none focus:border-emerald-500'}`} placeholder="https://link-to-exercise..." />
                                </div>
                                <div>
                                  <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1 flex items-center gap-1"><Key className="w-3 h-3"/> 6-Digit Passcode</label>
                                  <input disabled={isReadOnly} type="text" value={task.passcode} onChange={(e) => updateTask(idx, tIdx, 'passcode', e.target.value)} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono text-sm ${!isReadOnly && 'focus:outline-none focus:border-emerald-500'}`} placeholder="123456" maxLength={6} />

                            </div>

                    ) : (
                      <div className="bg-slate-900/40 p-4 rounded-xl border border-slate-700">
                        <label className="block text-xs font-semibold text-emerald-400 uppercase mb-2 flex items-center gap-2">
                          <Box className="w-4 h-4"/> Escape Room Objects
                        </label>
                        <p className="text-xs text-slate-400 mb-4">Create objects for students to investigate. Mark one as the Final Objective.</p>
                        
                        {(node.objects || []).map((obj, oIdx) => (
                          <div key={obj.id} className="bg-slate-800 p-4 rounded-lg border border-slate-600 mb-4 relative">
                            {!isReadOnly && (
                              <button onClick={() => removeObject(idx, oIdx)} className="absolute top-3 right-3 text-slate-500 hover:text-red-400">
                                <Trash2 className="w-4 h-4" />
                              </button>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3 pr-8">
                              <div>
                                <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1">Object Name</label>

                              </div>
                              <div>
                                <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1 flex items-center gap-1"><Lock className="w-3 h-3"/> Requires Item To Inspect</label>
                                <select disabled={isReadOnly} value={obj.requiresItem || ''} onChange={(e) => updateObject(idx, oIdx, 'requiresItem', e.target.value)} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm ${!isReadOnly && 'focus:outline-none focus:border-emerald-500'}`}>
                                  <option value="">(None)</option>
                                  {availableItems.map((item, i) => <option key={i} value={item}>{item}</option>)}
                                </select>
                              </div>
                            </div>
                            <div className="mb-3">
                              <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1">Description / Clue</label>
                              <textarea disabled={isReadOnly} value={obj.description} onChange={(e) => updateObject(idx, oIdx, 'description', e.target.value)} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm h-10 ${!isReadOnly && 'focus:outline-none focus:border-emerald-500'}`} placeholder="It has a 6-digit number pad..." />
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
                              <div>
                                <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1 flex items-center gap-1"><BookOpen className="w-3 h-3"/> Exercise Link</label>
                                <input disabled={isReadOnly} type="text" value={obj.link || ''} onChange={(e) => updateObject(idx, oIdx, 'link', e.target.value)} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-sm ${!isReadOnly && 'focus:outline-none focus:border-emerald-500'}`} placeholder="https://link-to-exercise..." />
                              </div>
                              <div>
                                <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1 flex items-center gap-1"><Key className="w-3 h-3"/> Passcode to solve</label>
                                <input disabled={isReadOnly} type="text" value={obj.passcode || ''} onChange={(e) => updateObject(idx, oIdx, 'passcode', e.target.value)} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono text-sm ${!isReadOnly && 'focus:outline-none focus:border-emerald-500'}`} placeholder="Leave blank if none" />
                              </div>
                            </div>
                            <div className="flex flex-col md:flex-row gap-4 items-center justify-between border-t border-slate-700 pt-3 mt-3">
                              <div className="flex-1 w-full">
                                <label className="block text-[10px] font-semibold text-emerald-400 uppercase mb-1 flex items-center gap-1"><Award className="w-3 h-3"/> Rewards Found Inside</label>
                                <div className="flex flex-wrap gap-1 mb-1">
                                  {(obj.rewardItems || []).map((rw, rIdx) => (
                                    <span key={rIdx} className="bg-emerald-900/50 text-emerald-400 text-[10px] px-2 py-0.5 rounded border border-emerald-700/50 flex items-center gap-1">
                                      {rw} {!isReadOnly && <button onClick={() => updateObject(idx, oIdx, 'rewardItems', obj.rewardItems.filter((_, i) => i !== rIdx))} className="hover:text-red-400 ml-1">×</button>}
                                    </span>
                                  ))}
                                </div>
                                {!isReadOnly && (
                                  <select 
                                    onChange={(e) => {
                                      const val = e.target.value;
                                      if (val && !(obj.rewardItems || []).includes(val)) {
                                        updateObject(idx, oIdx, 'rewardItems', [...(obj.rewardItems || []), val]);
                                      }
                                      e.target.value = '';
                                    }}
                                    className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-white text-xs focus:outline-none focus:border-emerald-500"
                                  >
                                    <option value="">+ Select item inside...</option>
                                    {availableItems.filter(item => !(obj.rewardItems || []).includes(item)).map((item, i) => (
                                      <option key={i} value={item}>{item}</option>
                                    ))}
                                  </select>
                                )}
                              </div>
                              <label className={`flex items-center gap-2 bg-slate-900/50 p-2 rounded border border-slate-700 w-full md:w-auto mt-2 md:mt-0 ${isReadOnly ? 'cursor-default' : 'cursor-pointer'}`}>
                                <input disabled={isReadOnly} type="checkbox" checked={obj.isFinal || false} onChange={(e) => updateObject(idx, oIdx, 'isFinal', e.target.checked)} className="w-4 h-4 rounded border-slate-600 text-emerald-500 focus:ring-emerald-500 bg-slate-800" />
                                <span className="text-xs font-bold text-amber-400">Final Objective</span>
                              </label>
                            </div>
                          </div>
                        ))}
                        {!isReadOnly && (
                          <button onClick={() => addObject(idx)} className="mt-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white text-xs rounded flex items-center gap-1 font-semibold transition-colors">
                            <Plus className="w-3 h-3" /> Add Object
                          </button>
                        )}
                      </div>
                    )}
                  </div>

                  {/* After Completion State */}
                  <div className="mb-4 p-4 bg-slate-900/40 rounded-xl border border-slate-700/50">
                    <h4 className="text-sm font-bold text-blue-400 mb-3 flex items-center gap-2"><CheckCircle className="w-4 h-4"/> After Completion (Quest Cleared)</h4>
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1 flex items-center gap-1"><ImageIcon className="w-3 h-3"/> Completed Illustration Image URL (Optional)</label>
                    <div className="flex gap-3 mb-3">
                      {node.completedImageUrl && <img src={node.completedImageUrl} alt="Preview" className="w-10 h-10 object-cover rounded border border-slate-700 shrink-0" />}
                      <input disabled={isReadOnly} type="text" value={node.completedImageUrl || ''} onChange={(e) => updateNode(idx, 'completedImageUrl', e.target.value)} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white ${!isReadOnly && 'focus:outline-none focus:border-emerald-500'}`} placeholder="https://example.com/cleared-room.jpg" />
                    </div>
                    
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Completed Story / Epilogue</label>
                    <textarea disabled={isReadOnly} value={node.completedStory || ''} onChange={(e) => updateNode(idx, 'completedStory', e.target.value)} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white h-10 ${!isReadOnly && 'focus:outline-none focus:border-emerald-500'}`} placeholder="With the puzzle solved, the path forward is clear..." />
                  </div>

                  {/* Reward Items */}
                  <div className="p-4 bg-emerald-900/20 border border-emerald-800/50 rounded-lg mb-2">
                    <label className="block text-xs font-semibold text-emerald-400 uppercase mb-1 flex items-center gap-1"><Award className="w-3 h-3"/> Reward Items (Grants access)</label>
                    <div className="flex flex-wrap gap-2 mb-2">
                      {node.rewardItem && (
                        <span className="bg-emerald-600/30 text-emerald-400 text-xs px-2 py-1 rounded flex items-center gap-1 border border-emerald-500/30">
                          {node.rewardItem}
                          {!isReadOnly && <button onClick={() => updateNode(idx, 'rewardItem', '')} className="hover:text-red-400 ml-1">×</button>}
                        </span>
                      )}
                      {(node.rewardItems || []).map((rw, rIdx) => (
                        <span key={rIdx} className="bg-emerald-600/30 text-emerald-400 text-xs px-2 py-1 rounded flex items-center gap-1 border border-emerald-500/30">
                          {rw} 
                          {!isReadOnly && <button onClick={() => updateNode(idx, 'rewardItems', node.rewardItems.filter((_, i) => i !== rIdx))} className="hover:text-red-400 ml-1">×</button>}
                        </span>
                      ))}
                    </div>
                    {!isReadOnly && (
                      <select 
                        onChange={(e) => {
                          const val = e.target.value;
                          if (val && !(node.rewardItems || []).includes(val) && node.rewardItem !== val) {
                            updateNode(idx, 'rewardItems', [...(node.rewardItems || []), val]);
                          }
                          e.target.value = '';
                        }}
                        className="w-full bg-slate-900 border border-emerald-800/50 rounded p-2 text-white text-sm focus:outline-none focus:border-emerald-500"
                      >
                        <option value="">+ Select a reward item...</option>
                        {availableItems.filter(item => item !== node.rewardItem && !(node.rewardItems || []).includes(item)).map((item, i) => (
                          <option key={i} value={item}>{item}</option>
                        ))}
                      </select>
                    )}
                  </div>
                </div>
              ))
            )}
            
            {!isReadOnly && (
              <button 
                onClick={addNode} 
                className="w-full py-4 border-2 border-dashed border-slate-600 hover:border-emerald-500 hover:bg-slate-800/50 text-slate-400 hover:text-emerald-400 rounded-xl flex items-center justify-center gap-2 font-bold transition-all mt-4"
              >
                <Plus className="w-5 h-5" /> Add New Quest / Stage
              </button>
            )}
          </div>

          {showAIFineTune && (
            <AIFineTuneModal 
              geminiApiKey={geminiApiKey}
              currentData={formData}
              onClose={() => setShowAIFineTune(false)}
              onApply={(newData) => {
                setFormData(newData);
                setShowAIFineTune(false);
              }}
            />
          )}
        </div>
      );
    }

    // ==========================================
    // STUDENT DASHBOARD
    // ==========================================
    function StudentDashboard({ student, games, groups, teachers, allProgress, setActiveTheme, setPlayingTeacherName }) {
      const { t } = useContext(LanguageContext);
      const [selectedGroup, setSelectedGroup] = useState(null);
      const [selectedGame, setSelectedGame] = useState(null);

      const [showEditName, setShowEditName] = useState(false);
      const [newName, setNewName] = useState('');
      const [editNameError, setEditNameError] = useState('');

      const [showChangePassword, setShowChangePassword] = useState(false);
      const [pwData, setPwData] = useState({ current: '', newPw: '', confirm: '' });
      const [pwError, setPwError] = useState('');
      const [pwSuccess, setPwSuccess] = useState('');

      const handleNameSave = async () => {
        if (!newName.trim()) {
          setEditNameError("Name cannot be empty.");
          return;
        }
        try {
          const studentRef = doc(db, STUDENTS_PATH, student.id);
          await setDoc(studentRef, { name: newName.trim() }, { merge: true });
          
          const user = auth.currentUser;
          if (user) {
            const sessionRef = doc(db, `artifacts/${appId}/users/${user.uid}/profile`, 'session');
            await setDoc(sessionRef, { student: { ...student, name: newName.trim() } }, { merge: true });
          }
          
          setShowEditName(false);
        } catch (err) {
          setEditNameError("Failed to update name.");
        }
      };

      const handleChangePassword = async () => {
        setPwError('');
        if (!pwData.current || !pwData.newPw || !pwData.confirm) {
          setPwError("All fields are required."); return;
        }
        if (pwData.newPw !== pwData.confirm) {
          setPwError("New passwords do not match."); return;
        }
        if (pwData.newPw.length < 4) {
          setPwError("Password must be at least 4 characters long."); return;
        }

        try {
          const expectedHash = student.passwordHash || await hashPassword(student.id);
          const currentInputHash = await hashPassword(pwData.current);
          
          if (currentInputHash !== expectedHash) {
            setPwError("Current password is incorrect."); return;
          }

          const newHash = await hashPassword(pwData.newPw);
          await setDoc(doc(db, STUDENTS_PATH, student.id), { passwordHash: newHash }, { merge: true });
          
          setPwSuccess("Password successfully updated!");
          setTimeout(() => {
            setShowChangePassword(false);
            setPwSuccess('');
            setPwData({ current: '', newPw: '', confirm: '' });
          }, 2000);
        } catch (err) {
          setPwError("Failed to change password. Try again.");
        }
      };

      useEffect(() => {
        if (selectedGame) {
          if (selectedGame.themeColor) {
            setActiveTheme(selectedGame.themeColor);
          } else {
            setActiveTheme('slate');
          }
          const gameTeacher = teachers?.find(t => t.id === selectedGame.teacherId);
          setPlayingTeacherName(gameTeacher ? gameTeacher.name : '');
        } else if (selectedGroup) {
          setActiveTheme('slate');
          if (selectedGroup.id === 'guest_group') {
            setPlayingTeacherName(''); // Hide teacher name for Guest Lounge
          } else {
            const groupTeacher = teachers?.find(t => t.id === selectedGroup.teacherId);
            setPlayingTeacherName(groupTeacher ? groupTeacher.name : '');
          }
        } else {
          setActiveTheme('slate');
          setPlayingTeacherName('');
        }
      }, [selectedGame, selectedGroup, setActiveTheme, teachers, setPlayingTeacherName]);

      const userProgressData = allProgress.find(p => p.id === student.id);

      if (selectedGame) {
        return (
          <GamePlayer 
            game={selectedGame} 
            student={student} 
            userProgress={userProgressData?.progress?.[selectedGame.id] || { completedNodes: [], inventory: [], nodeProgress: {}, unlockedNodes: [], unlockedObjects: [] }} 
            onBack={() => setSelectedGame(null)} 
          />
        );
      }

      if (selectedGroup) {
        const groupGames = games.filter(g => selectedGroup.chapters?.includes(g.id));
        return (
          <div className="space-y-8">
            <button onClick={() => setSelectedGroup(null)} className="text-slate-400 hover:text-white flex items-center gap-2 transition-colors self-start bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
              <ChevronLeft className="w-5 h-5" /> {t('Back to Classrooms')}
            </button>

            <div className="bg-gradient-to-r from-slate-800 to-slate-900 rounded-2xl p-8 border border-slate-700 shadow-lg relative overflow-hidden">
              <div className="absolute right-0 top-0 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl"></div>
              <h2 className="text-3xl font-extrabold text-white mb-2 relative z-10">{selectedGroup.title} - {t('Chapters')}</h2>
              <p className="text-slate-400 relative z-10">Select a chapter below to continue your learning journey.</p>
            </div>

            {groupGames.length === 0 ? (
              <div className="text-center p-12 text-slate-500 bg-slate-800/50 rounded-xl border border-slate-700 border-dashed">
                Your teacher hasn't assigned any chapters to this group yet.
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {groupGames.map(game => {
                  const prog = userProgressData?.progress?.[game.id];
                  const completedCount = prog?.completedNodes?.length || 0;
                  const totalCount = game.nodes?.length || 0;
                  
                  const finalNodes = game.nodes?.filter(n => n.isFinalNode) || [];
                  const isComplete = finalNodes.length > 0 
                    ? finalNodes.every(n => prog?.completedNodes?.includes(n.id))
                    : (totalCount > 0 && completedCount === totalCount);

                  const gameTeacher = teachers?.find(t => t.id === game.teacherId);

                  return (
                    <div key={game.id} onClick={() => setSelectedGame(game)} className="bg-slate-800 rounded-2xl p-6 border border-slate-700 hover:border-emerald-500/50 hover:shadow-lg hover:-translate-y-1 cursor-pointer transition-all group flex flex-col">
                      {game.chapterImageUrl && (
                        <div className="w-full h-40 mb-4 rounded-xl overflow-hidden shrink-0 border border-slate-700 shadow-inner">
                           <img src={game.chapterImageUrl} alt="Chapter Illustration" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                        </div>
                      )}
                      <div className="flex justify-between items-start mb-4">
                        <div className={`p-3 rounded-xl ${isComplete ? 'bg-emerald-500/20 text-emerald-400' : 'bg-blue-500/20 text-blue-400'}`}>
                          {isComplete ? <Award className="w-6 h-6" /> : <MapIcon className="w-6 h-6" />}
                        </div>
                        <div className="flex flex-col items-end gap-1">
                          {isComplete && (
                            <span className="text-[10px] font-bold bg-emerald-900/50 text-emerald-400 px-2 py-1 rounded border border-emerald-700/50 uppercase tracking-wider flex items-center gap-1 shadow-sm">
                              <CheckCircle className="w-3 h-3" /> {t('Chapter Completed')}
                            </span>
                          )}
                          <span className={`text-xs font-bold px-2 py-1 rounded-full border ${isComplete ? 'bg-emerald-900/30 text-emerald-400 border-emerald-800/50' : 'bg-slate-900 text-slate-300 border-slate-700'}`}>
                            {completedCount} / {totalCount}
                          </span>
                        </div>
                      </div>
                      <h3 className="text-xl font-bold text-white mb-1 group-hover:text-emerald-400 transition-colors">{game.title}</h3>
                      <p className="text-xs text-emerald-400/90 font-semibold mb-3 flex items-center gap-1.5">
                        <User className="w-3 h-3 opacity-80" />
                        {gameTeacher ? gameTeacher.name : 'Unknown Teacher'}
                      </p>
                      <p className="text-slate-400 text-sm mb-6 line-clamp-2">{game.description}</p>
                      
                      <div className="mt-auto w-full bg-slate-900 rounded-full h-1.5 overflow-hidden">
                        <div className={`h-full rounded-full transition-all duration-1000 ${isComplete ? 'bg-emerald-500' : 'bg-blue-500'}`} style={{ width: `${totalCount > 0 ? (completedCount/totalCount)*100 : 0}%` }}></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      }

      // Main Group View
      let studentGroups = groups.filter(g => g.students?.includes(student.id));

      if (student.isGuest) {
        const guestGroup = groups.find(g => g.id === 'guest_group');
        if (guestGroup) {
          studentGroups = [guestGroup];
        } else {
          studentGroups = [{
            id: 'guest_group',
            title: 'Guest Lounge',
            description: 'Welcome to the Guest Lounge! Your teacher has not assigned any chapters here yet.',
            chapters: [],
            imageUrl: 'https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&q=80&w=800'
          }];
        }
      }

      return (
        <div className="space-y-8">
          <div className="bg-gradient-to-r from-slate-800 to-slate-900 rounded-2xl p-8 border border-slate-700 shadow-lg relative overflow-hidden flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div className="absolute right-0 top-0 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl"></div>
            <div className="relative z-10">
              <h2 className="text-3xl font-extrabold text-white mb-2">{t('Your Classrooms')}</h2>
              <p className="text-slate-400">{t('Select a class group below to view your assigned chapters.')}</p>
            </div>
            <div className="flex gap-3 relative z-10 flex-wrap">
              {student.isGuest ? (
                <button onClick={() => { setNewName(student.name); setShowEditName(true); }} className="bg-slate-800/80 backdrop-blur-sm hover:bg-slate-700 text-white px-4 py-2 rounded-xl border border-slate-600 flex items-center gap-2 transition-colors shadow-sm whitespace-nowrap">
                  <Edit3 className="w-4 h-4" /> {t('Change Name')}
                </button>
              ) : (
                <button onClick={() => { setShowChangePassword(true); setPwError(''); setPwSuccess(''); setPwData({ current: '', newPw: '', confirm: '' }); }} className="bg-slate-800/80 backdrop-blur-sm hover:bg-slate-700 text-white px-4 py-2 rounded-xl border border-slate-600 flex items-center gap-2 transition-colors shadow-sm whitespace-nowrap">
                  <Key className="w-4 h-4" /> {t('Change Password')}
                </button>
              )}
            </div>
          </div>

          {/* Edit Name Modal (Guest) */}
          {showEditName && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/90 backdrop-blur-sm p-4" onClick={() => setShowEditName(false)}>
              <div className="bg-slate-800 rounded-2xl border border-slate-600 shadow-2xl max-w-sm w-full p-6 animate-in fade-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                <h3 className="text-2xl font-bold text-white mb-4 border-b border-slate-700 pb-2">Change Guest Name</h3>
                <div className="mb-6">
                  <label className="block text-xs font-semibold text-slate-400 uppercase mb-2">Display Name</label>
                  <input 
                    type="text" 
                    value={newName} 
                    onChange={(e) => { setNewName(e.target.value); setEditNameError(''); }} 
                    onKeyDown={(e) => e.key === 'Enter' && handleNameSave()}
                    className="w-full bg-slate-900 border border-slate-600 focus:border-emerald-500 rounded-lg p-3 text-white transition-colors outline-none" 
                    placeholder="Your Name" 
                    autoFocus
                  />
                  {editNameError && <p className="text-red-400 text-xs font-medium mt-2">{editNameError}</p>}
                </div>
                <div className="flex gap-3">
                  <button onClick={() => setShowEditName(false)} className="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-colors">
                    Cancel
                  </button>
                  <button onClick={handleNameSave} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition-colors shadow-lg">
                    Save
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Change Password Modal */}
          {showChangePassword && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/90 backdrop-blur-sm p-4" onClick={() => setShowChangePassword(false)}>
              <div className="bg-slate-800 rounded-2xl border border-slate-600 shadow-2xl max-w-sm w-full p-6 animate-in fade-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                <h3 className="text-2xl font-bold text-white mb-4 border-b border-slate-700 pb-2">Change Password</h3>
                <div className="space-y-4 mb-6">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Current Password</label>
                    <input 
                      type="password" 
                      value={pwData.current} 
                      onChange={(e) => { setPwData({...pwData, current: e.target.value}); setPwError(''); }} 
                      className="w-full bg-slate-900 border border-slate-600 focus:border-emerald-500 rounded-lg p-3 text-white transition-colors outline-none" 
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">New Password</label>
                    <input 
                      type="password" 
                      value={pwData.newPw} 
                      onChange={(e) => { setPwData({...pwData, newPw: e.target.value}); setPwError(''); }} 
                      className="w-full bg-slate-900 border border-slate-600 focus:border-emerald-500 rounded-lg p-3 text-white transition-colors outline-none" 
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Confirm New Password</label>
                    <input 
                      type="password" 
                      value={pwData.confirm} 
                      onChange={(e) => { setPwData({...pwData, confirm: e.target.value}); setPwError(''); }} 
                      onKeyDown={(e) => e.key === 'Enter' && handleChangePassword()}
                      className="w-full bg-slate-900 border border-slate-600 focus:border-emerald-500 rounded-lg p-3 text-white transition-colors outline-none" 
                    />
                  </div>
                  {pwError && <p className="text-red-400 text-xs font-medium mt-2 flex items-center gap-1"><AlertTriangle className="w-3 h-3"/> {pwError}</p>}
                  {pwSuccess && <p className="text-emerald-400 text-sm font-bold mt-2 flex items-center gap-1"><CheckCircle className="w-4 h-4"/> {pwSuccess}</p>}
                </div>
                <div className="flex gap-3">
                  <button onClick={() => setShowChangePassword(false)} className="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-colors">
                    Cancel
                  </button>
                  <button onClick={handleChangePassword} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition-colors shadow-lg">
                    Update
                  </button>
                </div>
              </div>
            </div>
          )}

          {studentGroups.length === 0 ? (
            <div className="text-center p-12 text-slate-500 bg-slate-800/50 rounded-xl border border-slate-700 border-dashed">
              You are not currently enrolled in any groups. Please ask your teacher for access.
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {studentGroups.map(group => (
                <div key={group.id} onClick={() => setSelectedGroup(group)} className="bg-slate-800 rounded-2xl p-6 border border-slate-700 hover:border-blue-500/50 hover:shadow-xl hover:-translate-y-1 cursor-pointer transition-all group/card flex flex-col relative overflow-hidden">
                  <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-50 z-0"></div>
                  {group.imageUrl && (
                    <div className="absolute inset-0 z-0 opacity-20 group-hover/card:opacity-30 transition-opacity">
                       <img src={group.imageUrl} alt="" className="w-full h-full object-cover" />
                    </div>
                  )}
                  <div className="relative z-10">
                    <div className="flex justify-between items-start mb-6">
                      <div className="p-3 rounded-xl bg-blue-500/20 text-blue-400 shadow-inner backdrop-blur-sm">
                        <Library className="w-8 h-8" />
                      </div>
                    </div>
                    <h3 className="text-2xl font-bold text-white mb-1 group-hover/card:text-blue-400 transition-colors drop-shadow-md">{group.title}</h3>
                    {!group.isSystem && (
                      <p className="text-sm text-blue-400/90 font-semibold mb-3 drop-shadow-md flex items-center gap-1.5">
                        <User className="w-3.5 h-3.5 opacity-70" />
                        {teachers?.find(t => t.id === group.teacherId)?.name || 'Unknown Teacher'}
                      </p>
                    )}
                    <p className="text-slate-300 text-sm mb-6 line-clamp-2 drop-shadow-md">{group.description}</p>
                  </div>
                  <div className="mt-auto relative z-10 flex justify-between items-center border-t border-slate-700/50 pt-4">
                    <span className="text-xs font-bold text-blue-400 bg-blue-900/40 px-3 py-1.5 rounded-full border border-blue-800/50 flex items-center gap-2 backdrop-blur-sm">
                      <Layers className="w-4 h-4"/> {(group.chapters || []).length} {t('Chapters Assigned')}
                    </span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // GAME PLAYER (STUDENT ACTIVE VIEW)
    // ==========================================
    function GamePlayer({ game, student, userProgress, onBack }) {
      const { t } = useContext(LanguageContext);
      const [activeNode, setActiveNode] = useState(null);
      const [passcodeInput, setPasscodeInput] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [successAnim, setSuccessAnim] = useState(null);
      const [viewingItem, setViewingItem] = useState(null);
      const [activeEscapeObject, setActiveEscapeObject] = useState(null);
      
      const [showStoryModal, setShowStoryModal] = useState(false);
      
      const [areaPasscodeInput, setAreaPasscodeInput] = useState('');
      const [useItemSelection, setUseItemSelection] = useState([]);
      const [unlockError, setUnlockError] = useState('');

      // Combination States
      const [combineMode, setCombineMode] = useState(false);
      const [combineSelection, setCombineSelection] = useState([]);
      const [combineResult, setCombineResult] = useState(null);
      const [confirmRestart, setConfirmRestart] = useState(false);
      
      // Immersive Mode States
      const [isImmersive, setIsImmersive] = useState(false);
      const [showHud, setShowHud] = useState(false);

      const inventory = userProgress.inventory || [];
      const completedNodes = userProgress.completedNodes || [];
      const unlockedNodes = userProgress.unlockedNodes || [];
      const unlockedObjects = userProgress.unlockedObjects || [];
      
      const finalNodes = game.nodes?.filter(n => n.isFinalNode) || [];
      const isComplete = finalNodes.length > 0 
        ? finalNodes.every(n => completedNodes.includes(n.id))
        : (game.nodes?.length > 0 && completedNodes.length === game.nodes.length);

      const getNodeStatus = (node) => {
        if (completedNodes.includes(node.id)) return 'completed';
        
        // Hide completely if prerequisite quests are not met
        const hasRequiredQuests = (node.requiredNodes || []).every(reqId => completedNodes.includes(reqId));
        if (!hasRequiredQuests) return 'locked_quests';

        const needsItems = (node.requiredItems || []).length > 0;
        const needsPassword = !!node.requiredPassword;
        const isUnlocked = unlockedNodes.includes(node.id);

        if ((needsItems || needsPassword) && !isUnlocked) {
          return 'locked_action';
        }
        
        return 'available';
      };

      const handleAreaUnlockSubmit = async () => {
        setUnlockError('');
        
        const needsPassword = !!activeNode.requiredPassword;
        const needsItems = (activeNode.requiredItems || []).length > 0;
        
        let passwordCorrect = true;
        let itemsCorrect = true;

        if (needsPassword) {
          passwordCorrect = areaPasscodeInput.trim().toLowerCase() === activeNode.requiredPassword.toLowerCase();
        }

        if (needsItems) {
          const required = activeNode.requiredItems;
          itemsCorrect = required.length > 0 && required.length === useItemSelection.length && required.every(req => useItemSelection.includes(req));
        }

        if (passwordCorrect && itemsCorrect) {
          const progressRef = doc(db, PROGRESS_PATH, student.id);
          const newUnlockedNodes = [...unlockedNodes, activeNode.id];
          
          await setDoc(progressRef, {
            progress: {
              [game.id]: { ...userProgress, unlockedNodes: newUnlockedNodes }
            }
          }, { merge: true });
          
          setAreaPasscodeInput('');
          setUseItemSelection([]);
        } else {
          setUnlockError('Nothing happened. Your selection or password might be incorrect.');
        }
      };

      const handleQuestSubmit = async () => {
        setErrorMsg('');
        
        const tasks = activeNode.tasks || [{ link: activeNode.link, passcode: activeNode.passcode }];
        const currentTaskIndex = userProgress.nodeProgress?.[activeNode.id] || 0;
        const currentTask = tasks[currentTaskIndex];

        if (passcodeInput.trim() === currentTask.passcode) {
          const isFinalTask = currentTaskIndex + 1 === tasks.length;
          const progressRef = doc(db, PROGRESS_PATH, student.id);

          if (isFinalTask) {
            const newCompleted = [...completedNodes, activeNode.id];
            const newInventory = [...inventory];
            
            if (activeNode.rewardItem && !newInventory.includes(activeNode.rewardItem)) {
              newInventory.push(activeNode.rewardItem);
            }
            if (activeNode.rewardItems) {
              activeNode.rewardItems.forEach(item => {
                if (!newInventory.includes(item)) newInventory.push(item);
              });
            }

            const finalNodes = game.nodes?.filter(n => n.isFinalNode) || [];
            const wasComplete = finalNodes.length > 0 
              ? finalNodes.every(n => completedNodes.includes(n.id))
              : (game.nodes?.length > 0 && completedNodes.length === game.nodes.length);
            const isNowComplete = finalNodes.length > 0
              ? finalNodes.every(n => newCompleted.includes(n.id))
              : (game.nodes?.length > 0 && newCompleted.length === game.nodes.length);

            const hasEpilogue = activeNode.completedStory || activeNode.completedImageUrl;
            
            if (isNowComplete && !wasComplete) {
              setSuccessAnim(hasEpilogue ? 'game_cleared_epilogue' : 'game_cleared_rewards');
            } else {
              setSuccessAnim(hasEpilogue ? 'epilogue' : 'quest_rewards');
            }

            await setDoc(progressRef, {
              progress: {
                [game.id]: { ...userProgress, completedNodes: newCompleted, inventory: newInventory }
              }
            }, { merge: true });

          } else {
            setSuccessAnim('step');
            
            const newNodeProgress = { ...(userProgress.nodeProgress || {}) };
            newNodeProgress[activeNode.id] = currentTaskIndex + 1;

            await setDoc(progressRef, {
              progress: {
                [game.id]: { ...userProgress, nodeProgress: newNodeProgress }
              }
            }, { merge: true });

            setTimeout(() => {
              setSuccessAnim(null);
              setPasscodeInput('');
            }, 1500);
          }

        } else {
          setErrorMsg('Incorrect passcode. Complete the online exercise to get the correct code.');
        }
      };

      const handleEscapeObjectSubmit = async () => {
        setErrorMsg('');
        
        if (activeEscapeObject.passcode && passcodeInput.trim().toLowerCase() !== String(activeEscapeObject.passcode).trim().toLowerCase()) {
          setErrorMsg('Incorrect passcode or combination.');
          return;
        }

        const progressRef = doc(db, PROGRESS_PATH, student.id);
