        const currentProg = userProgress.nodeProgress?.[activeNode.id];
        const solvedObjects = (typeof currentProg === 'object' ? currentProg.solvedObjects : []) || [];
        const newSolvedObjects = [...solvedObjects, activeEscapeObject.id];

        let newInventory = [...inventory];
        if (activeEscapeObject.rewardItems) {
          activeEscapeObject.rewardItems.forEach(item => {
            if (!newInventory.includes(item)) newInventory.push(item);
          });
        }

        if (activeEscapeObject.isFinal) {
          const newCompleted = [...completedNodes, activeNode.id];
          
          if (activeNode.rewardItem && !newInventory.includes(activeNode.rewardItem)) newInventory.push(activeNode.rewardItem);
          if (activeNode.rewardItems) {
            activeNode.rewardItems.forEach(item => {
              if (!newInventory.includes(item)) newInventory.push(item);
            });
          }

          const finalNodes = game.nodes?.filter(n => n.isFinalNode) || [];
          const wasComplete = finalNodes.length > 0 
            ? finalNodes.every(n => completedNodes.includes(n.id))
            : (game.nodes?.length > 0 && completedNodes.length === game.nodes.length);
          const isNowComplete = finalNodes.length > 0
            ? finalNodes.every(n => newCompleted.includes(n.id))
            : (game.nodes?.length > 0 && newCompleted.length === game.nodes.length);

          const hasEpilogue = activeNode.completedStory || activeNode.completedImageUrl;

          if (isNowComplete && !wasComplete) {
            setSuccessAnim(hasEpilogue ? 'game_cleared_epilogue' : 'game_cleared_rewards');
          } else {
            setSuccessAnim(hasEpilogue ? 'epilogue' : 'quest_rewards');
          }

          await setDoc(progressRef, {
            progress: {
              [game.id]: { ...userProgress, completedNodes: newCompleted, inventory: newInventory }
            }
          }, { merge: true });

        } else {
          setSuccessAnim('step');
          
          const newNodeProgress = { ...(userProgress.nodeProgress || {}) };
          newNodeProgress[activeNode.id] = { solvedObjects: newSolvedObjects };

          await setDoc(progressRef, {
            progress: {
              [game.id]: { ...userProgress, nodeProgress: newNodeProgress, inventory: newInventory }
            }
          }, { merge: true });

          setTimeout(() => {
            setSuccessAnim(null);
            setActiveEscapeObject(null);
            setPasscodeInput('');
          }, 1500);
        }
      };

      const toggleCombineSelection = (item) => {
        if (combineSelection.includes(item)) {
          setCombineSelection(combineSelection.filter(i => i !== item));
        } else {
          setCombineSelection([...combineSelection, item]);
        }
      };

      const attemptCombine = async () => {
        const recipe = (game.recipes || []).find(r => {
          const sortedRecipe = [...r.inputs].sort();
          const sortedSelection = [...combineSelection].sort();
          return sortedRecipe.length === sortedSelection.length &&
                 sortedRecipe.every((val, index) => val === sortedSelection[index]);
        });

        if (recipe) {
          // Remove consumed inputs and add output
          let newInventory = inventory.filter(i => !combineSelection.includes(i));
          if (!newInventory.includes(recipe.output)) {
            newInventory.push(recipe.output);
          }

          const progressRef = doc(db, PROGRESS_PATH, student.id);
          await setDoc(progressRef, {
            progress: {
              [game.id]: { ...userProgress, inventory: newInventory }
            }
          }, { merge: true });

          setCombineResult({ success: true, item: recipe.output });
        } else {
          setCombineResult({ success: false });
        }
        
        setCombineMode(false);
        setCombineSelection([]);
      };

      const tasks = activeNode?.tasks || [{ description: '', imageUrl: '', link: activeNode?.link, passcode: activeNode?.passcode }];
      const currentTaskIndex = typeof userProgress.nodeProgress?.[activeNode?.id] === 'number' ? userProgress.nodeProgress[activeNode.id] : 0;
      const currentTask = tasks[currentTaskIndex];
      const solvedEscapeObjects = typeof userProgress.nodeProgress?.[activeNode?.id] === 'object' ? (userProgress.nodeProgress[activeNode.id].solvedObjects || []) : [];

      // Determine active states for UI rendering
      const activeStatus = activeNode ? getNodeStatus(activeNode) : null;
      const isLockedView = activeStatus === 'locked_action';
      const displayImage = activeNode && isLockedView && activeNode.lockedImageUrl ? activeNode.lockedImageUrl : activeNode?.imageUrl;
      const displayStory = activeNode && isLockedView && activeNode.lockedStory ? activeNode.lockedStory : activeNode?.story;

      const btnBack = (
        <button onClick={onBack} className="text-slate-400 hover:text-white flex items-center gap-2 transition-colors self-start bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
          <ChevronLeft className="w-5 h-5" /> {t('Back to Chapters')}
        </button>
      );

      const btnStory = (
        <button onClick={() => setShowStoryModal(true)} className="w-full bg-slate-800 hover:bg-slate-700 text-indigo-400 border border-slate-700 hover:border-indigo-500/50 rounded-xl p-4 font-bold flex items-center justify-center gap-2 transition-all shadow-sm">
          <BookOpen className="w-5 h-5" /> {t('Chapter Story / Lore')}
        </button>
      );

      const btnReset = confirmRestart ? (
        <div className="bg-red-900/20 border border-red-800/50 rounded-xl p-4 text-center shadow-sm">
          <p className="text-sm text-red-400 mb-3 font-semibold">{t('Reset all progress for this chapter?')}</p>
          <div className="flex gap-2 justify-center">
            <button onClick={() => setConfirmRestart(false)} className="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-semibold transition-colors">{t('Cancel')}</button>
            <button onClick={async () => {
              const progressRef = doc(db, PROGRESS_PATH, student.id);
              await setDoc(progressRef, {
                progress: { [game.id]: { completedNodes: [], inventory: [], nodeProgress: {}, unlockedNodes: [], unlockedObjects: [] } }
              }, { merge: true });
              setConfirmRestart(false);
              setActiveNode(null);
              setPasscodeInput('');
              setAreaPasscodeInput('');
              setUseItemSelection([]);
              setCombineSelection([]);
              setCombineMode(false);
            }} className="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white rounded-lg text-sm font-semibold transition-colors flex items-center gap-1"><RotateCcw className="w-4 h-4"/> {t('Confirm')}</button>
          </div>
        </div>
      ) : (
        <button onClick={() => setConfirmRestart(true)} className="w-full bg-slate-800 hover:bg-slate-700 text-red-400/80 border border-slate-700 hover:border-red-500/50 rounded-xl p-3 font-bold flex items-center justify-center gap-2 transition-all shadow-sm text-sm">
          <RotateCcw className="w-4 h-4" /> {t('Reset Chapter')}
        </button>
      );

      const blockStats = (
        <div className={`bg-slate-800 rounded-2xl p-6 border shadow-lg relative overflow-hidden ${isComplete ? 'border-emerald-500/50 shadow-emerald-900/20' : 'border-slate-700'}`}>
          {isComplete && <div className="absolute top-0 left-0 w-full h-1 bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.8)]"></div>}
          <h3 className="text-lg font-bold text-white mb-4 border-b border-slate-700 pb-2 flex items-center justify-between">
            <span className="flex items-center gap-2">
              <Award className={`w-5 h-5 ${isComplete ? 'text-emerald-400' : 'text-amber-400'}`} /> {t('Stats')}
            </span>
            {isComplete && <span className="text-[10px] font-bold bg-emerald-900/50 text-emerald-400 px-2 py-1 rounded border border-emerald-700/50 uppercase tracking-wider animate-pulse">{t('Chapter Completed')}</span>}
          </h3>
          <div className="space-y-4">
            <div>
              <div className="text-sm text-slate-400 mb-1">{t('Exploration')}</div>
              <div className={`text-2xl font-black ${isComplete ? 'text-emerald-400' : 'text-white'}`}>
                {completedNodes.length} <span className="text-base font-normal text-slate-500">/ {game.nodes?.length || 0}</span>
              </div>
            </div>
            <div className="w-full bg-slate-900 rounded-full h-2">
              <div className={`h-2 rounded-full transition-all duration-1000 ${isComplete ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]' : 'bg-blue-500'}`} style={{ width: `${game.nodes?.length ? (completedNodes.length/game.nodes.length)*100 : 0}%` }}></div>
            </div>
          </div>
        </div>
      );

      const blockInventory = (
        <div className="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-lg flex-1 overflow-y-auto flex flex-col min-h-[300px]">
          <div className="flex justify-between items-center border-b border-slate-700 pb-2 mb-4">
            <h3 className="text-lg font-bold text-white flex items-center gap-2">
              <BookOpen className="w-5 h-5 text-blue-400" /> {t('Inventory')}
            </h3>
            {inventory.length > 1 && (
              <button 
                onClick={() => { setCombineMode(!combineMode); setCombineSelection([]); }}
                className={`px-3 py-1 rounded text-xs font-bold transition-colors ${combineMode ? 'bg-amber-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}
              >
                {combineMode ? t('Cancel') : t('Combine')}
              </button>
            )}
          </div>
          <p className="text-xs text-slate-400 mb-4">
            {combineMode ? t('Select items to combine.') : t('Click an item to inspect it.')}
          </p>
          
          {inventory.length === 0 ? (
            <p className="text-slate-500 text-sm text-center mt-8">{t('Empty. Complete nodes to find path keys.')}</p>
          ) : (
            <ul className="space-y-2 flex-1">
              {inventory.map((item, i) => {
                const isSelected = combineMode && combineSelection.includes(item);
                return (
                  <li 
                    key={i} 
                    onClick={() => {
                      if (combineMode) toggleCombineSelection(item);
                      else setViewingItem(item);
                    }}
                    className={`bg-slate-900/50 border p-3 rounded-lg flex items-center gap-3 shadow-sm cursor-pointer transition-all group
                      ${isSelected ? 'border-amber-400 bg-amber-900/20' : 'border-slate-700 hover:border-emerald-500/50 hover:bg-slate-800'}
                    `}
                  >
                    {game.itemImages?.[item] ? (
                      <img src={game.itemImages[item]} alt={item} className={`w-6 h-6 object-contain drop-shadow-md transition-transform ${isSelected ? 'scale-110' : 'group-hover:scale-110'}`} />
                    ) : (
                      <Key className={`w-4 h-4 transition-transform ${isSelected ? 'text-amber-400 scale-110' : 'text-slate-400 group-hover:scale-110'}`} />
                    )}
                    <span className={`text-sm font-medium transition-colors ${isSelected ? 'text-amber-400' : 'text-slate-200 group-hover:text-emerald-400'}`}>{item}</span>
                    {isSelected && <CheckCircle className="w-4 h-4 text-amber-400 ml-auto" />}
                  </li>
                );
              })}
            </ul>
          )}

          {combineMode && (
            <div className="mt-4 pt-4 border-t border-slate-700 sticky bottom-0 bg-slate-800 pb-2">
              <button 
                onClick={attemptCombine}
                disabled={combineSelection.length < 2}
                className="w-full bg-amber-600 disabled:bg-slate-700 disabled:text-slate-500 hover:bg-amber-500 text-white font-bold py-3 rounded-lg transition-colors shadow-lg flex justify-center items-center gap-2"
              >
                <Wrench className="w-4 h-4" /> {t('Combine')} ({combineSelection.length})
              </button>
            </div>
          )}
        </div>
      );

      const blockMap = (
        <div className={`w-full flex flex-col relative flex-1 transition-all duration-300 ${isImmersive ? 'h-full' : 'min-h-[500px]'}`}>
          {activeNode ? (
              <div className="absolute inset-0 z-30 bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                {successAnim === 'step' ? (
                  <div className="flex-1 flex flex-col items-center justify-center bg-blue-900/20">
                    <CheckCircle className="w-24 h-24 text-blue-400 mb-6 animate-bounce" />
                    <h2 className="text-3xl font-bold text-white mb-2">{t('Exercise Complete!')}</h2>
                    <p className="text-lg text-blue-400">{t('Proceeding to the next part of the quest...')}</p>
                  </div>
                ) : successAnim === 'epilogue' || successAnim === 'game_cleared_epilogue' ? (
                  <div className="flex-1 flex flex-col items-center justify-center bg-slate-900/90 text-center px-6 py-8 overflow-y-auto animate-in fade-in zoom-in-95">
                    <BookOpen className="w-16 h-16 text-emerald-400 mb-6" />
                    <h2 className="text-3xl font-bold text-white mb-6">{t('Area Cleared')}</h2>
                    {activeNode.completedImageUrl && (
                      <img src={activeNode.completedImageUrl} alt="Epilogue" className="max-w-md w-full max-h-64 object-cover rounded-xl border border-slate-700 shadow-lg mb-6" />
                    )}
                    {activeNode.completedStory && (
                      <p className="text-lg text-slate-300 leading-relaxed max-w-2xl mb-8 whitespace-pre-wrap">{activeNode.completedStory}</p>
                    )}
                    <button 
                      onClick={() => setSuccessAnim(successAnim === 'game_cleared_epilogue' ? 'game_cleared_rewards' : 'quest_rewards')}
                      className="mt-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-12 rounded-xl transition-all shadow-lg"
                    >
                      {t('Next')}
                    </button>
                  </div>
                ) : successAnim === 'game_cleared_rewards' ? (
                  <div className="flex-1 flex flex-col items-center justify-center bg-amber-900/20 text-center px-4 animate-in fade-in zoom-in-95">
                    <Award className="w-24 h-24 text-amber-400 mb-6 animate-bounce" />
                    <h2 className="text-4xl font-extrabold text-white mb-2">{t('Chapter Completed!')}</h2>
                    <p className="text-lg text-amber-400 mb-6">You have finished the main objectives of this chapter.</p>
                    {(activeNode.rewardItem || (activeNode.rewardItems && activeNode.rewardItems.length > 0)) && (
                      <div className="text-lg text-amber-400 flex flex-col items-center mt-4">
                        <span className="font-bold mb-2">{t('You obtained:')}</span>
                        <div className="flex flex-wrap justify-center gap-4">
                          {[...(activeNode.rewardItem ? [activeNode.rewardItem] : []), ...(activeNode.rewardItems || [])].map((item, i) => (
                             <div key={i} className="flex flex-col items-center bg-amber-800/50 px-4 py-3 rounded-xl border border-amber-600/50 shadow-lg min-w-[100px]">
                               {game.itemImages?.[item] ? (
                                 <img src={game.itemImages[item]} alt={item} className="w-12 h-12 object-contain mb-2 drop-shadow-md" />
                               ) : (
                                 <Award className="w-8 h-8 text-amber-400 mb-2" />
                               )}
                               <strong className="text-white text-sm text-center">{item}</strong>
                             </div>
                          ))}
                        </div>
                      </div>
                    )}
                    <button onClick={() => { setSuccessAnim(null); setActiveEscapeObject(null); setPasscodeInput(''); }} className="mt-8 bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-12 rounded-xl transition-all shadow-lg">
                      {t('Continue')}
                    </button>
                  </div>
                ) : successAnim === 'quest_rewards' ? (
                  <div className="flex-1 flex flex-col items-center justify-center bg-emerald-900/20 animate-in fade-in zoom-in-95">
                    <Unlock className="w-24 h-24 text-emerald-400 mb-6 animate-bounce" />
                    <h2 className="text-3xl font-bold text-white mb-2">{t('Quest Completed!')}</h2>
                    {(activeNode.rewardItem || (activeNode.rewardItems && activeNode.rewardItems.length > 0)) ? (
                      <div className="text-lg text-emerald-400 flex flex-col items-center">
                        <span>{t('You obtained:')}</span>
                        <div className="flex flex-wrap justify-center gap-4 mt-4">
                          {[...(activeNode.rewardItem ? [activeNode.rewardItem] : []), ...(activeNode.rewardItems || [])].map((item, i) => (
                             <div key={i} className="flex flex-col items-center bg-emerald-800/50 px-4 py-3 rounded-xl border border-emerald-600/50 shadow-lg min-w-[100px]">
                               {game.itemImages?.[item] ? (
                                 <img src={game.itemImages[item]} alt={item} className="w-12 h-12 object-contain mb-2 drop-shadow-md" />
                               ) : (
                                 <Award className="w-8 h-8 text-yellow-400 mb-2" />
                               )}
                               <strong className="text-white text-sm text-center">{item}</strong>
                             </div>
                          ))}
                        </div>
                      </div>
                    ) : (
                      <p className="text-emerald-400 text-lg mt-4">{t('No specific items found, but the path is now open.')}</p>
                    )}
                    <button onClick={() => { setSuccessAnim(null); setActiveEscapeObject(null); setPasscodeInput(''); }} className="mt-8 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-12 rounded-xl transition-all shadow-lg">
                      {t('Continue')}
                    </button>
                  </div>
                ) : activeEscapeObject ? (
                  (() => {
                    const isObjectSolved = solvedEscapeObjects.includes(activeEscapeObject.id);
                    return (
                      <>
                        <div className="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                          <div>
                            <button onClick={() => {setActiveEscapeObject(null); setPasscodeInput(''); setErrorMsg(''); setUseItemSelection([]); setUnlockError('');}} className="text-emerald-400 hover:text-emerald-300 text-sm font-bold flex items-center gap-1 mb-2">
                              ← Back to Room
                            </button>
                            <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                              <Search className="w-6 h-6 text-blue-400"/> {activeEscapeObject.name}
                            </h2>
                          </div>
                        </div>
                        
                        <div className="p-8 flex-1 overflow-y-auto space-y-6">
                          <div className="bg-slate-900 rounded-xl p-6 border border-slate-700 shadow-inner">
                            <p className="text-lg text-slate-300 leading-relaxed font-serif">{activeEscapeObject.description}</p>
                          </div>

                          {activeEscapeObject.requiresItem && !unlockedObjects.includes(activeEscapeObject.id) && !isObjectSolved ? (
                            <div className="bg-slate-900/80 border border-slate-700 rounded-xl p-6 text-center shadow-lg">
                              <Lock className="w-12 h-12 text-amber-500 mx-auto mb-4 opacity-80" />
                              <h3 className="text-xl font-bold text-white mb-2">{t('Object Locked')}</h3>
                              <p className="text-slate-400 mb-6">{t('Determine what is needed to interact with this object.')}</p>
                              
                              <div className="max-w-md mx-auto text-left bg-slate-900 p-4 rounded-xl border border-slate-700">
                                <label className="block text-sm font-bold text-slate-300 mb-3">{t('Use Item(s):')}</label>
                                <div className="flex flex-wrap gap-2 mb-4">
                                  {inventory.length === 0 ? (
                                    <span className="text-slate-500 text-sm italic">Your inventory is empty.</span>
                                  ) : (
                                    inventory.map((item, i) => {
                                      const isSelected = useItemSelection.includes(item);
                                      return (
                                        <button 
                                          key={i}
                                          onClick={() => setUseItemSelection(isSelected ? [] : [item])}
                                          className={`flex items-center gap-2 px-3 py-2 rounded-lg text-sm transition-all border ${isSelected ? 'bg-amber-600/20 border-amber-500 text-amber-400' : 'bg-slate-800 border-slate-600 text-slate-300 hover:border-slate-500'}`}
                                        >
                                          {game.itemImages?.[item] && <img src={game.itemImages[item]} alt={item} className="w-4 h-4 object-contain" />}
                                          {item}
                                        </button>
                                      )
                                    })
                                  )}
                                </div>
                                {unlockError && <p className="text-red-400 text-sm font-medium text-center mb-4">{t(unlockError)}</p>}
                                <button 
                                  onClick={async () => {
                                    setUnlockError('');
                                    if (useItemSelection[0] === activeEscapeObject.requiresItem) {
                                      const progressRef = doc(db, PROGRESS_PATH, student.id);
                                      const newUnlockedObjects = [...unlockedObjects, activeEscapeObject.id];
                                      await setDoc(progressRef, {
                                        progress: {
                                          [game.id]: { ...userProgress, unlockedObjects: newUnlockedObjects }
                                        }
                                      }, { merge: true });
                                      setUseItemSelection([]);
                                    } else {
                                      setUnlockError('Nothing happened. This item has no effect here.');
                                    }
                                  }} 
                                  className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg"
                                >
                                  {t('Attempt to Use')}
                                </button>
                              </div>
                            </div>
                          ) : (
                            <div className="space-y-6">
                              {activeEscapeObject.link && (
                                <div className="bg-slate-900 rounded-xl p-6 border border-slate-700 text-center shadow-md">
                                  <p className="text-slate-400 mb-4">{isObjectSolved ? 'Review the exercise clues.' : 'Investigate further to find clues (Complete Exercise).'}</p>
                                  <a href={activeEscapeObject.link} target="_blank" rel="noreferrer" className="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-bold transition-colors shadow-lg shadow-blue-900/20">
                                    {isObjectSolved ? 'Review Exercise' : 'Investigate'} <span className="text-xl">↗</span>
                                  </a>
                                </div>
                              )}

                              {!isObjectSolved ? (
                                <div className="max-w-xs mx-auto text-center space-y-4">
                                  {activeEscapeObject.passcode ? (
                                    <>
                                      <label className="block text-sm font-bold text-slate-400 uppercase tracking-widest">{t('Enter Code / Passcode')}</label>
                                      <input type="text" value={passcodeInput} onChange={(e) => setPasscodeInput(e.target.value)} className="w-full bg-slate-900 border-2 border-slate-600 focus:border-emerald-500 rounded-xl p-4 text-center text-xl font-mono text-white tracking-widest transition-colors outline-none" placeholder="Enter Passcode" />
                                      {errorMsg && <p className="text-red-400 text-sm font-medium">{t(errorMsg)}</p>}
                                      <button onClick={handleEscapeObjectSubmit} disabled={!passcodeInput.trim()} className="w-full bg-emerald-600 disabled:bg-slate-700 disabled:text-slate-500 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg">
                                        {t('Submit Code')}
                                      </button>
                                    </>
                                  ) : (
                                    <button onClick={handleEscapeObjectSubmit} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 mt-8">
                                      <Unlock className="w-5 h-5" /> {t('Open / Interact')}
                                    </button>
                                  )}
                                </div>
                              ) : (
                                <div className="bg-emerald-900/20 border border-emerald-800/50 rounded-xl p-4 text-center text-emerald-400 font-bold flex flex-col items-center">
                                  <CheckCircle className="w-8 h-8 mb-2" />
                                  This objective has been cleared.
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      </>
                    );
                  })()
                ) : (
                  <>
                    <div className="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                      <div>
                        <span className={`text-xs font-bold uppercase tracking-wider px-2 py-1 rounded-full mb-2 inline-flex items-center gap-1 ${activeNode.type === 'escape_room' ? 'bg-purple-500/20 text-purple-400' : activeNode.type === 'main' ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-700 text-slate-300'}`}>
                          {isLockedView && <Lock className="w-3 h-3" />}
                          {activeNode.type === 'escape_room' ? 'Escape Room' : activeNode.type + ' Node'}
                        </span>
                        <h2 className="text-2xl font-bold text-white">
                          {activeNode.title}
                          {!isLockedView && activeNode.type !== 'escape_room' && tasks.length > 1 && (
                            <span className="ml-3 text-sm font-normal text-slate-400 bg-slate-800 px-2 py-1 rounded-md border border-slate-700">
                              Part {currentTaskIndex + 1} of {tasks.length}
                            </span>
                          )}
                        </h2>
                      </div>
                      <button onClick={() => {setActiveNode(null); setErrorMsg(''); setPasscodeInput(''); setAreaPasscodeInput(''); setUnlockError(''); setUseItemSelection([]);}} className="text-slate-400 hover:text-white p-2">✕</button>
                    </div>
                    
                    <div className="p-8 flex-1 overflow-y-auto space-y-8 bg-slate-800/50">
                      {displayImage && (
                        <div className="w-full bg-slate-900 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
                          <img src={displayImage} alt="Quest Illustration" className="w-full max-h-80 object-cover" />
                        </div>
                      )}
                      
                      <div className="prose prose-invert max-w-none">
                        <p className="text-lg text-slate-300 leading-relaxed whitespace-pre-wrap">{displayStory || (isLockedView ? "This area is currently locked or requires a password." : "")}</p>
                      </div>

                      {/* INACCESSIBLE STATE VIEW (Missing Quests) */}
                      {activeStatus === 'locked_quests' && (
                        <div className="bg-slate-900/50 border border-slate-700 rounded-xl p-6 text-center shadow-lg">
                          <Lock className="w-12 h-12 text-slate-600 mx-auto mb-4" />
                          <h3 className="text-xl font-bold text-white mb-2">Inaccessible</h3>
                          <p className="text-slate-400 mb-4">You must complete prerequisite quests to reach this area.</p>
                        </div>
                      )}

                      {/* LOCKED ACTION STATE VIEW (Items/Password required) */}
                      {activeStatus === 'locked_action' && (
                        <div className="bg-slate-800/80 border border-slate-600 rounded-xl p-6 text-center shadow-lg">
                          {(activeNode.requiredItems || []).length > 0 && <Lock className="w-12 h-12 text-amber-500 mx-auto mb-4 opacity-80" />}
                          {activeNode.requiredPassword && <Key className="w-12 h-12 text-purple-400 mx-auto mb-4 opacity-80" />}
                          <h3 className="text-xl font-bold text-white mb-2">{t('Area Locked')}</h3>
                          <p className="text-slate-400 mb-6">{t('Determine what is needed to unlock the path forward.')}</p>
                          
                          <div className="max-w-md mx-auto text-left space-y-6">
                            {(activeNode.requiredItems || []).length > 0 && (
                              <div className="bg-slate-900 p-4 rounded-xl border border-slate-700">
                                <label className="block text-sm font-bold text-slate-300 mb-3">{t('Use Item(s):')}</label>
                                <div className="flex flex-wrap gap-2">
                                  {inventory.length === 0 ? (
                                    <span className="text-slate-500 text-sm italic">Your inventory is empty.</span>
                                  ) : (
                                    inventory.map((item, i) => {
                                      const isSelected = useItemSelection.includes(item);
                                      return (
                                        <button 
                                          key={i}
                                          onClick={() => {
                                            if (isSelected) setUseItemSelection(useItemSelection.filter(x => x !== item));
                                            else setUseItemSelection([...useItemSelection, item]);
                                          }}
                                          className={`flex items-center gap-2 px-3 py-2 rounded-lg text-sm transition-all border ${isSelected ? 'bg-amber-600/20 border-amber-500 text-amber-400' : 'bg-slate-800 border-slate-600 text-slate-300 hover:border-slate-500'}`}
                                        >
                                          {game.itemImages?.[item] && <img src={game.itemImages[item]} alt={item} className="w-4 h-4 object-contain" />}
                                          {item}
                                        </button>
                                      )
                                    })
                                  )}
                                </div>
                              </div>
                            )}

                            {activeNode.requiredPassword && (
                              <div className="bg-slate-900 p-4 rounded-xl border border-slate-700">
                                 <label className="block text-sm font-bold text-slate-300 mb-3">{t('Enter Password:')}</label>
                                 <input 
                                    type="text" 
                                    value={areaPasscodeInput} 
                                    onChange={(e) => setAreaPasscodeInput(e.target.value)} 
                                    className="w-full bg-slate-800 border-2 border-slate-600 focus:border-purple-500 rounded-lg p-3 text-white transition-colors outline-none" 
                                    placeholder="Password..." 
                                  />
                              </div>
                            )}

                            {unlockError && <p className="text-red-400 text-sm font-medium text-center">{t(unlockError)}</p>}
                            
                            <button onClick={handleAreaUnlockSubmit} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg">
                              {t('Attempt to Unlock')}
                            </button>
                          </div>
                        </div>
                      )}

                      {/* AVAILABLE STATE VIEW (Inside the Node) */}
                      {(activeStatus === 'available' || activeStatus === 'completed') && (
                        activeNode.type === 'escape_room' ? (
                          <div className="space-y-6 pt-4 border-t border-slate-700">
                            {activeStatus === 'completed' && (activeNode.completedStory || activeNode.completedImageUrl) && (
                                <div className="bg-slate-900/50 rounded-xl overflow-hidden border border-slate-700 shadow-md">
                                  <div className="p-4 bg-slate-800/80 border-b border-slate-700">
                                    <h4 className="text-sm font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-2">
                                      <BookOpen className="w-4 h-4" /> {t('Epilogue / After Completion')}
                                    </h4>
                                  </div>
                                  {activeNode.completedImageUrl && (
                                    <img src={activeNode.completedImageUrl} alt="Quest Cleared" className="w-full max-h-64 object-cover border-b border-slate-700" />
                                  )}
                                  {activeNode.completedStory && (
                                    <div className="p-6 prose prose-invert max-w-none">
                                      <p className="text-slate-300 leading-relaxed whitespace-pre-wrap">{activeNode.completedStory}</p>
                                    </div>
                                  )}
                                </div>
                            )}
                            <div>
                              <h3 className="text-lg font-bold text-white mb-4">{t('Investigate Objects in the Area:')}</h3>
                              <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                {(activeNode.objects || []).map(obj => {
                                  const isSolved = solvedEscapeObjects.includes(obj.id);
                                  return (
                                    <div 
                                      key={obj.id} 
                                      onClick={() => setActiveEscapeObject(obj)}
                                      className={`p-4 rounded-xl border transition-all flex flex-col items-center text-center group cursor-pointer
                                        ${isSolved ? 'bg-slate-900 border-emerald-900/50 opacity-80 hover:border-emerald-500/50 shadow-sm' : 'bg-slate-800 border-slate-600 hover:border-emerald-500 shadow-lg hover:-translate-y-1 hover:shadow-emerald-900/20'}
                                      `}
                                    >
                                      <div className={`p-3 rounded-full mb-3 ${isSolved ? 'bg-slate-800 text-emerald-600' : 'bg-blue-900/30 text-blue-400 group-hover:bg-emerald-900/30 group-hover:text-emerald-400'}`}>
                                        {isSolved ? <CheckCircle className="w-6 h-6 text-emerald-600" /> : <Box className="w-6 h-6" />}
                                      </div>
                                      <h4 className={`font-bold ${isSolved ? 'text-emerald-500/70' : 'text-slate-200'}`}>{obj.name}</h4>
                                      {isSolved && <span className="text-[10px] font-bold text-emerald-600 uppercase tracking-widest mt-2">Solved</span>}
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          </div>
                        ) : (
                          activeStatus === 'completed' ? (
                            <div className="space-y-6">
                              <div className="bg-emerald-900/20 border border-emerald-800/50 rounded-xl p-6 text-center shadow-lg">
                                <CheckCircle className="w-12 h-12 text-emerald-500 mx-auto mb-4" />
                                <h3 className="text-xl font-bold text-white mb-2">Quest Completed</h3>
                                <p className="text-emerald-400">You have successfully cleared this area.</p>
                              </div>
                              
                              {(activeNode.completedStory || activeNode.completedImageUrl) && (
                                <div className="bg-slate-900/50 rounded-xl overflow-hidden border border-slate-700 shadow-md">
                                  <div className="p-4 bg-slate-800/80 border-b border-slate-700">
                                    <h4 className="text-sm font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-2">
                                      <BookOpen className="w-4 h-4" /> {t('Epilogue / After Completion')}
                                    </h4>
                                  </div>
                                  {activeNode.completedImageUrl && (
                                    <img src={activeNode.completedImageUrl} alt="Quest Cleared" className="w-full max-h-64 object-cover border-b border-slate-700" />
                                  )}
                                  {activeNode.completedStory && (
                                    <div className="p-6 prose prose-invert max-w-none">
                                      <p className="text-slate-300 leading-relaxed whitespace-pre-wrap">{activeNode.completedStory}</p>
                                    </div>
                                  )}
                                </div>
                              )}

                              {tasks.length > 0 && tasks.some(t => t.link) && (
                                <div className="bg-slate-900/50 rounded-xl p-6 border border-slate-700">
                                  <h4 className="text-sm font-bold text-slate-300 mb-4 uppercase tracking-wider flex items-center gap-2">
                                    <BookOpen className="w-4 h-4 text-blue-400" /> {t('Review Exercises')}
                                  </h4>
                                  <div className="space-y-3">
                                    {tasks.map((task, tIdx) => task.link ? (
                                      <div key={tIdx} className="flex justify-between items-center bg-slate-800 p-3 rounded-lg border border-slate-700">
                                        <span className="text-slate-300 text-sm font-medium">Exercise {tasks.length > 1 ? `#${tIdx + 1}` : ''}</span>
                                        <a href={task.link} target="_blank" rel="noreferrer" className="text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded flex items-center gap-1 transition-colors">
                                          {t('Review Exercise')} <span className="text-[10px]">↗</span>
                                        </a>
                                      </div>
                                    ) : null)}
                                  </div>
                                </div>
                              )}
                            </div>
                          ) : (
                            <>
                              <div className="bg-slate-900 rounded-xl p-6 border border-slate-700 flex flex-col items-center">
                                {currentTask?.imageUrl && (
                                  <img src={currentTask.imageUrl} alt="Exercise Illustration" className="w-full max-h-64 object-cover rounded-lg mb-6 border border-slate-700 shadow-md" />
                                )}
                                {currentTask?.description && (
                                  <div className="text-slate-300 mb-6 italic text-left w-full border-l-4 border-blue-500 pl-4 py-2 bg-slate-800/50 rounded-r-lg">
                                    {currentTask.description.split('\n').map((line, lineIdx) => <React.Fragment key={lineIdx}>{line}<br/></React.Fragment>)}
                                  </div>
                                )}
                                <p className="text-slate-400 mb-4 text-center">Complete the exercise to reveal the 6-digit passcode.</p>
                                <a href={currentTask?.link} target="_blank" rel="noreferrer" className="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-bold transition-colors shadow-lg shadow-blue-900/20">
                                  Open Online Exercise {tasks.length > 1 ? currentTaskIndex + 1 : ''} <span className="text-xl">↗</span>
                                </a>
                              </div>

                              <div className="max-w-xs mx-auto text-center space-y-4">
                                <label className="block text-sm font-bold text-slate-400 uppercase tracking-widest">{t('Enter Code / Passcode')}</label>
                                <input type="text" value={passcodeInput} onChange={(e) => setPasscodeInput(e.target.value.replace(/\D/g, '').slice(0, 6))} className="w-full bg-slate-900 border-2 border-slate-600 focus:border-emerald-500 rounded-xl p-4 text-center text-3xl font-mono text-white tracking-[0.5em] transition-colors outline-none" placeholder="------" />
                                {errorMsg && <p className="text-red-400 text-sm font-medium">{t(errorMsg)}</p>}
                                <button onClick={handleQuestSubmit} disabled={passcodeInput.length !== 6} className="w-full bg-emerald-600 disabled:bg-slate-700 disabled:text-slate-500 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg">
                                  {t('Submit Code')}
                                </button>
                              </div>
                            </>
                          )
                        )
                      )}
                    </div>
                  </>
                )}
              </div>
            ) : null}

            {/* Spatial Map View */}
            <div className={`flex-1 bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden flex flex-col ${activeNode ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
              <div className="p-4 border-b border-slate-700 bg-slate-900/50 flex justify-between items-center z-20">
                <h2 className={`text-xl font-bold text-white ${isImmersive ? 'ml-4' : ''}`}>{game.title} - {t('World Map')}</h2>
                <button 
                  onClick={() => { setIsImmersive(!isImmersive); setShowHud(false); }}
                  className="text-slate-400 hover:text-white bg-slate-800 p-2 rounded-lg border border-slate-700 transition-colors flex items-center gap-2 shadow-sm hover:border-emerald-500/50"
                  title={isImmersive ? t("Exit") : t("Immersive")}
                >
                  {isImmersive ? <Minimize className="w-5 h-5" /> : <Maximize className="w-5 h-5" />}
                  <span className="hidden sm:inline text-sm font-semibold">{isImmersive ? t("Exit") : t("Immersive")}</span>
                </button>
              </div>
              
              <div className="relative flex-1 bg-slate-900 overflow-y-auto overflow-x-hidden flex items-center justify-center p-4 sm:p-8">
                 <div className="relative w-full aspect-[4/3] md:aspect-[16/10]">
                   
                   {/* Background Image Layer */}
                   <div className="absolute inset-0 rounded-xl overflow-hidden shadow-2xl pointer-events-none border border-slate-700/50 bg-slate-900">
                     {game.mapImageUrl ? (
                        <img src={game.mapImageUrl} alt="World Map" className="absolute inset-0 w-full h-full object-cover opacity-60" />
                     ) : (
                        <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-30"></div>
                     )}
                   </div>

                   {/* SVG Paths for Backtracking / Connectivity */}
                   <svg className="absolute inset-0 w-full h-full pointer-events-none z-10 overflow-visible">
                      {game.nodes?.map(node => {
                        if (getNodeStatus(node) === 'locked_quests') return null; // Hide lines to undiscovered quests
                        
                        return (node.requiredNodes || []).map(reqNodeId => {
                          const sourceNode = game.nodes.find(n => n.id === reqNodeId);
                          if (!sourceNode || sourceNode.x == null || node.x == null) return null;
                          
                          const isUnlocked = completedNodes.includes(reqNodeId);
                          return (
                            <line 
                              key={`${sourceNode.id}-${node.id}`}
                              x1={`${sourceNode.x}%`} y1={`${sourceNode.y}%`} 
                              x2={`${node.x}%`} y2={`${node.y}%`} 
                              stroke={isUnlocked ? '#10b981' : '#475569'} 
                              strokeWidth={isUnlocked ? "4" : "2"} 
                              strokeDasharray={isUnlocked ? "0" : "8"}
                              className="transition-all duration-1000"
                            />
                          );
                        });
                      })}
                   </svg>

                   {/* Map Nodes */}
                   {game.nodes?.map(node => {
                      const status = getNodeStatus(node);
                      
                      // Do not render empty circles for hidden quests!
                      if (status === 'locked_quests') return null;

                      const x = node.x || 50;
                      const y = node.y || 50;
                      
                      let tooltipXClass = "left-1/2 -translate-x-1/2";
                      if (x < 15) tooltipXClass = "left-0 translate-x-0";
                      else if (x > 85) tooltipXClass = "right-0 translate-x-0";

                      let tooltipYClass = "bottom-full mb-2";
                      if (y < 20) tooltipYClass = "top-full mt-2";

                      return (
                        <div 
                          key={node.id}
                          onClick={() => setActiveNode(node)}
                          style={{ left: `${x}%`, top: `${y}%` }}
                          className={`absolute -translate-x-1/2 -translate-y-1/2 p-3 rounded-full border-2 transition-all z-20 group cursor-pointer
                            ${status === 'completed' ? 'bg-slate-900 border-slate-700 opacity-80' : ''}
                            ${status === 'available' ? 'bg-slate-800 border-emerald-400 hover:scale-110 shadow-[0_0_20px_rgba(16,185,129,0.4)]' : ''}
                            ${status === 'locked_action' ? 'bg-slate-800 border-amber-400 hover:scale-110 shadow-[0_0_20px_rgba(251,191,36,0.4)]' : ''}
                          `}
                        >
                          {status === 'completed' && <CheckCircle className="w-6 h-6 text-emerald-500" />}
                          {status === 'locked_action' && <Key className="w-6 h-6 text-amber-400 animate-pulse" />}
                          {status === 'available' && <MapPin className="w-6 h-6 text-emerald-400 animate-pulse" />}

                          {/* Tooltip on Hover */}
                          <div className={`absolute ${tooltipYClass} ${tooltipXClass} w-max max-w-[200px] opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity bg-slate-900 border border-slate-700 p-2 rounded-lg shadow-xl text-center z-50`}>
                            <h4 className={`text-sm font-bold ${status === 'locked_action' ? 'text-slate-400' : 'text-white'}`}>
                              {status === 'locked_action' ? 'Locked Area' : node.title}
                            </h4>
                          </div>
                        </div>
                      );
                   })}
                 </div>
              </div>
            </div>
          </div>
        );

      return (
        <>
          {/* Chapter Story Modal */}
          {showStoryModal && (
            <div className="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/90 backdrop-blur-sm p-4" onClick={() => setShowStoryModal(false)}>
              <div className="bg-slate-800 rounded-2xl border border-slate-600 shadow-2xl max-w-lg w-full p-6 text-center animate-in fade-in zoom-in-95 duration-200 overflow-y-auto max-h-[90vh]" onClick={e => e.stopPropagation()}>
                <h3 className="text-2xl font-bold text-indigo-400 mb-4 border-b border-slate-700 pb-2">{game.title}</h3>
                {game.chapterImageUrl && (
                  <div className="mb-6 rounded-xl overflow-hidden border border-slate-700 shadow-inner">
                    <img src={game.chapterImageUrl} alt="Chapter Illustration" className="w-full max-h-64 object-cover" />
                  </div>
                )}
                <div className="text-slate-300 text-base leading-relaxed text-left bg-slate-900 p-4 rounded-lg border border-slate-700 shadow-inner font-serif whitespace-pre-wrap">
                  {game.description || <span className="italic text-slate-500">No story provided for this chapter.</span>}
                </div>
                <button 
                  onClick={() => setShowStoryModal(false)}
                  className="mt-6 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg transition-colors border border-indigo-500 shadow-lg"
                >
                  Continue Exploring
                </button>
              </div>
            </div>
          )}

          {/* Combination Result Modal */}
          {combineResult && (
            <div className="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/90 backdrop-blur-sm p-4" onClick={() => setCombineResult(null)}>
              <div className="bg-slate-800 rounded-2xl border border-slate-600 shadow-2xl max-w-sm w-full p-6 text-center animate-in fade-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                {combineResult.success ? (
                  <>
                    <h3 className="text-2xl font-bold text-emerald-400 mb-4 border-b border-slate-700 pb-2">{t('Success!')}</h3>
                    <div className="bg-slate-900/80 rounded-xl p-6 mb-4 flex justify-center items-center min-h-[160px] border border-slate-700 shadow-inner">
                      {game.itemImages?.[combineResult.item] ? (
                        <img src={game.itemImages[combineResult.item]} alt={combineResult.item} className="w-32 h-32 object-contain drop-shadow-[0_0_15px_rgba(16,185,129,0.3)] animate-pulse" style={{animationDuration: '2s'}} />
                      ) : (
                        <Award className="w-16 h-16 text-amber-400 animate-pulse" style={{animationDuration: '2s'}} />
                      )}
                    </div>
                    <p className="text-slate-300 text-sm">{t('You successfully combined the items to create:')}</p>
                    <p className="text-xl font-bold text-white mt-2">{combineResult.item}</p>
                  </>
                ) : (
                  <>
                    <h3 className="text-2xl font-bold text-red-400 mb-4 border-b border-slate-700 pb-2">{t("It didn't work")}</h3>
                    <div className="bg-red-900/20 rounded-xl p-6 mb-4 flex justify-center items-center min-h-[160px] border border-red-800/50 shadow-inner">
                      <AlertTriangle className="w-16 h-16 text-red-500 opacity-80" />
                    </div>
                    <p className="text-slate-300 text-sm">{t('These items cannot be combined together.')}</p>
                  </>
                )}
                <button 
                  onClick={() => setCombineResult(null)}
                  className="mt-6 w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg transition-colors border border-slate-600"
                >
                  {t('Continue')}
                </button>
              </div>
            </div>
          )}

          {/* Item Inspection Modal */}
          {viewingItem && (
            <div className="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4" onClick={() => setViewingItem(null)}>
              <div className="bg-slate-800 rounded-2xl border border-slate-600 shadow-2xl max-w-sm w-full p-6 text-center animate-in fade-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                <h3 className="text-2xl font-bold text-emerald-400 mb-4 border-b border-slate-700 pb-2">{viewingItem}</h3>
                <div className="bg-slate-900/80 rounded-xl p-6 mb-4 flex justify-center items-center min-h-[160px] border border-slate-700 shadow-inner">
                  {game.itemImages?.[viewingItem] ? (
                    <img src={game.itemImages[viewingItem]} alt={viewingItem} className="w-32 h-32 object-contain drop-shadow-[0_0_15px_rgba(16,185,129,0.3)] animate-pulse" style={{animationDuration: '3s'}} />
                  ) : (
                    <Award className="w-16 h-16 text-amber-400 animate-pulse" style={{animationDuration: '3s'}} />
                  )}
                </div>
                <div className="text-slate-300 text-sm leading-relaxed text-left bg-slate-900 p-4 rounded-lg border border-slate-700 min-h-[100px] shadow-inner font-serif whitespace-pre-wrap">
                  {game.itemDescriptions?.[viewingItem] ? (
                     game.itemDescriptions[viewingItem].split('\n').map((line, idx) => (
                       <React.Fragment key={idx}>
                         {line}
                         <br />
                       </React.Fragment>
                     ))
                  ) : (
                    <span className="italic text-slate-500">A mysterious item. Its true purpose is yet to be revealed...</span>
                  )}
                </div>
                <button 
                  onClick={() => setViewingItem(null)}
                  className="mt-6 w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg transition-colors border border-slate-600"
                >
                  {t('Close')}
                </button>
              </div>
            </div>
          )}

          <div className={isImmersive ? "fixed inset-0 z-[60] bg-slate-900 flex flex-row overflow-hidden transition-colors duration-500" : "flex flex-col gap-6 w-full max-w-5xl mx-auto"}>
            
            {/* Floating HUD Button for Immersive Mode */}
            {isImmersive && !showHud && (
              <button 
                onClick={() => setShowHud(true)}
                className="absolute top-24 left-6 z-[65] bg-slate-800/90 backdrop-blur-md border border-slate-600 text-white p-4 rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.5)] hover:bg-slate-700 transition-all group flex items-center gap-3 hover:scale-105 hover:border-emerald-500/50"
              >
                <Menu className="w-6 h-6 text-slate-300 group-hover:text-emerald-400 transition-colors" />
                <span className="font-bold tracking-wider text-sm">{t('Commander HUD')}</span>
              </button>
            )}

            {isImmersive ? (
              <>
                <div className={`fixed inset-y-0 left-0 w-80 max-w-[85vw] bg-slate-900/95 backdrop-blur-xl p-6 z-[70] shadow-[10px_0_30px_rgba(0,0,0,0.5)] border-r border-slate-700 transition-transform duration-300 flex flex-col gap-6 overflow-y-auto custom-scrollbar ${showHud ? 'translate-x-0' : '-translate-x-full'}`}>
                  <div className="flex justify-between items-center mb-[-1rem] pb-4 border-b border-slate-700">
                    <h2 className="text-xl font-bold text-white flex items-center gap-2"><BookOpen className="w-5 h-5 text-emerald-400"/> {t('Commander HUD')}</h2>
                    <button onClick={() => setShowHud(false)} className="text-slate-400 hover:text-white p-2 bg-slate-800 rounded-lg transition-colors border border-slate-700 hover:border-slate-500">
                      <X className="w-5 h-5" />
                    </button>
                  </div>
                  {btnBack}
                  {btnStory}
                  {blockStats}
                  {blockInventory}
                  {btnReset}
                </div>
                {blockMap}
              </>
            ) : (
              <>
                {btnBack}
                {btnStory}
                {blockMap}
                {blockStats}
                {blockInventory}
                {btnReset}
              </>
            )}
          </div>
        </>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
