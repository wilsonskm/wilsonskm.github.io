    function App() {
      const [language, setLanguage] = useState('en');
      const t = (text) => translations[language]?.[text] || text;
      
      const [user, setUser] = useState(null);
      const [authInitialized, setAuthInitialized] = useState(false);
      const [role, setRole] = useState(null); 
      
      // Separate states for logged in entities
      const [loggedInStudent, setLoggedInStudent] = useState(null);
      const [loggedInTeacher, setLoggedInTeacher] = useState(null);
      
      const [games, setGames] = useState([]);
      const [allProgress, setAllProgress] = useState([]);
      const [students, setStudents] = useState([]);
      const [groups, setGroups] = useState([]);
      const [teachers, setTeachers] = useState([]);
      
      const [loading, setLoading] = useState(true);
      const [sessionLoaded, setSessionLoaded] = useState(false);
      const [playingTeacherName, setPlayingTeacherName] = useState('');
      const [activeTheme, setActiveTheme] = useState('slate');

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
              await signInWithCustomToken(auth, window.__initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.error("Auth init error:", err);
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setAuthInitialized(true);
        });

        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;

        const gamesUnsub = onSnapshot(collection(db, GAMES_PATH), (snapshot) => {
          setGames(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        }, (err) => console.error("Games fetch error:", err));

        const progressUnsub = onSnapshot(collection(db, PROGRESS_PATH), (snapshot) => {
          setAllProgress(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        }, (err) => console.error("Progress fetch error:", err));

        const studentsUnsub = onSnapshot(collection(db, STUDENTS_PATH), (snapshot) => {
          setStudents(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        }, (err) => console.error("Students fetch error:", err));

        const groupsUnsub = onSnapshot(collection(db, GROUPS_PATH), (snapshot) => {
          setGroups(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        }, (err) => console.error("Groups fetch error:", err));
        
        const teachersUnsub = onSnapshot(collection(db, TEACHERS_PATH), (snapshot) => {
          setTeachers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          setLoading(false);
        }, (err) => console.error("Teachers fetch error:", err));

        const sessionRef = doc(db, `artifacts/${appId}/users/${user.uid}/profile`, 'session');
        const sessionUnsub = onSnapshot(sessionRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.role === 'teacher' && data.teacher) {
              setRole('teacher');
              setLoggedInTeacher(data.teacher);
            } else if (data.role === 'student' && data.student) {
              setRole('student');
              setLoggedInStudent(data.student);
            }
          }
          setSessionLoaded(true);
        }, (err) => console.error("Session fetch error:", err));

        return () => {
          gamesUnsub(); progressUnsub(); studentsUnsub(); groupsUnsub(); teachersUnsub(); sessionUnsub();
        };
      }, [user]);

      // Apply the theme CSS variables to the document root dynamically
      useEffect(() => {
        const themeVars = THEMES[activeTheme] || THEMES['slate'];
        const root = document.documentElement;
        Object.entries(themeVars).forEach(([key, value]) => {
          root.style.setProperty(key, value);
        });
      }, [activeTheme]);

      const logout = async () => {
        if (user) {
          await deleteDoc(doc(db, `artifacts/${appId}/users/${user.uid}/profile`, 'session'));
        }
        setRole(null);
        setLoggedInStudent(null);
        setLoggedInTeacher(null);
        setActiveTheme('slate');
      };

      const updateTeacherSession = async (updatedTeacher) => {
        if (user) {
          await setDoc(doc(db, `artifacts/${appId}/users/${user.uid}/profile`, 'session'), { role: 'teacher', teacher: updatedTeacher });
          setLoggedInTeacher(updatedTeacher);
        }
      };

      if (!authInitialized || loading || !sessionLoaded) {
        return <div className="min-h-screen flex items-center justify-center bg-slate-900 text-white font-sans transition-colors duration-1000">{t("Loading Questify...")}</div>;
      }

      if (!role) {
        return (
          <LanguageContext.Provider value={{ language, setLanguage, t }}>
            <RoleSelection 
                  students={students} 
                  teachers={teachers}
                  onTeacherLogin={async (teacherObj) => {
                    if (user) await setDoc(doc(db, `artifacts/${appId}/users/${user.uid}/profile`, 'session'), { role: 'teacher', teacher: teacherObj });
                    setLoggedInTeacher(teacherObj);
                    setRole('teacher');
                  }} 
                  onStudentLogin={async (studentObj) => {
                    if (user) await setDoc(doc(db, `artifacts/${appId}/users/${user.uid}/profile`, 'session'), { role: 'student', student: studentObj });
                    setLoggedInStudent(studentObj);
                    setRole('student');
                  }} 
            />
          </LanguageContext.Provider>
        );
      }

      return (
        <LanguageContext.Provider value={{ language, setLanguage, t }}>
        <div className="min-h-screen flex flex-col bg-slate-900 text-slate-200 font-sans selection:bg-emerald-500/30 transition-colors duration-500">

            <div className="flex items-center space-x-2">

                </div>
                {playingTeacherName && role === 'student' && <span className="text-xs text-emerald-400 font-semibold mt-1">{t('Teacher:')} {playingTeacherName}</span>}
              </div>
            </div>
            <div className="flex items-center space-x-4">
              <div className="text-sm text-emerald-400 font-bold hidden sm:block">
                {role === 'teacher' ? `${loggedInTeacher?.role === 'admin' ? t('Admin') : t('Teacher')}: ${loggedInTeacher?.name}` : `${t('Student:')} ${loggedInStudent?.name}`}

              </button>
              <button onClick={logout} className="flex items-center space-x-1 text-slate-400 hover:text-white transition-colors bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 hover:border-slate-500">

              </button>

          <main className="flex-1 w-full p-4 md:p-8 max-w-7xl mx-auto">
            {role === 'teacher' ? (
              <TeacherDashboard 
                teacher={loggedInTeacher}
                teachers={teachers}
                games={games} 
                allProgress={allProgress} 
                students={students} 
                groups={groups} 
                setActiveTheme={setActiveTheme} 
                updateSession={updateTeacherSession}
                logout={logout}
              />
            ) : (
              <StudentDashboard 
                student={loggedInStudent} 
                games={games} 
                groups={groups} 
                teachers={teachers}
                allProgress={allProgress} 
                setActiveTheme={setActiveTheme} 
                setPlayingTeacherName={setPlayingTeacherName}

          </main>
          <footer className="py-6 text-center text-slate-500 text-xs border-t border-slate-800 bg-slate-900 mt-auto z-10 transition-colors duration-500">
            <p className="mb-1">Created by Mr. KM So with Google Gemini.</p>
            <p>&copy; 2026 Cheung Chuk Shan College. All rights reserved.</p>
          </footer>
        </div>
        </LanguageContext.Provider>
      );
    }

    function RoleSelection({ students, teachers, onTeacherLogin, onStudentLogin }) {
      const { t, language, setLanguage } = useContext(LanguageContext);
      const [showTeacherAuth, setShowTeacherAuth] = useState(false);
      const [teacherId, setTeacherId] = useState('');
      const [teacherPassword, setTeacherPassword] = useState('');
      const [teacherError, setTeacherError] = useState('');

      const [showStudentAuth, setShowStudentAuth] = useState(false);
      const [studentId, setStudentId] = useState('');
      const [studentPassword, setStudentPassword] = useState('');
      const [studentError, setStudentError] = useState('');
      
      const [showGuestPrompt, setShowGuestPrompt] = useState(false);
      const [guestName, setGuestName] = useState('');

      const handleTeacherSubmit = async () => {
        const tId = teacherId.trim();
        const tPwd = teacherPassword.trim();

        if (teachers.length === 0 && tId === 'admin' && tPwd === 'admin') {
          onTeacherLogin({ id: 'admin', name: 'System Admin', role: 'admin', isDefault: true });
          return;
        }

        const matchedTeacher = teachers.find(t => t.id === tId);
        if (matchedTeacher) {
          const inputHash = await hashPassword(tPwd);
          const expectedHash = matchedTeacher.passwordHash || await hashPassword(tId); // Default fallback

          if (inputHash === expectedHash) {
            onTeacherLogin(matchedTeacher);
            return;
          }
        }
        
        setTeacherError('Invalid User ID or Password.');
      };

      const handleStudentSubmit = async () => {
        const trimmedId = studentId.trim();
        const trimmedPwd = studentPassword.trim();
        
        // Guest Account Interception
        if (trimmedId.toLowerCase() === 'guest' && trimmedPwd === '000000') {
          const existingGuestId = localStorage.getItem('questify_guest_id');
          if (existingGuestId) {
            const guestStudent = students.find(s => s.id === existingGuestId);
            if (guestStudent) {
              onStudentLogin(guestStudent);
              return;
            }
          }
          setShowGuestPrompt(true);
          return;
        }

        const matchedStudent = students.find(s => s.id === trimmedId && !s.isGuest);
        if (!matchedStudent) {
          setStudentError('Invalid User ID or Password.');
          return;
        }

        const inputHash = await hashPassword(trimmedPwd);
        const expectedHash = matchedStudent.passwordHash || (await hashPassword(trimmedId)); // Default to User ID if hash is empty

        if (inputHash === expectedHash) {
          onStudentLogin(matchedStudent);
        } else {
          setStudentError('Invalid User ID or Password.');
        }
      };

      const handleGuestSubmit = async () => {
        if (!guestName.trim()) {
          setStudentError("Please enter a display name.");
          return;
        }
        const newGuestId = `guest_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
        const newGuest = {
          id: newGuestId,
          name: guestName.trim(),
          className: 'Guest',
          classNumber: 'NA',
          isGuest: true
        };
        try {
          await setDoc(doc(db, STUDENTS_PATH, newGuestId), newGuest);
          localStorage.setItem('questify_guest_id', newGuestId);
          onStudentLogin(newGuest);
        } catch (err) {
          setStudentError('Failed to create guest session.');
        }
      };

      return (

            </button>
          </div>
          <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
          <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

          <div className="z-10 text-center mb-10 mt-8">

              <p className="text-slate-400 mb-6 text-sm">{t("Embark on quests, solve exercises, and collect items.")}</p>
              
              <div className="w-full mt-auto">

    function ForceSetupModal({ onComplete, onLogout }) {
      const [newId, setNewId] = useState('');
      const [newName, setNewName] = useState('');
      const [newPwd, setNewPwd] = useState('');
      const [confirmPwd, setConfirmPwd] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      // Data restore states
      const [importState, setImportState] = useState('idle');
      const [parsedBackup, setParsedBackup] = useState(null);
      const [importError, setImportError] = useState('');
      const [importProgress, setImportProgress] = useState(0);
      const fileInputRef = React.useRef(null);

      const handleFileSelect = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.games && Array.isArray(data.games)) {
              setParsedBackup(data);
              setImportState('confirming');
            } else {
              setImportError('Invalid backup file format.');
              setImportState('error');
            }
          } catch (err) {
            setImportError('Failed to parse backup file.');
            setImportState('error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const executeImport = async () => {
        setImportState('uploading');
        setImportProgress(0);
        try {
          // Find the admin in the backup FIRST, so unassigned data is given to them
          let importedAdmin = (parsedBackup.teachers || []).find(t => t.role === 'admin');
          const fallbackAdminId = importedAdmin ? importedAdmin.id : 'admin';

          const allDocs = [];
          for (const game of parsedBackup.games || []) {
            if (!game.teacherId) game.teacherId = fallbackAdminId;
            allDocs.push({ path: GAMES_PATH, id: game.id, data: game });
          }
          for (const prog of parsedBackup.progress || []) {
            allDocs.push({ path: PROGRESS_PATH, id: prog.id, data: prog });
          }
          for (const s of parsedBackup.students || []) {
            allDocs.push({ path: STUDENTS_PATH, id: s.id, data: s });
          }
          for (const g of parsedBackup.groups || []) {
            if (!g.teacherId) g.teacherId = fallbackAdminId;
            allDocs.push({ path: GROUPS_PATH, id: g.id, data: g });
          }
          for (const t of parsedBackup.teachers || []) {
            allDocs.push({ path: TEACHERS_PATH, id: t.id, data: t });
          }

          const totalDocs = allDocs.length;
          if (totalDocs > 0) {
            const CHUNK_SIZE = 50;
            let completedDocs = 0;
            for (let i = 0; i < totalDocs; i += CHUNK_SIZE) {
              const chunk = allDocs.slice(i, i + CHUNK_SIZE);
              await Promise.all(chunk.map(docInfo => setDoc(doc(db, docInfo.path, docInfo.id), docInfo.data)));
              completedDocs += chunk.length;
              setImportProgress(Math.floor((completedDocs / totalDocs) * 100));
            }
          }
          
          setImportState('success');
          setTimeout(() => {
            if (importedAdmin) {
              if (onLogout) onLogout();
            } else {
              setImportState('idle');
              setError("Data restored, but no Admin account found in backup. Please create one manually.");
            }
          }, 2000);
        } catch (err) {
          setImportError(err.message);
          setImportState('error');
        }
      };

      const handleSubmit = async () => {
        setError('');
        if (!newId.trim() || !newName.trim() || !newPwd || !confirmPwd) {
          setError('All fields are required.'); return;
        }
        if (newId.trim().toLowerCase() === 'admin' || newId.trim().toLowerCase() === 'guest') {
          setError('This User ID is reserved. Please choose another.'); return;
        }
        if (newPwd !== confirmPwd) {
          setError('Passwords do not match.'); return;
        }
        if (newPwd.length < 4) {
          setError('Password must be at least 4 characters long.'); return;
        }

        setLoading(true);
        try {
          const hash = await hashPassword(newPwd);
          const newAdmin = {
            id: newId.trim(),
            name: newName.trim(),
            role: 'admin',
            passwordHash: hash
          };
          await setDoc(doc(db, TEACHERS_PATH, newAdmin.id), newAdmin);
          onComplete(newAdmin);
        } catch (err) {
          setError('Failed to save. Please try again.');
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900 p-4">
          <div className="bg-slate-800 rounded-2xl border border-red-500/50 shadow-[0_0_50px_rgba(239,68,68,0.2)] max-w-md w-full p-8 relative overflow-hidden animate-in fade-in zoom-in-95 duration-500">
            <div className="flex justify-center mb-6">
              <ShieldAlert className="w-16 h-16 text-red-500 animate-pulse" />
            </div>
            <h2 className="text-2xl font-extrabold text-white text-center mb-2">Security Setup Required</h2>
            <p className="text-slate-400 text-sm text-center mb-8">You are using the default System Admin account. To secure your platform, you must create your permanent Admin credentials now. <strong className="text-red-400">The User ID cannot be changed later.</strong></p>
            
            <div className="space-y-4 mb-8">
              <div>
                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">New Admin User ID</label>
                <input type="text" value={newId} onChange={e=>setNewId(e.target.value)} className="w-full bg-slate-900 border border-slate-600 focus:border-red-500 rounded-lg p-3 text-white transition-colors outline-none" placeholder="e.g. principal_smith" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Display Name</label>
                <input type="text" value={newName} onChange={e=>setNewName(e.target.value)} className="w-full bg-slate-900 border border-slate-600 focus:border-red-500 rounded-lg p-3 text-white transition-colors outline-none" placeholder="e.g. Mr. Smith" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">New Secure Password</label>
                <input type="password" value={newPwd} onChange={e=>setNewPwd(e.target.value)} className="w-full bg-slate-900 border border-slate-600 focus:border-red-500 rounded-lg p-3 text-white transition-colors outline-none tracking-widest" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Confirm Password</label>
                <input type="password" value={confirmPwd} onChange={e=>setConfirmPwd(e.target.value)} className="w-full bg-slate-900 border border-slate-600 focus:border-red-500 rounded-lg p-3 text-white transition-colors outline-none tracking-widest" />
              </div>
            </div>

            {error && <p className="text-red-400 text-sm font-bold text-center mb-4 bg-red-900/20 p-2 rounded border border-red-800/50">{error}</p>}

            <button onClick={handleSubmit} disabled={loading} className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-red-900/20 flex justify-center items-center gap-2">
              {loading ? <Sparkles className="w-5 h-5 animate-spin" /> : <Lock className="w-5 h-5" />}
              Secure Platform & Continue
            </button>

            {/* Quick Restore Backup Section */}
            <div className="mt-6 pt-6 border-t border-slate-700 text-center">
              <p className="text-xs text-slate-400 mb-3">Already have a system backup?</p>
              <input type="file" accept=".json" ref={fileInputRef} onChange={handleFileSelect} className="hidden" />
              <button onClick={() => fileInputRef.current.click()} disabled={loading || importState !== 'idle'} className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-all shadow-lg flex justify-center items-center gap-2 text-sm">
                <Upload className="w-4 h-4" /> Quick Restore Data
              </button>
            </div>

            {/* Overlays for Import States */}
            {importState === 'confirming' && (
              <div className="absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center p-6 text-center z-10 animate-in fade-in">
                <AlertTriangle className="w-10 h-10 text-amber-400 mb-2" />
                <h4 className="text-lg font-bold text-white mb-2">Restore Backup?</h4>
                <p className="text-xs text-slate-300 mb-6">This will populate the database with the backup data. If the backup contains an Admin account, you will be securely logged out to sign in with it.</p>
                <div className="flex gap-2 w-full">
                  <button onClick={() => setImportState('idle')} className="flex-1 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-sm font-semibold transition-colors">Cancel</button>
                  <button onClick={executeImport} className="flex-1 py-3 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-sm font-semibold transition-colors">Confirm</button>
                </div>
              </div>
            )}
            {importState === 'uploading' && (
              <div className="absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center p-6 text-center z-10 animate-in fade-in">
                <Database className="w-10 h-10 text-blue-400 mb-4 animate-bounce" />
                <h4 className="text-lg font-bold text-white mb-4">Restoring Data...</h4>
                <div className="w-full max-w-xs bg-slate-800 rounded-full h-3 mb-2 overflow-hidden border border-slate-700">
                  <div className="bg-blue-500 h-full rounded-full transition-all duration-300" style={{ width: `${importProgress}%` }}></div>
                </div>
                <p className="text-sm font-bold text-blue-400 mb-2">{importProgress}% Completed</p>
                <p className="text-xs text-slate-400">Please do not close the window.</p>
              </div>
            )}
            {importState === 'success' && (
              <div className="absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center p-6 text-center z-10 animate-in fade-in">
                <CheckCircle className="w-10 h-10 text-emerald-400 mb-4" />
                <h4 className="text-lg font-bold text-white mb-2">Restore Complete!</h4>
                <p className="text-xs text-slate-400">Processing...</p>
              </div>
            )}
            {importState === 'error' && (
              <div className="absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center p-6 text-center z-10 animate-in fade-in">
                <AlertTriangle className="w-10 h-10 text-red-500 mb-2" />
                <h4 className="text-lg font-bold text-white mb-2">Restore Failed</h4>
                <p className="text-xs text-red-400 mb-6">{importError}</p>
                <button onClick={() => setImportState('idle')} className="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-sm font-semibold transition-colors">Try Again</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function TeacherDashboard({ teacher, teachers, games, allProgress, students, groups, setActiveTheme, updateSession, logout }) {
      const { t } = useContext(LanguageContext);
      const [activeTab, setActiveTab] = useState('groups');
      const [editingGame, setEditingGame] = useState(null);
      const [editingGroup, setEditingGroup] = useState(null);
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      const [confirmDeleteStudentId, setConfirmDeleteStudentId] = useState(null);
      
      const [editingStudent, setEditingStudent] = useState(null);
      const [isNewStudent, setIsNewStudent] = useState(false);
      const [studentEditError, setStudentEditError] = useState('');

      const [editingTeacherAccount, setEditingTeacherAccount] = useState(null);
      const [isNewTeacherAcc, setIsNewTeacherAcc] = useState(false);
      const [teacherEditError, setTeacherEditError] = useState('');
      
      const [isTeacherBulkAdding, setIsTeacherBulkAdding] = useState(false);
      const [teacherBulkData, setTeacherBulkData] = useState({ ids: '', names: '', passwords: '' });
      const [teacherBulkMsg, setTeacherBulkMsg] = useState({ type: '', text: '' });
      
      const [showAIGenerator, setShowAIGenerator] = useState(false);

      const [isBulkAdding, setIsBulkAdding] = useState(false);
      const [bulkData, setBulkData] = useState({ ids: '', names: '', classNames: '', classNumbers: '', passwords: '' });
      const [bulkMsg, setBulkMsg] = useState({ type: '', text: '' });

      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStep, setSyncStep] = useState('input');
      const [syncData, setSyncData] = useState({ ids: '', names: '', classNames: '', classNumbers: '', passwords: '' });
      const [syncAnalysis, setSyncAnalysis] = useState({ toAdd: [], toUpdate: [], toDelete: [] });
      const [syncKeepIds, setSyncKeepIds] = useState([]);
      const [syncMsg, setSyncMsg] = useState({ type: '', text: '' });

      const [progressFilterGroup, setProgressFilterGroup] = useState('');
      const [progressFilterChapter, setProgressFilterChapter] = useState('');
      const [confirmResetProgress, setConfirmResetProgress] = useState(null);
      const [accountFilter, setAccountFilter] = useState('regular');
      const [confirmClearAllGuests, setConfirmClearAllGuests] = useState(false);

      const [gameFilterTeacher, setGameFilterTeacher] = useState(teacher.id);
      const [groupFilterTeacher, setGroupFilterTeacher] = useState(teacher.id);

      // Backup & Restore states
      const [importState, setImportState] = useState('idle');
      const [parsedBackup, setParsedBackup] = useState(null);
      const [importError, setImportError] = useState('');
      const [importProgress, setImportProgress] = useState(0);
      const fileInputRef = React.useRef(null);
      const chapterFileInputRef = React.useRef(null);
      
      const [pwData, setPwData] = useState({ current: '', newPw: '', confirm: '' });
      const [passwordMsg, setPasswordMsg] = useState('');

      const [myProfileName, setMyProfileName] = useState(teacher?.name || '');
      const [profileNameMsg, setProfileNameMsg] = useState('');
      
      const [chapterImportMsg, setChapterImportMsg] = useState({ type: '', text: '' });
      const [geminiApiKey, setGeminiApiKey] = useState('');

      useEffect(() => {
        setMyProfileName(teacher?.name || '');
      }, [teacher?.name]);

      useEffect(() => {
        // Automatically reset filters if the teacher ID changes (e.g. after force setup / restore)
        setGameFilterTeacher(teacher?.id || '');
        setGroupFilterTeacher(teacher?.id || '');
      }, [teacher?.id]);

      if (teacher.isDefault) {
        return <ForceSetupModal onComplete={updateSession} onLogout={logout} />;
      }

      const isAdmin = teacher.role === 'admin';

      const handleExport = () => {
        const data = { games, progress: allProgress, students, groups, teachers };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `questify_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleExportSingleChapter = (gameToExport) => {
        const data = { games: [gameToExport], progress: [], students: [], groups: [] };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const safeTitle = gameToExport.title ? gameToExport.title.replace(/[^a-z0-9]/gi, '_').toLowerCase() : 'chapter';
        a.download = `questify_chapter_${safeTitle}_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleFileSelect = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.games && Array.isArray(data.games)) {
              setParsedBackup(data);
              setImportState('confirming');
            } else {
              setImportError('Invalid backup file format.');
              setImportState('error');
            }
          } catch (err) {
            setImportError('Failed to parse backup file.');
            setImportState('error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const handleClearAllGuests = async () => {
        if (!confirmClearAllGuests) {
          setConfirmClearAllGuests(true);
          setTimeout(() => setConfirmClearAllGuests(false), 3000);
          return;
        }
        
        try {
          const guestAccounts = students.filter(s => s.isGuest);
          const guestIds = guestAccounts.map(s => s.id);

          // Delete all guest records and their progress
          await Promise.all(guestIds.map(id => deleteDoc(doc(db, STUDENTS_PATH, id))));
          await Promise.all(guestIds.map(id => deleteDoc(doc(db, PROGRESS_PATH, id))));

          // Remove references from any groups as a cleanup measure
          const affectedGroups = groups.filter(g => g.students?.some(sId => guestIds.includes(sId)));
          await Promise.all(affectedGroups.map(g => {
            const newStudents = g.students.filter(sId => !guestIds.includes(sId));
            return setDoc(doc(db, GROUPS_PATH, g.id), { ...g, students: newStudents });
          }));

          setConfirmClearAllGuests(false);
        } catch (err) {
          console.error("Failed to clear guests:", err);
        }
      };

      const executeImport = async () => {
        setImportState('uploading');
        setImportProgress(0);
        try {
          const fallbackAdminId = teachers.find(t => t.role === 'admin')?.id || teacher.id;

          const allDocs = [];
          for (const game of parsedBackup.games || []) {
            if (!game.teacherId) game.teacherId = fallbackAdminId;
            allDocs.push({ path: GAMES_PATH, id: game.id, data: game });
          }
          for (const prog of parsedBackup.progress || []) {
            allDocs.push({ path: PROGRESS_PATH, id: prog.id, data: prog });
          }
          for (const s of parsedBackup.students || []) {
            allDocs.push({ path: STUDENTS_PATH, id: s.id, data: s });
          }
          for (const g of parsedBackup.groups || []) {
            if (!g.teacherId) g.teacherId = fallbackAdminId;
            allDocs.push({ path: GROUPS_PATH, id: g.id, data: g });
          }
          for (const t of parsedBackup.teachers || []) {
            allDocs.push({ path: TEACHERS_PATH, id: t.id, data: t });
          }

          const totalDocs = allDocs.length;
          if (totalDocs > 0) {
            const CHUNK_SIZE = 50;
            let completedDocs = 0;
            for (let i = 0; i < totalDocs; i += CHUNK_SIZE) {
              const chunk = allDocs.slice(i, i + CHUNK_SIZE);
              await Promise.all(chunk.map(docInfo => setDoc(doc(db, docInfo.path, docInfo.id), docInfo.data)));
              completedDocs += chunk.length;
              setImportProgress(Math.floor((completedDocs / totalDocs) * 100));
            }
          }
          
          setImportState('success');
          setTimeout(() => setImportState('idle'), 3000);
        } catch (err) {
          setImportError(err.message);
          setImportState('error');
        }
      };

      const handleBulkSave = async () => {
        const ids = bulkData.ids.split('\n').map(s => s.trim());
        const names = bulkData.names.split('\n').map(s => s.trim());
        const classes = bulkData.classNames.split('\n').map(s => s.trim());
        const classNums = bulkData.classNumbers.split('\n').map(s => s.trim());
        const passwords = bulkData.passwords.split('\n').map(s => s.trim());

        const maxRows = Math.max(ids.length, names.length);
        const newStudents = [];
        const usedIds = new Set(students.map(s => s.id));

        for (let i = 0; i < maxRows; i++) {
          const id = ids[i] || '';
          const name = names[i] || '';
          
          if (!id && !name && !(classes[i] || '') && !(classNums[i] || '') && !(passwords[i] || '')) continue;
          
          if (!id || !name) {
            setBulkMsg({ type: 'error', text: `Row ${i + 1} is missing a User ID or Name. Please ensure IDs and Names are provided for all students.` });
            return;
          }

          if (usedIds.has(id)) {
            setBulkMsg({ type: 'error', text: `Row ${i + 1} has an ID (${id}) that is already in use.` });
            return;
          }

          usedIds.add(id);

          let passHash = '';
          if (passwords[i]) {
            passHash = await hashPassword(passwords[i]);
          }

          newStudents.push({
            id, name,
            className: classes[i] || '',
            classNumber: classNums[i] || '',
            passwordHash: passHash
          });
        }

        try {
          setBulkMsg({ type: 'success', text: `Saving ${newStudents.length} students...` });
          await Promise.all(newStudents.map(s => setDoc(doc(db, STUDENTS_PATH, s.id), s)));
          setBulkMsg({ type: 'success', text: `Successfully imported ${newStudents.length} students!` });
          setTimeout(() => {
            setIsBulkAdding(false);
            setBulkData({ ids: '', names: '', classNames: '', classNumbers: '', passwords: '' });
            setBulkMsg({ type: '', text: '' });
          }, 2000);
        } catch (err) {
          setBulkMsg({ type: 'error', text: 'Error saving students: ' + err.message });
        }
      };

      const handleTeacherBulkSave = async () => {
        const ids = teacherBulkData.ids.split('\n').map(s => s.trim());
        const names = teacherBulkData.names.split('\n').map(s => s.trim());
        const passwords = teacherBulkData.passwords.split('\n').map(s => s.trim());

        const maxRows = Math.max(ids.length, names.length);
        const newTeachers = [];
        const usedIds = new Set(teachers.map(t => t.id));

        for (let i = 0; i < maxRows; i++) {
          const id = ids[i] || '';
          const name = names[i] || '';
          
          if (!id && !name && !(passwords[i] || '')) continue;
          
          if (!id || !name) {
            setTeacherBulkMsg({ type: 'error', text: `Row ${i + 1} is missing a User ID or Name.` });
            return;
          }

          if (id.toLowerCase() === 'admin' || id.toLowerCase() === 'guest') {
             setTeacherBulkMsg({ type: 'error', text: `Row ${i + 1} uses a reserved ID (${id}).` });
             return;
          }

          if (usedIds.has(id)) {
            setTeacherBulkMsg({ type: 'error', text: `Row ${i + 1} has an ID (${id}) that is already in use.` });
            return;
          }

          usedIds.add(id);

          let passHash = '';
          if (passwords[i]) {
            passHash = await hashPassword(passwords[i]);
          }

          newTeachers.push({
            id, 
            name,
            role: 'regular',
            passwordHash: passHash
          });
        }

        try {
          setTeacherBulkMsg({ type: 'success', text: `Saving ${newTeachers.length} teachers...` });
          await Promise.all(newTeachers.map(t => setDoc(doc(db, TEACHERS_PATH, t.id), t)));
          setTeacherBulkMsg({ type: 'success', text: `Successfully imported ${newTeachers.length} teachers!` });
          setTimeout(() => {
            setIsTeacherBulkAdding(false);
            setTeacherBulkData({ ids: '', names: '', passwords: '' });
            setTeacherBulkMsg({ type: '', text: '' });
          }, 2000);
        } catch (err) {
          setTeacherBulkMsg({ type: 'error', text: 'Error saving teachers: ' + err.message });
        }
      };

      const handleAnalyzeSync = async () => {
        const ids = syncData.ids.split('\n').map(s => s.trim());
        const names = syncData.names.split('\n').map(s => s.trim());
        const classes = syncData.classNames.split('\n').map(s => s.trim());
        const classNums = syncData.classNumbers.split('\n').map(s => s.trim());
        const passwords = syncData.passwords.split('\n').map(s => s.trim());

        const maxRows = Math.max(ids.length, names.length);
        const parsedStudents = [];
        const inputIds = new Set();

        for (let i = 0; i < maxRows; i++) {
          const id = ids[i] || '';
          const name = names[i] || '';
          
          if (!id && !name && !(classes[i] || '') && !(classNums[i] || '') && !(passwords[i] || '')) continue;
          
          if (!id || !name) {
            setSyncMsg({ type: 'error', text: `Row ${i + 1} is missing a User ID or Name.` });
            return;
          }
          if (inputIds.has(id)) {
            setSyncMsg({ type: 'error', text: `Duplicate ID in import list: ${id}` });
            return;
          }

          inputIds.add(id);

          let passHash = '';
          if (passwords[i]) {
            passHash = await hashPassword(passwords[i]);
          }

          parsedStudents.push({
            id, name,
            className: classes[i] || '',
            classNumber: classNums[i] || '',
            passwordHash: passHash
          });
        }

        const existingRegulars = students.filter(s => !s.isGuest);
        const existingIds = new Set(existingRegulars.map(s => s.id));

        const toAdd = [];
        const toUpdate = [];
        parsedStudents.forEach(s => {
          if (existingIds.has(s.id)) {
            toUpdate.push(s);
          } else {
            toAdd.push(s);
          }
        });

        const toDelete = existingRegulars.filter(s => !inputIds.has(s.id));

        setSyncAnalysis({ toAdd, toUpdate, toDelete });
        setSyncKeepIds([]); 
        setSyncStep('review');
        setSyncMsg({ type: '', text: '' });
      };

      const handleExecuteSync = async () => {
        setSyncMsg({ type: 'success', text: 'Executing sync...' });
        try {
          await Promise.all(syncAnalysis.toAdd.map(s => setDoc(doc(db, STUDENTS_PATH, s.id), s)));
          
          await Promise.all(syncAnalysis.toUpdate.map(s => {
            const updateData = { name: s.name, className: s.className, classNumber: s.classNumber };
            if (s.passwordHash) updateData.passwordHash = s.passwordHash;
            return setDoc(doc(db, STUDENTS_PATH, s.id), updateData, { merge: true });
          }));

          const actuallyDelete = syncAnalysis.toDelete.filter(s => !syncKeepIds.includes(s.id));
          if (actuallyDelete.length > 0) {
            const deleteIds = actuallyDelete.map(s => s.id);
            await Promise.all(deleteIds.map(id => deleteDoc(doc(db, STUDENTS_PATH, id))));
            await Promise.all(deleteIds.map(id => deleteDoc(doc(db, PROGRESS_PATH, id))));
            
            const affectedGroups = groups.filter(g => g.students?.some(sId => deleteIds.includes(sId)));
            await Promise.all(affectedGroups.map(g => {
              const newStudents = g.students.filter(sId => !deleteIds.includes(sId));
              return setDoc(doc(db, GROUPS_PATH, g.id), { ...g, students: newStudents });
            }));
          }

          setSyncMsg({ type: 'success', text: `Sync completed! Added ${syncAnalysis.toAdd.length}, Updated ${syncAnalysis.toUpdate.length}, Deleted ${actuallyDelete.length}.` });
          setTimeout(() => {
            setIsSyncing(false);
            setSyncStep('input');
            setSyncData({ ids: '', names: '', classNames: '', classNumbers: '', passwords: '' });
            setSyncMsg({ type: '', text: '' });
          }, 3000);
        } catch (err) {
          setSyncMsg({ type: 'error', text: 'Error during sync: ' + err.message });
        }
      };

      const handleChapterFileSelect = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.games && Array.isArray(data.games)) {
              for (const game of data.games) {
                const newGameId = `game_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
                const newGame = { ...game, id: newGameId, title: `${game.title} (Imported)`, teacherId: teacher.id };
                await setDoc(doc(db, GAMES_PATH, newGameId), newGame);
              }
              setChapterImportMsg({ type: 'success', text: 'Chapter imported successfully!' });
              setTimeout(() => setChapterImportMsg({ type: '', text: '' }), 3000);
            } else {
              setChapterImportMsg({ type: 'error', text: 'Invalid chapter file format.' });
              setTimeout(() => setChapterImportMsg({ type: '', text: '' }), 3000);
            }
          } catch (err) {
            setChapterImportMsg({ type: 'error', text: 'Failed to parse chapter file.' });
            setTimeout(() => setChapterImportMsg({ type: '', text: '' }), 3000);
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      // Filter views based on roles
      let computedGroups = [...groups];
      const guestIdx = computedGroups.findIndex(g => g.id === 'guest_group');
      if (guestIdx === -1) {
        computedGroups.unshift({
          id: 'guest_group',
          title: 'Guest Lounge',
          description: 'Special group for Guest accounts. Configure which chapters guests can access.',
          chapters: [],
          students: [],
          imageUrl: 'https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&q=80&w=800',
          isSystem: true
        });
      } else {
        computedGroups[guestIdx] = { ...computedGroups[guestIdx], isSystem: true };
        const [gg] = computedGroups.splice(guestIdx, 1);
        computedGroups.unshift(gg);
      }

      const displayGames = isAdmin 
        ? (gameFilterTeacher ? games.filter(g => g.teacherId === gameFilterTeacher) : games)
        : games.filter(g => g.teacherId === teacher.id);
      
      const displayGroups = isAdmin 
        ? (groupFilterTeacher ? computedGroups.filter(g => g.isSystem || g.teacherId === groupFilterTeacher) : computedGroups)
        : computedGroups.filter(g => g.isSystem || g.teacherId === teacher.id);

      return (
        <div className="space-y-6">
          {!editingGame && !editingGroup && !showAIGenerator ? (
            <>
              <div className="flex space-x-4 border-b border-slate-700 pb-2 overflow-x-auto custom-scrollbar">
                <button className={`pb-2 px-4 font-semibold text-sm md:text-lg transition-colors whitespace-nowrap flex items-center gap-2 ${activeTab === 'groups' ? 'text-emerald-400 border-b-2 border-emerald-400' : 'text-slate-400 hover:text-slate-200'}`} onClick={() => setActiveTab('groups')}>
                  <Library className="w-5 h-5" /> {t('Groups')}
                </button>
                <button className={`pb-2 px-4 font-semibold text-sm md:text-lg transition-colors whitespace-nowrap flex items-center gap-2 ${activeTab === 'games' ? 'text-emerald-400 border-b-2 border-emerald-400' : 'text-slate-400 hover:text-slate-200'}`} onClick={() => setActiveTab('games')}>
                  <Layers className="w-5 h-5" /> {t('Chapters')}
                </button>
                <button className={`pb-2 px-4 font-semibold text-sm md:text-lg transition-colors whitespace-nowrap flex items-center gap-2 ${activeTab === 'students' ? 'text-emerald-400 border-b-2 border-emerald-400' : 'text-slate-400 hover:text-slate-200'}`} onClick={() => setActiveTab('students')}>
                  <Users className="w-5 h-5" /> {t('Students')}
                </button>
                {isAdmin && (
                  <button className={`pb-2 px-4 font-semibold text-sm md:text-lg transition-colors whitespace-nowrap flex items-center gap-2 ${activeTab === 'teachers' ? 'text-purple-400 border-b-2 border-purple-400' : 'text-slate-400 hover:text-slate-200'}`} onClick={() => setActiveTab('teachers')}>
                    <ShieldAlert className="w-5 h-5" /> {t('Teachers')}
                  </button>
                )}
                <button className={`pb-2 px-4 font-semibold text-sm md:text-lg transition-colors whitespace-nowrap flex items-center gap-2 ${activeTab === 'progress' ? 'text-emerald-400 border-b-2 border-emerald-400' : 'text-slate-400 hover:text-slate-200'}`} onClick={() => setActiveTab('progress')}>
                  <Award className="w-5 h-5" /> {t('Progress')}
                </button>
                <button className={`pb-2 px-4 font-semibold text-sm md:text-lg transition-colors whitespace-nowrap flex items-center gap-2 ${activeTab === 'backup' ? 'text-emerald-400 border-b-2 border-emerald-400' : 'text-slate-400 hover:text-slate-200'}`} onClick={() => setActiveTab('backup')}>
                  <Database className="w-5 h-5" /> {t('Settings')}
                </button>
              </div>

              {activeTab === 'groups' && (
                  <div className="space-y-6">
                    <div className="flex justify-between items-center">
                      <h2 className="text-2xl font-bold text-white">{t('Your Groups / Classrooms')}</h2>
                      <div className="flex gap-2 items-center">
                        {isAdmin && (
                          <select 
                            value={groupFilterTeacher}
                            onChange={(e) => setGroupFilterTeacher(e.target.value)}
                            className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-sm focus:outline-none focus:border-emerald-500 mr-2"
                          >
                            <option value="">{t('All Teachers')}</option>
                            <option value={teacher.id}>{t('My Groups')}</option>
                            {teachers.filter(t => t.id !== teacher.id).map(t => (
                              <option key={t.id} value={t.id}>{t.name}</option>
                            ))}
                          </select>
                        )}
                        <button onClick={() => setEditingGroup({ id: `group_${Date.now()}`, title: 'New Group', description: '', imageUrl: '', chapters: [], students: [], teacherId: teacher.id })} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 md:px-4 py-2 rounded-lg font-medium flex items-center space-x-2 transition-colors text-sm md:text-base shadow-lg">
                          <Plus className="w-4 h-4" /> <span className="hidden md:inline">{t('Create Group')}</span>
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {displayGroups.map(group => {
                        const isReadOnly = !group.isSystem && group.teacherId !== teacher.id;
                        return (
                          <div key={group.id} className={`bg-slate-800 rounded-xl p-6 border ${group.isSystem ? 'border-blue-500/50' : 'border-slate-700'} hover:border-emerald-500/50 transition-colors flex flex-col relative shadow-lg group/card`}>
                            {group.imageUrl && (
                              <div className="w-full h-32 mb-4 rounded-lg overflow-hidden shrink-0 border border-slate-700 shadow-inner">
                                 <img src={group.imageUrl} alt="Group Cover" className="w-full h-full object-cover group-hover/card:scale-105 transition-transform duration-500" />
                              </div>
                            )}
                            <div className="flex justify-between items-start mb-2">
                              <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                {group.title}
                                {group.isSystem && <span className="bg-blue-900/50 text-blue-400 text-[10px] px-2 py-0.5 rounded border border-blue-700/50 uppercase tracking-wider">{t('System')}</span>}
                              </h3>
                            </div>
                            <p className="text-slate-400 text-sm mb-6 line-clamp-2">{group.description || t('No description provided.')}</p>
                            <div className="mt-auto flex justify-between items-center border-t border-slate-700 pt-4">
                              <div className="flex gap-3 text-xs font-semibold text-slate-400">
                                <span className="flex items-center gap-1 bg-slate-900 px-2 py-1 rounded border border-slate-700"><Layers className="w-3 h-3 text-emerald-400" /> {group.chapters?.length || 0}</span>
                                {!group.isSystem && <span className="flex items-center gap-1 bg-slate-900 px-2 py-1 rounded border border-slate-700"><Users className="w-3 h-3 text-blue-400" /> {group.students?.length || 0}</span>}
                                {group.isSystem && <span className="flex items-center gap-1 bg-slate-900 px-2 py-1 rounded border border-slate-700 text-blue-400"><Users className="w-3 h-3" /> {t('Guests')}</span>}
                              </div>
                              <div className="flex space-x-2">
                                <button onClick={() => setEditingGroup(group)} className="p-2 text-slate-300 hover:text-emerald-400 hover:bg-slate-700 rounded-lg transition-colors" title={isReadOnly ? t("View Group") : t("Edit Group")}>
                                  {isReadOnly ? <Eye className="w-5 h-5" /> : <Edit3 className="w-5 h-5" />}
                                </button>
                                {!group.isSystem && !isReadOnly && (
                                  <button 
                                    onClick={async () => { 
                                      if (confirmDeleteId === group.id) {
                                        await deleteDoc(doc(db, GROUPS_PATH, group.id));
                                        setConfirmDeleteId(null);
                                      } else {
                                        setConfirmDeleteId(group.id);
                                        setTimeout(() => setConfirmDeleteId(null), 3000);
                                      }
                                    }} 
                                    className={`p-2 rounded-lg transition-colors ${confirmDeleteId === group.id ? 'bg-red-600 text-white font-bold text-xs px-3' : 'text-red-400 hover:text-red-300 hover:bg-red-400/10'}`}
                                  >
                                    {confirmDeleteId === group.id ? t('Confirm?') : <Trash2 className="w-5 h-5" />}
                                  </button>
                                )}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
              )}

              {activeTab === 'games' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <h2 className="text-2xl font-bold text-white">{t('Your Chapters')}</h2>
                    <div className="flex gap-2 items-center">
                      {isAdmin && (
                        <select

                          onChange={(e) => setGameFilterTeacher(e.target.value)}

                          <option value="">{t('All Teachers')}</option>
                          <option value={teacher.id}>{t('My Chapters')}</option>
                          {teachers.filter(t => t.id !== teacher.id).map(t => (
                            <option key={t.id} value={t.id}>{t.name}</option>

                        </select>

                        <Sparkles className="w-4 h-4" /> <span className="hidden md:inline">{t('AI Generate')}</span>
                      </button>
                      <button onClick={() => chapterFileInputRef.current.click()} className="bg-blue-600 hover:bg-blue-500 text-white px-3 md:px-4 py-2 rounded-lg font-medium flex items-center space-x-2 transition-colors text-sm md:text-base shadow-lg">
                        <Upload className="w-4 h-4" /> <span className="hidden md:inline">{t('Import')}</span>
                      </button>
                      <button onClick={() => { setEditingGame({ id: `game_${Date.now()}`, title: 'New Chapter', description: '', mapImageUrl: '', chapterImageUrl: '', themeColor: 'slate', nodes: [], definedItems: [], teacherId: teacher.id }); setActiveTheme('slate'); }} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 md:px-4 py-2 rounded-lg font-medium flex items-center space-x-2 transition-colors text-sm md:text-base shadow-lg">
                        <Plus className="w-4 h-4" /> <span className="hidden md:inline">{t('Create')}</span>
                      </button>
                    </div>
                  </div>

                  {chapterImportMsg.text && (
                    <div className={`p-3 rounded-lg text-sm font-bold flex items-center gap-2 ${chapterImportMsg.type === 'error' ? 'bg-red-900/20 text-red-400 border border-red-800/50' : 'bg-emerald-900/20 text-emerald-400 border border-emerald-800/50'}`}>
                      {chapterImportMsg.type === 'error' ? <AlertTriangle className="w-4 h-4"/> : <CheckCircle className="w-4 h-4"/>}
                      {t(chapterImportMsg.text)}
                    </div>
                  )}

                  {displayGames.length === 0 ? (
                    <div className="bg-slate-800 rounded-xl p-10 text-center border border-slate-700">
                      <MapIcon className="w-12 h-12 text-slate-500 mx-auto mb-4" />
                      <h3 className="text-xl font-semibold text-slate-300">{t('No Chapters Yet')}</h3>
                      <p className="text-slate-400 mt-2">{t('Create chapters (games) here, then assign them to Groups.')}</p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {displayGames.map(game => (
                        <div key={game.id} className="bg-slate-800 rounded-xl p-6 border border-slate-700 hover:border-slate-500 transition-colors flex flex-col relative">
                          {game.chapterImageUrl && (
                            <div className="w-full h-32 mb-4 rounded-lg overflow-hidden shrink-0 border border-slate-700 shadow-inner">
                               <img src={game.chapterImageUrl} alt="Chapter Illustration" className="w-full h-full object-cover opacity-80" />
                            </div>
                          )}
                          <div className="flex justify-between items-start mb-2">
                            <h3 className="text-xl font-bold text-white">{game.title}</h3>
                            {game.mapImageUrl && <MapIcon className="w-5 h-5 text-emerald-500/50" />}
                          </div>
                          <p className="text-slate-400 text-sm mb-4 line-clamp-2">{game.description}</p>
                          <div className="mt-auto flex justify-between items-center border-t border-slate-700 pt-4">
                            <span className="text-xs font-bold text-emerald-400 bg-emerald-900/30 px-3 py-1.5 rounded border border-emerald-800/50 flex items-center gap-1">
                              <MapPin className="w-3 h-3"/> {game.nodes?.length || 0} {t('Quests')}
                            </span>
                            <div className="flex space-x-2">
                              <button onClick={() => handleExportSingleChapter(game)} className="p-2 text-slate-300 hover:text-blue-400 hover:bg-slate-700 rounded-lg transition-colors" title={t("Export Chapter")}>
                                <Download className="w-5 h-5" />
                              </button>
                              {(() => {
                                const isReadOnly = game.teacherId !== teacher.id;
                                return (
                                  <>
                                    <button onClick={() => { setEditingGame(game); setActiveTheme(game.themeColor || 'slate'); }} className="p-2 text-slate-300 hover:text-emerald-400 hover:bg-slate-700 rounded-lg transition-colors" title={isReadOnly ? t("View Chapter") : t("Edit Chapter")}>
                                      {isReadOnly ? <Eye className="w-5 h-5" /> : <Edit3 className="w-5 h-5" />}
                                    </button>
                                    
                                    {!isReadOnly && (
                                      <button 
                                        onClick={async () => { 
                                          if (confirmDeleteId === game.id) {
                                            await deleteDoc(doc(db, GAMES_PATH, game.id));
                                            
                                            // Clean up references in groups
                                            const affectedGroups = groups.filter(g => g.chapters?.includes(game.id));
                                            await Promise.all(affectedGroups.map(g => {
                                              const newChapters = g.chapters.filter(cId => cId !== game.id);
                                              return setDoc(doc(db, GROUPS_PATH, g.id), { ...g, chapters: newChapters });
                                            }));

                                            setConfirmDeleteId(null);
                                          } else {
                                            setConfirmDeleteId(game.id);
                                            setTimeout(() => setConfirmDeleteId(null), 3000);
                                          }
                                        }} 
                                        className={`p-2 rounded-lg transition-colors ${confirmDeleteId === game.id ? 'bg-red-600 text-white font-bold text-xs px-3' : 'text-red-400 hover:text-red-300 hover:bg-red-400/10'}`}
                                      >
                                        {confirmDeleteId === game.id ? t('Confirm?') : <Trash2 className="w-5 h-5" />}
                                      </button>
                                    )}
                                  </>
                                );
                              })()}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {activeTab === 'students' && (
                <div className="space-y-6">
                  {!editingStudent && !isBulkAdding && !isSyncing ? (
                    <>
                      <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                          <Users className="w-6 h-6 text-blue-400" /> {t('Student Accounts')}
                        </h2>
                        {isAdmin && (
                          <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                            <select 
                              value={accountFilter}
                              onChange={(e) => setAccountFilter(e.target.value)}
                              className="bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-white text-sm focus:outline-none focus:border-blue-500 mr-2"
                            >
                              <option value="regular">{t('Regular Accounts')}</option>
                              <option value="guest">{t('Guest Devices')}</option>
                              <option value="all">{t('All Accounts')}</option>
                            </select>
                            {accountFilter === 'guest' && (
                              <button onClick={handleClearAllGuests} className={`px-3 md:px-4 py-2 rounded-lg font-medium flex items-center space-x-2 transition-colors text-sm md:text-base shadow-lg ${confirmClearAllGuests ? 'bg-red-700 text-white' : 'bg-red-600 hover:bg-red-500 text-white'}`}>
                                <Trash2 className="w-4 h-4" /> <span className="hidden md:inline">{confirmClearAllGuests ? t('Confirm Clear?') : t('Clear Guests')}</span>
                              </button>
                            )}
                            <button onClick={() => { setIsSyncing(true); setSyncStep('input'); }} className="bg-amber-600 hover:bg-amber-500 text-white px-3 md:px-4 py-2 rounded-lg font-medium flex items-center space-x-2 transition-colors text-sm md:text-base shadow-lg">
                              <RefreshCw className="w-4 h-4" /> <span className="hidden md:inline">{t('Sync Accounts')}</span>
                            </button>
                            <button onClick={() => setIsBulkAdding(true)} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 md:px-4 py-2 rounded-lg font-medium flex items-center space-x-2 transition-colors text-sm md:text-base shadow-lg">
                              <Users className="w-4 h-4" /> <span className="hidden md:inline">{t('Bulk Add')}</span>
                            </button>
                            <button onClick={() => { setEditingStudent({ id: '', name: '', className: '', classNumber: '', passwordHash: '', newPassword: '' }); setIsNewStudent(true); setStudentEditError(''); }} className="bg-blue-600 hover:bg-blue-500 text-white px-3 md:px-4 py-2 rounded-lg font-medium flex items-center space-x-2 transition-colors text-sm md:text-base shadow-lg">
                              <Plus className="w-4 h-4" /> <span className="hidden md:inline">{t('Add Student')}</span>
                            </button>
                          </div>
                        )}
                      </div>
                      
                      <div className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
                        <table className="w-full text-left">
                          <thead className="bg-slate-900/50">
                            <tr>
                              <th className="p-4 text-slate-300 font-semibold">{t('User ID')}</th>
                              <th className="p-4 text-slate-300 font-semibold">{t('Name')}</th>
                              <th className="p-4 text-slate-300 font-semibold">{t('Class / No.')}</th>
                              <th className="p-4 text-slate-300 font-semibold">{t('Password Status')}</th>
                              {isAdmin && <th className="p-4 text-slate-300 font-semibold text-right">{t('Actions')}</th>}
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-700/50">
                            {(() => {
                              const filteredStudents = students.filter(s => {
                                if (accountFilter === 'regular') return !s.isGuest;
                                if (accountFilter === 'guest') return s.isGuest;
                                return true;
                              });

                              if (filteredStudents.length === 0) {
                                return <tr><td colSpan={isAdmin ? "5" : "4"} className="p-8 text-center text-slate-500">No students found for the selected filter.</td></tr>;
                              }

                              return filteredStudents.sort((a, b) => {
                                const classA = a.className || '';
                                const classB = b.className || '';
                                const classComp = classA.localeCompare(classB);
                                if (classComp !== 0) return classComp;
                                const numA = a.classNumber || '';
                                const numB = b.classNumber || '';
                                return numA.localeCompare(numB, undefined, { numeric: true });
                              }).map(student => (
                                <tr key={student.id} className="hover:bg-slate-700/20 transition-colors">
                                  <td className="p-4 text-sm font-medium text-slate-300">{student.id}</td>
                                  <td className="p-4 font-bold text-white">
                                    {student.name}
                                    {student.isGuest && <span className="ml-2 bg-blue-900/50 text-blue-400 text-[10px] px-2 py-0.5 rounded border border-blue-700/50 uppercase tracking-wider">{t('Guest Device')}</span>}
                                  </td>
                                  <td className="p-4 text-sm text-slate-400">{student.className} - {student.classNumber}</td>
                                  <td className="p-4">
                                    {student.isGuest ? (
                                      <span className="text-slate-500 text-xs italic">N/A</span>
                                    ) : student.passwordHash ? (
                                      <span className="font-mono text-emerald-400 bg-emerald-900/20 px-2 py-1 rounded border border-emerald-800/50 text-xs">{t('Custom Password')}</span>
                                    ) : (
                                      <span className="font-mono text-amber-400 bg-amber-900/20 px-2 py-1 rounded border border-amber-800/50 text-xs">{t('Default (User ID)')}</span>
                                    )}
                                  </td>
                                  {isAdmin && (
                                    <td className="p-4 flex justify-end">
                                      <div className="flex space-x-2">
                                        {!student.isGuest && (
                                          <button onClick={() => { setEditingStudent({ ...student, newPassword: '' }); setIsNewStudent(false); setStudentEditError(''); }} className="p-2 text-slate-400 hover:text-emerald-400 hover:bg-slate-700 rounded-lg transition-colors">
                                            <Edit3 className="w-4 h-4" />
                                          </button>
                                        )}
                                        <button 
                                          onClick={async () => { 
                                            if (confirmDeleteStudentId === student.id) {
                                              await deleteDoc(doc(db, STUDENTS_PATH, student.id)); 
                                              
                                              // Clean up references in groups
                                              const affectedGroups = groups.filter(g => g.students?.includes(student.id));
                                              await Promise.all(affectedGroups.map(g => {
                                                const newStudents = g.students.filter(sId => sId !== student.id);
                                                return setDoc(doc(db, GROUPS_PATH, g.id), { ...g, students: newStudents });
                                              }));
                                              setConfirmDeleteStudentId(null);
                                            } else {
                                              setConfirmDeleteStudentId(student.id);
                                              setTimeout(() => setConfirmDeleteStudentId(null), 3000);
                                            }
                                          }} 
                                          className={`p-2 rounded-lg transition-colors ${confirmDeleteStudentId === student.id ? 'bg-red-600 text-white font-bold text-xs px-3' : 'text-red-400 hover:text-red-300 hover:bg-red-400/10'}`}
                                        >
                                          {confirmDeleteStudentId === student.id ? t('Confirm?') : <Trash2 className="w-4 h-4" />}
                                        </button>
                                      </div>
                                    </td>
                                  )}
                                </tr>
                              ));
                            })()}
                          </tbody>
                        </table>
                      </div>
                    </>
                  ) : isBulkAdding ? (
                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                      <h3 className="text-xl font-bold text-white mb-2 border-b border-slate-700 pb-2">
                        Bulk Add Students
                      </h3>
                      <p className="text-sm text-slate-400 mb-6">Paste columns of data directly from your spreadsheet (Excel, Google Sheets). Ensure each column has the same number of rows. If you leave the Password column blank, the student's password will default to their User ID.</p>
                      
                      <div className="overflow-x-auto">
                        <div className="min-w-[700px] grid grid-cols-5 gap-4">

                          </div>
                          <div>
                            <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1">Passwords (Optional)</label>
                            <textarea value={teacherBulkData.passwords} onChange={e => setTeacherBulkData({...teacherBulkData, passwords: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white h-64 whitespace-pre font-mono text-xs focus:outline-none focus:border-purple-500" placeholder="p@ssword1&#10;&#10;secret7..." wrap="off" />
                          </div>
                        </div>
                        {teacherBulkMsg.text && (
                          <div className={`mt-4 p-3 rounded-lg text-sm font-bold flex items-center gap-2 ${teacherBulkMsg.type === 'error' ? 'bg-red-900/20 text-red-400 border border-red-800/50' : 'bg-emerald-900/20 text-emerald-400 border border-emerald-800/50'}`}>
                            {teacherBulkMsg.type === 'error' ? <AlertTriangle className="w-4 h-4"/> : <CheckCircle className="w-4 h-4"/>}
                            {teacherBulkMsg.text}
                          </div>
                        )}
                      </div>

                      <div className="flex justify-end gap-3 pt-6 border-t border-slate-700 mt-6">
                        <button onClick={() => { setIsTeacherBulkAdding(false); setTeacherBulkData({ ids: '', names: '', passwords: '' }); setTeacherBulkMsg({type: '', text: ''}); }} className="px-4 py-2 text-slate-300 hover:bg-slate-700 rounded-lg transition-colors">Cancel</button>
                        <button 
                          onClick={handleTeacherBulkSave} 
                          className="px-6 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-lg font-bold transition-colors shadow-lg"
                        >
                          Import Teachers
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg max-w-2xl mx-auto">
                      <h3 className="text-xl font-bold text-white mb-6 border-b border-slate-700 pb-2">
                        {isNewTeacherAcc ? 'Create Teacher Account' : 'Edit Teacher Account'}
                      </h3>
                      <div className="space-y-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">User ID (Unique Login ID)</label>
                          <input type="text" disabled={!isNewTeacherAcc} value={editingTeacherAccount.id} onChange={(e) => setEditingTeacherAccount({...editingTeacherAccount, id: e.target.value})} className={`w-full bg-slate-900 border border-slate-700 rounded p-2 text-white ${!isNewTeacherAcc && 'opacity-50 cursor-not-allowed text-slate-500'}`} placeholder="e.g. jsmith" />
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Display Name</label>
                            <input type="text" value={editingTeacherAccount.name} onChange={(e) => setEditingTeacherAccount({...editingTeacherAccount, name: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" placeholder="e.g. Mr. Smith" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Role</label>
                            <select value={editingTeacherAccount.role} onChange={(e) => setEditingTeacherAccount({...editingTeacherAccount, role: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
                              <option value="regular">Regular Teacher</option>
                              <option value="admin">System Admin</option>
                            </select>
                          </div>
                          <div className="flex flex-col justify-end md:col-span-2">
                            {isNewTeacherAcc ? (
                              <div>
                                <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Initial Password (Optional)</label>
                                <input type="text" value={editingTeacherAccount.newPassword} onChange={(e) => setEditingTeacherAccount({...editingTeacherAccount, newPassword: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" placeholder="Defaults to User ID if left blank" />
                              </div>
                            ) : (
                              <div>
                                <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Reset / Change Password</label>
                                <div className="flex flex-col sm:flex-row gap-2">
                                  <input type="text" value={editingTeacherAccount.newPassword} onChange={(e) => setEditingTeacherAccount({...editingTeacherAccount, newPassword: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white flex-1" placeholder="Type new password here..." />
                                  <button onClick={() => setEditingTeacherAccount({...editingTeacherAccount, passwordHash: '', newPassword: ''})} className="bg-amber-600/20 text-amber-400 hover:bg-amber-600 hover:text-white border border-amber-600/50 px-3 py-2 rounded text-sm font-semibold transition-colors shrink-0">
                                    Reset to Default (User ID)
                                  </button>
                                </div>
                              </div>
                            )}
                          </div>
                        </div>
                        {teacherEditError && (
                          <div className="p-3 bg-red-900/20 border border-red-800/50 rounded-lg flex items-center gap-2 text-red-400 text-sm font-bold mt-2">
                            <AlertTriangle className="w-4 h-4 shrink-0" />
                            {teacherEditError}
                          </div>
                        )}
                        <div className="flex justify-end gap-3 pt-6 border-t border-slate-700 mt-6">
                          <button onClick={() => { setEditingTeacherAccount(null); setTeacherEditError(''); }} className="px-4 py-2 text-slate-300 hover:bg-slate-700 rounded-lg transition-colors">Cancel</button>
                          <button 
                            onClick={async () => {
                              const trimmedId = editingTeacherAccount.id.trim();
                              const trimmedName = editingTeacherAccount.name.trim();

                              if (!trimmedId || !trimmedName) {
                                setTeacherEditError("User ID and Name are required.");
                                return;
                              }

                              if (trimmedId.toLowerCase() === 'admin' || trimmedId.toLowerCase() === 'guest') {
                                setTeacherEditError("This User ID is reserved by the system.");
                                return;
                              }
